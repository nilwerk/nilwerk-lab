    <text x="72" y="626" fill="var(--nw-ink)">{{H2}}</text>
    <text x="72" y="722" fill="var(--nw-accent)">{{H3}}</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="34" fill="var(--nw-muted)"><text x="72" y="792">{{INTRO1}}</text><text x="72" y="836">{{INTRO2}}</text></g>
  <rect x="72" y="880" width="936" height="250" rx="18" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="2"/>
  <rect x="72" y="880" width="936" height="10" rx="5" fill="{{TONE_A}}"/>
  <text x="100" y="940" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="{{TONE_A}}">{{TILE_A_LABEL}}</text>
  <text x="100" y="1010" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="70" letter-spacing="-2.1" fill="var(--nw-ink)">{{TILE_A_VALUE}}</text>
  <text x="100" y="1068" font-family="Inter, sans-serif" font-size="24" fill="var(--nw-muted)">{{TILE_A_SUB1}}</text>
  <text x="100" y="1114" font-family="Inter, sans-serif" font-size="24" fill="var(--nw-muted)">{{TILE_A_SUB2}}</text>
  <rect x="72" y="1146" width="936" height="250" rx="18" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="2"/>
  <rect x="72" y="1146" width="936" height="10" rx="5" fill="{{TONE_B}}"/>
  <text x="100" y="1206" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="{{TONE_B}}">{{TILE_B_LABEL}}</text>
  <text x="100" y="1276" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="70" letter-spacing="-2.1" fill="var(--nw-ink)">{{TILE_B_VALUE}}</text>
  <text x="100" y="1334" font-family="Inter, sans-serif" font-size="24" fill="var(--nw-muted)">{{TILE_B_SUB1}}</text>
  <text x="100" y="1380" font-family="Inter, sans-serif" font-size="24" fill="var(--nw-muted)">{{TILE_B_SUB2}}</text>
  <rect x="72" y="1416" width="{{STATUS_W}}" height="48" rx="8" fill="none" stroke="var(--nw-warn)" stroke-width="2"/>
  <text x="91" y="1449" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1.1" fill="var(--nw-warn)">{{STATUS}}</text>
  <text x="72" y="1500" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="var(--nw-accent)">FOR ENGINEERS</text>
