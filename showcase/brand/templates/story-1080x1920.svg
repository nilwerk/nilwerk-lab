<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk v0.1 template: Instagram story 1080x1920, safe area y 250-1580. Placeholders {{...}}; colours var(--nw-*) from brand.css / brand-status.css. -->
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--nw-line)" stroke-width="1.5" opacity=".55"/></pattern></defs>
  <rect width="1080" height="1920" fill="var(--nw-bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
<g transform="translate(72 262) scale(2.0)"><rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/><path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/><circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/><path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/></g>
  <text x="148" y="312" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="var(--nw-ink)">nil<tspan fill="var(--nw-accent)">werk</tspan></text>
  <text x="1008" y="310" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="22" fill="var(--nw-muted)">{{HANDLE}}</text>
  <rect x="72" y="360" width="{{KICKER_W}}" height="50" rx="25.0" fill="var(--nw-accent-soft)" stroke="var(--nw-accent)" stroke-width="2"/>
