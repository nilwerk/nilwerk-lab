<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk post template v0.1 (PROPOSAL). LinkedIn landscape 1.91:1. Placeholders: {{...}}. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="var(--nw-line)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="var(--nw-bg)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>

  <g transform="translate(56 36) scale(1.5)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="116" y="74" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="-0.9" fill="var(--nw-ink)">nil<tspan fill="var(--nw-accent)">werk</tspan></text>

  <rect x="56" y="108" width="{{KICKER_W}}" height="38" rx="19" fill="var(--nw-accent-soft)" stroke="var(--nw-accent)" stroke-width="1.5"/>
  <text x="74" y="133" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.9" fill="var(--nw-accent)">{{KICKER}}</text>

  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="54" letter-spacing="-1.4">
    <text x="56" y="222" fill="var(--nw-ink)">{{H1}}</text>
    <text x="56" y="286" fill="var(--nw-ink)">{{H2}}</text>
    <text x="56" y="350" fill="var(--nw-accent)">{{H3}}</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="23" fill="var(--nw-muted)">
    <text x="56" y="400">{{INTRO1}}</text>
    <text x="56" y="430">{{INTRO2}}</text>
  </g>

  <rect x="56" y="462" width="{{STATUS_W}}" height="34" rx="6" fill="none" stroke="var(--nw-warn)" stroke-width="1.5"/>
  <text x="72" y="485" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="15" letter-spacing="0.8" fill="var(--nw-warn)">{{STATUS}}</text>

  <!-- tiles, right column -->
  <g>
    <rect x="690" y="48" width="454" height="230" rx="14" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="1.5"/>
    <rect x="690" y="48" width="8" height="230" rx="4" fill="{{TONE_A}}"/>
    <text x="722" y="86" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.8" fill="{{TONE_A}}">{{TILE_A_LABEL}}</text>
    <text x="722" y="170" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.3" fill="var(--nw-ink)">{{TILE_A_VALUE}}</text>
    <text x="722" y="212" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_A_SUB1}}</text>
    <text x="722" y="238" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_A_SUB2}}</text>
    <text x="722" y="264" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_A_SUB3}}</text>
  </g>
  <g>
    <rect x="690" y="298" width="454" height="230" rx="14" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="1.5"/>
    <rect x="690" y="298" width="8" height="230" rx="4" fill="{{TONE_B}}"/>
    <text x="722" y="336" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.8" fill="{{TONE_B}}">{{TILE_B_LABEL}}</text>
    <text x="722" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.3" fill="var(--nw-ink)">{{TILE_B_VALUE}}</text>
    <text x="722" y="462" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_B_SUB1}}</text>
    <text x="722" y="488" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_B_SUB2}}</text>
    <text x="722" y="514" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{TILE_B_SUB3}}</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="15" fill="var(--nw-muted)">
    <text x="56" y="560">{{SRC1}}</text>
    <text x="56" y="581">{{SRC2}}</text>
  </g>
  <line x1="56" y1="594" x2="1144" y2="594" stroke="var(--nw-line)" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="15" fill="var(--nw-muted)">
    <text x="56" y="615">{{HANDLE}}</text>
    <text x="1144" y="615" text-anchor="end">{{FOOT_NOTE}}</text>
  </g>
</svg>
