<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Square 1:1 (Instagram feed, LinkedIn). Placeholders: {{...}}. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="var(--nw-line)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="var(--nw-bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g transform="translate(72 48) scale(2)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="148" y="98" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="var(--nw-ink)">nil<tspan fill="var(--nw-accent)">werk</tspan></text>

  <rect x="72" y="140" width="{{KICKER_W}}" height="48" rx="24" fill="var(--nw-accent-soft)" stroke="var(--nw-accent)" stroke-width="2"/>
  <text x="94" y="172" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.1" fill="var(--nw-accent)">{{KICKER}}</text>

  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="80" letter-spacing="-2.1">
    <text x="72" y="290" fill="var(--nw-ink)">{{H1}}</text>
    <text x="72" y="376" fill="var(--nw-ink)">{{H2}}</text>
    <text x="72" y="462" fill="var(--nw-accent)">{{H3}}</text>
  </g>

  <g>
    <rect x="72" y="510" width="456" height="310" rx="18" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="2"/>
    <rect x="72" y="510" width="456" height="10" rx="5" fill="{{TONE_A}}"/>
    <text x="100" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="{{TONE_A}}">{{TILE_A_LABEL}}</text>
    <text x="100" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="var(--nw-ink)">{{TILE_A_VALUE}}</text>
    <text x="100" y="722" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_A_SUB1}}</text>
    <text x="100" y="756" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_A_SUB2}}</text>
    <text x="100" y="790" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_A_SUB3}}</text>
  </g>
  <g>
    <rect x="552" y="510" width="456" height="310" rx="18" fill="var(--nw-surface)" stroke="var(--nw-line)" stroke-width="2"/>
    <rect x="552" y="510" width="456" height="10" rx="5" fill="{{TONE_B}}"/>
    <text x="580" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="{{TONE_B}}">{{TILE_B_LABEL}}</text>
    <text x="580" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="var(--nw-ink)">{{TILE_B_VALUE}}</text>
    <text x="580" y="722" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_B_SUB1}}</text>
    <text x="580" y="756" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_B_SUB2}}</text>
    <text x="580" y="790" font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">{{TILE_B_SUB3}}</text>
  </g>

  <rect x="72" y="848" width="{{STATUS_W}}" height="46" rx="8" fill="none" stroke="var(--nw-warn)" stroke-width="2"/>
  <text x="92" y="880" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="var(--nw-warn)">{{STATUS}}</text>

  <text x="72" y="932" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="1.5" fill="var(--nw-accent)">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="19" fill="var(--nw-muted)">
    <text x="72" y="958">{{SRC1}}</text>
    <text x="72" y="983">{{SRC2}}</text>
  </g>
  <line x1="72" y1="1004" x2="1008" y2="1004" stroke="var(--nw-line)" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="var(--nw-muted)">
    <text x="72" y="1042">{{HANDLE}}</text>
    <text x="1008" y="1042" text-anchor="end">{{FOOT_NOTE}}</text>
  </g>
</svg>
