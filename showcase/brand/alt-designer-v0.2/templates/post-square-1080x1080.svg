<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1080. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1080" fill="var(--nw-bg)"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 48.0) scale(1.2857142857142858)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="var(--nw-ink)" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="var(--nw-accent)" stroke-width="2"/></g>
  <text x="110" y="88" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="28" letter-spacing="-1.4" fill="var(--nw-ink)">nilwerk</text>
  <text x="1008" y="88" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="1.4" fill="var(--nw-muted)">{{KICKER}}</text>
  <line x1="72" y1="111" x2="1008" y2="111" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="66" letter-spacing="-2.0" fill="var(--nw-ink)">
    <text x="72" y="232">{{H1}}</text>
    <text x="72" y="304">{{H2}}</text>
    <text x="72" y="376">{{H3}}</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="26" fill="var(--nw-muted)">
    <text x="72" y="428">{{INTRO1}}</text>
    <text x="72" y="464">{{INTRO2}}</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 470)">{{TRACE}}</g>
  <line x1="72" y1="548" x2="1008" y2="548" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <text x="72" y="582" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1.4" fill="{{AUX_TONE}}">{{AUX_LABEL}}</text>
  <text x="72" y="634" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="48" letter-spacing="-1" fill="var(--nw-ink)">{{AUX_VALUE}}</text>
  <text x="72" y="664" font-family="Inter, sans-serif" font-size="21" fill="var(--nw-muted)">{{AUX_SUB}}</text>
  <line x1="72" y1="690" x2="1008" y2="690" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <text x="72" y="724" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="var(--nw-accent)">{{HERO_LABEL}}</text>
  <text x="66" y="858" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="170" letter-spacing="-6" fill="var(--nw-ink)">{{HERO_VALUE}}</text>
  <text x="72" y="894" font-family="Inter, sans-serif" font-size="22" fill="var(--nw-muted)">{{HERO_SUB}}</text>
  <rect x="72" y="920" width="14" height="14" fill="var(--nw-warn)"/>
  <text x="95" y="934" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="0.8" fill="var(--nw-ink)">{{STATUS}}</text>
  <text x="72" y="972" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="1.4" fill="var(--nw-accent)">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="var(--nw-muted)"><text x="72" y="994">{{SRC1}}</text><text x="72" y="1016">{{SRC2}}</text></g>
  <line x1="72" y1="1034" x2="1008" y2="1034" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="17" fill="var(--nw-muted)">
    <text x="72" y="1062">{{HANDLE}}</text>
    <text x="1008" y="1062" text-anchor="end">{{FOOT_NOTE}}</text>
  </g>
</svg>
