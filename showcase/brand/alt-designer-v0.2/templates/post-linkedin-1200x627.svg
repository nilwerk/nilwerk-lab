<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1200x627. Hero number right, statement left, trace across. -->
  <rect width="1200" height="627" fill="var(--nw-bg)"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(52 22.0) scale(1.0714285714285714)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="var(--nw-ink)" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="var(--nw-accent)" stroke-width="2"/></g>
  <text x="88" y="55" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="24" letter-spacing="-1.2" fill="var(--nw-ink)">nilwerk</text>
  <text x="1144" y="55" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.4" fill="var(--nw-muted)">{{KICKER}}</text>
  <line x1="56" y1="74" x2="1144" y2="74" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="48" letter-spacing="-1.4" fill="var(--nw-ink)">
    <text x="56" y="150">{{H1}}</text>
    <text x="56" y="204">{{H2}}</text>
    <text x="56" y="258">{{H3}}</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="19" fill="var(--nw-muted)">
    <text x="56" y="302">{{INTRO1}}</text>
    <text x="56" y="328">{{INTRO2}}</text>
  </g>
  <text x="680" y="124" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="1.4" fill="var(--nw-accent)">{{HERO_LABEL}}</text>
  <text x="672" y="244" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="128" letter-spacing="-5" fill="var(--nw-ink)">{{HERO_VALUE}}</text>
  <g font-family="Inter, sans-serif" font-size="17" fill="var(--nw-muted)">
    <text x="680" y="278">{{HERO_SUB1}}</text>
    <text x="680" y="300">{{HERO_SUB2}}</text>
    <text x="680" y="322">{{HERO_SUB3}}</text>
  </g>
  <g transform="translate(0 372)">{{TRACE}}</g>
  <line x1="56" y1="436" x2="1144" y2="436" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <text x="56" y="466" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.4" fill="var(--nw-warn)">{{AUX_LABEL}}</text>
  <text x="56" y="506" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="38" letter-spacing="-1" fill="var(--nw-ink)">{{AUX_VALUE}}</text>
  <text x="56" y="530" font-family="Inter, sans-serif" font-size="15" fill="var(--nw-muted)">{{AUX_SUB}}</text>
  <rect x="680" y="459" width="10" height="10" fill="var(--nw-warn)"/>
  <text x="698" y="470" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="0.8" fill="var(--nw-ink)">{{STATUS}}</text>
  <text x="56" y="554" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.4" fill="var(--nw-accent)">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="var(--nw-muted)"><text x="190" y="554">{{SRC1}}</text><text x="190" y="574">{{SRC2}}</text></g>
  <line x1="56" y1="592" x2="1144" y2="592" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="var(--nw-muted)">
    <text x="56" y="616">{{HANDLE}}</text>
    <text x="1144" y="616" text-anchor="end">{{FOOT_NOTE}}</text>
  </g>
</svg>
