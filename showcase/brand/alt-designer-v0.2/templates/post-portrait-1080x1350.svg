<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="{{ALT}}">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1350. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1350" fill="var(--nw-bg)"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 56.0) scale(1.4285714285714286)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="var(--nw-ink)" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="var(--nw-accent)" stroke-width="2"/></g>
  <text x="114" y="100" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="-1.5" fill="var(--nw-ink)">nilwerk</text>
  <text x="1008" y="100" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1.4" fill="var(--nw-muted)">{{KICKER}}</text>
  <line x1="72" y1="126" x2="1008" y2="126" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="80" letter-spacing="-2.4" fill="var(--nw-ink)">
    <text x="72" y="268">{{H1}}</text>
    <text x="72" y="356">{{H2}}</text>
    <text x="72" y="444">{{H3}}</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="28" fill="var(--nw-muted)">
    <text x="72" y="520">{{INTRO1}}</text>
    <text x="72" y="560">{{INTRO2}}</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 600)">{{TRACE}}</g>
  <line x1="72" y1="716" x2="1008" y2="716" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <text x="72" y="754" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="{{AUX_TONE}}">{{AUX_LABEL}}</text>
  <text x="72" y="814" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="56" letter-spacing="-1" fill="var(--nw-ink)">{{AUX_VALUE}}</text>
  <text x="72" y="850" font-family="Inter, sans-serif" font-size="22" fill="var(--nw-muted)">{{AUX_SUB}}</text>
  <line x1="72" y1="882" x2="1008" y2="882" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <text x="72" y="920" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.4" fill="var(--nw-accent)">{{HERO_LABEL}}</text>
  <text x="64" y="1096" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="220" letter-spacing="-8" fill="var(--nw-ink)">{{HERO_VALUE}}</text>
  <text x="72" y="1138" font-family="Inter, sans-serif" font-size="24" fill="var(--nw-muted)">{{HERO_SUB}}</text>
  <rect x="72" y="1168" width="15" height="15" fill="var(--nw-warn)"/>
  <text x="98" y="1184" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="0.8" fill="var(--nw-ink)">{{STATUS}}</text>
  <text x="72" y="1226" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="var(--nw-accent)">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="var(--nw-muted)"><text x="72" y="1250">{{SRC1}}</text><text x="72" y="1274">{{SRC2}}</text></g>
  <line x1="72" y1="1288" x2="1008" y2="1288" stroke="var(--nw-rule)" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="var(--nw-muted)">
    <text x="72" y="1322">{{HANDLE}}</text>
    <text x="1008" y="1322" text-anchor="end">{{FOOT_NOTE}}</text>
  </g>
</svg>
