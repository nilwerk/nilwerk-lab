<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="One big statement in three short lines at most.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1350. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1350" fill="#f6f4ef"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 56.0) scale(1.4285714285714286)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#15181d" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#0f7a5c" stroke-width="2"/></g>
  <text x="114" y="100" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="-1.5" fill="#15181d">nilwerk</text>
  <text x="1008" y="100" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1.4" fill="#5b616b">KICKER · SPRINT N</text>
  <line x1="72" y1="126" x2="1008" y2="126" stroke="#c9c2b3" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="80" letter-spacing="-2.4" fill="#15181d">
    <text x="72" y="268">One big statement</text>
    <text x="72" y="356">in three short</text>
    <text x="72" y="444">lines at most.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="28" fill="#5b616b">
    <text x="72" y="520">PLAIN LAYER: one benefit-first sentence,</text>
    <text x="72" y="560">no jargon, anyone can follow.</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 600)"><circle cx="78" cy="46" r="6" fill="none" stroke="#0f7a5c" stroke-width="3"/><path d="M84,46 H388 L396.1,31.6 L412.2,60.4 L428.4,31.6 L444.6,60.4 L460.8,31.6 L476.9,60.4 L485.0,46.0 H1090" fill="none" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/><text x="388" y="88" font-family="'JetBrains Mono', monospace" font-size="16" fill="#5b616b">R9 · placeholder trace</text></g>
  <line x1="72" y1="716" x2="1008" y2="716" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="72" y="754" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#b4541a">BEFORE · LABEL</text>
  <text x="72" y="814" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="56" letter-spacing="-1" fill="#15181d">0 000</text>
  <text x="72" y="850" font-family="Inter, sans-serif" font-size="22" fill="#5b616b">Secondary number, · one plain line.</text>
  <line x1="72" y1="882" x2="1008" y2="882" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="72" y="920" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.4" fill="#0f7a5c">AFTER · LABEL</text>
  <text x="64" y="1096" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="220" letter-spacing="-8" fill="#15181d">000</text>
  <text x="72" y="1138" font-family="Inter, sans-serif" font-size="24" fill="#5b616b">The number that matters, · set large in mono, · with its meaning.</text>
  <rect x="72" y="1168" width="15" height="15" fill="#b4541a"/>
  <text x="98" y="1184" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="0.8" fill="#15181d">STATUS · MEASURED OR ESTIMATED</text>
  <text x="72" y="1226" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#0f7a5c">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#5b616b"><text x="72" y="1250">ENGINEER LAYER: formula / test / source</text><text x="72" y="1274">What is still unmeasured or stubbed</text></g>
  <line x1="72" y1="1288" x2="1008" y2="1288" stroke="#c9c2b3" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#5b616b">
    <text x="72" y="1322">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1322" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
