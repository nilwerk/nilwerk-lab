<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="One big statement in three short lines at most.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1080. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1080" fill="#101317"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 48.0) scale(1.2857142857142858)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#ecebe7" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#3fc79a" stroke-width="2"/></g>
  <text x="110" y="88" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="28" letter-spacing="-1.4" fill="#ecebe7">nilwerk</text>
  <text x="1008" y="88" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="1.4" fill="#a2a7af">KICKER · SPRINT N</text>
  <line x1="72" y1="111" x2="1008" y2="111" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="66" letter-spacing="-2.0" fill="#ecebe7">
    <text x="72" y="232">One big statement</text>
    <text x="72" y="304">in three short</text>
    <text x="72" y="376">lines at most.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">
    <text x="72" y="428">PLAIN LAYER: one benefit-first sentence,</text>
    <text x="72" y="464">no jargon, anyone can follow.</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 470)"><circle cx="78" cy="36" r="6" fill="none" stroke="#3fc79a" stroke-width="3"/><path d="M84,36 H388 L396.1,23.4 L412.2,48.6 L428.4,23.4 L444.6,48.6 L460.8,23.4 L476.9,48.6 L485.0,36.0 H1090" fill="none" stroke="#3fc79a" stroke-width="3" stroke-linejoin="round"/><text x="388" y="72" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a2a7af">R9 · placeholder trace</text></g>
  <line x1="72" y1="548" x2="1008" y2="548" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="582" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1.4" fill="#e58a4f">BEFORE · LABEL</text>
  <text x="72" y="634" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="48" letter-spacing="-1" fill="#ecebe7">0 000</text>
  <text x="72" y="664" font-family="Inter, sans-serif" font-size="21" fill="#a2a7af">Secondary number, one plain line.</text>
  <line x1="72" y1="690" x2="1008" y2="690" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="724" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#3fc79a">AFTER · LABEL</text>
  <text x="66" y="858" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="170" letter-spacing="-6" fill="#ecebe7">000</text>
  <text x="72" y="894" font-family="Inter, sans-serif" font-size="22" fill="#a2a7af">The number that matters, set large in mono, with its meaning.</text>
  <rect x="72" y="920" width="14" height="14" fill="#e58a4f"/>
  <text x="95" y="934" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="0.8" fill="#ecebe7">STATUS · MEASURED OR ESTIMATED</text>
  <text x="72" y="972" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="1.4" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="#a2a7af"><text x="72" y="994">ENGINEER LAYER: formula / test / source</text><text x="72" y="1016">What is still unmeasured or stubbed</text></g>
  <line x1="72" y1="1034" x2="1008" y2="1034" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="17" fill="#a2a7af">
    <text x="72" y="1062">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1062" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
