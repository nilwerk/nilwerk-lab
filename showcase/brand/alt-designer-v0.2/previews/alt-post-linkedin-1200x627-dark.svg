  <text x="672" y="244" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="128" letter-spacing="-5" fill="#ecebe7">000</text>
  <g font-family="Inter, sans-serif" font-size="17" fill="#a2a7af">
    <text x="680" y="278">The number that matters,</text>
    <text x="680" y="300">set large in mono,</text>
    <text x="680" y="322">with its meaning.</text>
  </g>
  <g transform="translate(0 372)"><circle cx="62" cy="22" r="6" fill="none" stroke="#3fc79a" stroke-width="2.5"/><path d="M68,22 H432 L441.0,11.2 L459.0,32.8 L477.0,11.2 L495.0,32.8 L513.0,11.2 L531.0,32.8 L540.0,22.0 H1210" fill="none" stroke="#3fc79a" stroke-width="2.5" stroke-linejoin="round"/><text x="432" y="53" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a2a7af">R9 · placeholder trace</text></g>
  <line x1="56" y1="436" x2="1144" y2="436" stroke="#3a424c" stroke-width="1.5"/>
  <text x="56" y="466" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.4" fill="#e58a4f">BEFORE · LABEL</text>
  <text x="56" y="506" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="38" letter-spacing="-1" fill="#ecebe7">0 000</text>
  <text x="56" y="530" font-family="Inter, sans-serif" font-size="15" fill="#a2a7af">Secondary number, · one plain line.</text>
  <rect x="680" y="459" width="10" height="10" fill="#e58a4f"/>
  <text x="698" y="470" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="0.8" fill="#ecebe7">STATUS · MEASURED OR ESTIMATED</text>
