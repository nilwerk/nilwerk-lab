<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Headline line one Headline line two Accent line three">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Instagram portrait 4:5. Placeholders: {{...}}. Colours: brand.css tokens. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a3038" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#101317"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- logo: mark + wordmark (same geometry as nilwerk.de) -->
  <g transform="translate(72 64) scale(2.25)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#ecebe7">nil<tspan fill="#3fc79a">werk</tspan></text>

  <!-- kicker chip -->
  <rect x="72" y="176" width="313" height="52" rx="26" fill="#16302a" stroke="#3fc79a" stroke-width="2"/>
  <text x="96" y="211" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#3fc79a">KICKER · SPRINT N</text>

  <!-- headline (max about 19 characters per line) -->
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.4">
    <text x="72" y="345" fill="#ecebe7">Headline line one</text>
    <text x="72" y="443" fill="#ecebe7">Headline line two</text>
    <text x="72" y="541" fill="#3fc79a">Accent line three</text>
  </g>
  <g font-family="Inter, sans-serif" font-weight="400" font-size="34" fill="#a2a7af">
    <text x="72" y="622">One short sentence that sets up the proof,</text>
    <text x="72" y="668">max two lines, plain words.</text>
  </g>

  <!-- two evidence tiles -->
  <g>
    <rect x="72" y="730" width="456" height="350" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="72" y="730" width="456" height="10" rx="5" fill="#e58a4f"/>
    <text x="100" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#e58a4f">BEFORE · LABEL</text>
    <text x="100" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#ecebe7">0 000</text>
    <text x="100" y="972" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">What this number is,</text>
    <text x="100" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">in one plain line.</text>
    <text x="100" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af"></text>
  </g>
  <g>
    <rect x="552" y="730" width="456" height="350" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="552" y="730" width="456" height="10" rx="5" fill="#3fc79a"/>
    <text x="580" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#3fc79a">AFTER · LABEL</text>
    <text x="580" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#ecebe7">0 000</text>
    <text x="580" y="972" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">What this number is,</text>
    <text x="580" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">in one plain line.</text>
    <text x="580" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af"></text>
  </g>

  <!-- honesty chip: what kind of evidence this is -->
  <rect x="72" y="1112" width="466" height="48" rx="8" fill="none" stroke="#e58a4f" stroke-width="2"/>
  <text x="92" y="1145" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#e58a4f">STATUS · MEASURED OR ESTIMATED</text>

  <!-- source + footer -->
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#a2a7af">
    <text x="72" y="1214">Source: task ID · PR # · file or log</text>
    <text x="72" y="1244">Date of the evidence</text>
  </g>
  <line x1="72" y1="1270" x2="1008" y2="1270" stroke="#2a3038" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#a2a7af">
    <text x="72" y="1307">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1307" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
