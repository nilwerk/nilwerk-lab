    <text x="72" y="376" fill="#15181d">Headline line two</text>
    <text x="72" y="462" fill="#0f7a5c">Accent line three</text>
  </g>

  <g>
    <rect x="72" y="510" width="456" height="310" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="72" y="510" width="456" height="10" rx="5" fill="#b4541a"/>
    <text x="100" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#b4541a">BEFORE · LABEL</text>
    <text x="100" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#15181d">0 000</text>
    <text x="100" y="722" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">What this number is,</text>
    <text x="100" y="756" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">in one plain line.</text>
    <text x="100" y="790" font-family="Inter, sans-serif" font-size="26" fill="#5b616b"></text>
  </g>
  <g>
    <rect x="552" y="510" width="456" height="310" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="552" y="510" width="456" height="10" rx="5" fill="#0f7a5c"/>
    <text x="580" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#0f7a5c">AFTER · LABEL</text>
    <text x="580" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#15181d">0 000</text>
    <text x="580" y="722" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">What this number is,</text>
    <text x="580" y="756" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">in one plain line.</text>
    <text x="580" y="790" font-family="Inter, sans-serif" font-size="26" fill="#5b616b"></text>
