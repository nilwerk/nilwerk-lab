  <rect x="72" y="848" width="448" height="46" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/>
  <text x="92" y="880" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#b4541a">STATUS · MEASURED OR ESTIMATED</text>

  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#5b616b">
