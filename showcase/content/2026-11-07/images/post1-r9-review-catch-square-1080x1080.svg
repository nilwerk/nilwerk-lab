<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="A review caught a charger resistor before any order.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Square 1:1 (Instagram feed, LinkedIn). Placeholders: {{...}}. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="#f6f4ef"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g transform="translate(72 48) scale(2)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="148" y="98" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>

  <rect x="72" y="140" width="430" height="48" rx="24" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/>
  <text x="94" y="172" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.1" fill="#0f7a5c">CAUGHT IN REVIEW · HARDWARE</text>

  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="80" letter-spacing="-2.1">
    <text x="72" y="290" fill="#15181d">A review caught</text>
    <text x="72" y="376" fill="#15181d">a charger resistor</text>
    <text x="72" y="462" fill="#0f7a5c">before any order.</text>
  </g>

  <g>
    <rect x="72" y="510" width="456" height="310" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="72" y="510" width="456" height="10" rx="5" fill="#b4541a"/>
    <text x="100" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#b4541a">BEFORE · R9 = 1.2 kOhm</text>
    <text x="100" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#15181d">~0.9 A</text>
    <text x="100" y="722" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">about 0.9C on a</text>
    <text x="100" y="756" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">1000 mAh cell,</text>
    <text x="100" y="790" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">flagged in review</text>
  </g>
  <g>
    <rect x="552" y="510" width="456" height="310" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="552" y="510" width="456" height="10" rx="5" fill="#0f7a5c"/>
    <text x="580" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#0f7a5c">AFTER · R9 = 2.4 kOhm</text>
    <text x="580" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#15181d">458 mA</text>
    <text x="580" y="722" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">0.46C, from R = 1100 / I</text>
    <text x="580" y="756" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">worst case 527 mA</text>
    <text x="580" y="790" font-family="Inter, sans-serif" font-size="26" fill="#5b616b">(+15 % tolerance)</text>
  </g>

  <rect x="72" y="848" width="489" height="46" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/>
  <text x="92" y="880" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#b4541a">CALCULATED · NOT YET BENCH-TESTED</text>

  <text x="72" y="932" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="19" fill="#5b616b">
    <text x="72" y="958">R9 sets charge current, R = 1100 / I (charger datasheet), BOM rev. 2</text>
    <text x="72" y="983">Calculated, not yet measured on a real board</text>
  </g>
  <line x1="72" y1="1004" x2="1008" y2="1004" stroke="#e2ded5" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#5b616b">
    <text x="72" y="1042">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1042" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
