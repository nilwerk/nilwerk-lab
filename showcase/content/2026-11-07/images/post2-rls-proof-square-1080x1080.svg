<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="User A cannot read user B&#x27;s plant data.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Square 1:1 (Instagram feed, LinkedIn). Placeholders: {{...}}. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a3038" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="#101317"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g transform="translate(72 48) scale(2)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="148" y="98" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="#ecebe7">nil<tspan fill="#3fc79a">werk</tspan></text>

  <rect x="72" y="140" width="402" height="48" rx="24" fill="#16302a" stroke="#3fc79a" stroke-width="2"/>
  <text x="94" y="172" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.1" fill="#3fc79a">TESTED · BACKEND SCAFFOLD</text>

  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="80" letter-spacing="-2.1">
    <text x="72" y="290" fill="#ecebe7">User A cannot</text>
    <text x="72" y="376" fill="#ecebe7">read user B&#x27;s</text>
    <text x="72" y="462" fill="#3fc79a">plant data.</text>
  </g>

  <g>
    <rect x="72" y="510" width="456" height="310" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="72" y="510" width="456" height="10" rx="5" fill="#3fc79a"/>
    <text x="100" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#3fc79a">TABLES WITH RLS</text>
    <text x="100" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#ecebe7">14 / 14</text>
    <text x="100" y="722" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">all tables of our own</text>
    <text x="100" y="756" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">database schema,</text>
    <text x="100" y="790" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">checked by the test run</text>
  </g>
  <g>
    <rect x="552" y="510" width="456" height="310" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="552" y="510" width="456" height="10" rx="5" fill="#3fc79a"/>
    <text x="580" y="568" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#3fc79a">FOREIGN ROWS SEEN</text>
    <text x="580" y="666" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.8" fill="#ecebe7">0</text>
    <text x="580" y="722" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">A tries to read, change,</text>
    <text x="580" y="756" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">delete or forge rows of B:</text>
    <text x="580" y="790" font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">none succeeded</text>
  </g>

  <rect x="72" y="848" width="611" height="46" rx="8" fill="none" stroke="#e58a4f" stroke-width="2"/>
  <text x="92" y="880" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="21" letter-spacing="1" fill="#e58a4f">TESTED ON LOCAL POSTGRES 16 · NOT YET LIVE</text>

  <text x="72" y="932" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="1.5" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="19" fill="#a2a7af">
    <text x="72" y="958">Local PostgreSQL 16 run, 7 Nov 2026: RLS + retention tests</text>
    <text x="72" y="983">Auth, scheduler, storage stubbed locally; not on live Supabase</text>
  </g>
  <line x1="72" y1="1004" x2="1008" y2="1004" stroke="#2a3038" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#a2a7af">
    <text x="72" y="1042">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1042" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
