<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="A review caught a charger resistor before any order.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Instagram portrait 4:5. Placeholders: {{...}}. Colours: brand.css tokens. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#f6f4ef"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- logo: mark + wordmark (same geometry as nilwerk.de) -->
  <g transform="translate(72 64) scale(2.25)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>

  <!-- kicker chip -->
  <rect x="72" y="176" width="469" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/>
  <text x="96" y="211" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">CAUGHT IN REVIEW · HARDWARE</text>

  <!-- headline (max about 19 characters per line) -->
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.4">
    <text x="72" y="345" fill="#15181d">A review caught</text>
    <text x="72" y="443" fill="#15181d">a charger resistor</text>
    <text x="72" y="541" fill="#0f7a5c">before any order.</text>
  </g>
  <g font-family="Inter, sans-serif" font-weight="400" font-size="34" fill="#5b616b">
    <text x="72" y="622">R9 sets the charge current of a 1000 mAh cell.</text>
    <text x="72" y="668">Our reviewer flagged 1.2 kOhm as too high.</text>
  </g>

  <!-- two evidence tiles -->
  <g>
    <rect x="72" y="730" width="456" height="350" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="72" y="730" width="456" height="10" rx="5" fill="#b4541a"/>
    <text x="100" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#b4541a">BEFORE · R9 = 1.2 kOhm</text>
    <text x="100" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#15181d">~0.9 A</text>
    <text x="100" y="972" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">about 0.9C on a</text>
    <text x="100" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">1000 mAh cell,</text>
    <text x="100" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">flagged in review</text>
  </g>
  <g>
    <rect x="552" y="730" width="456" height="350" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="552" y="730" width="456" height="10" rx="5" fill="#0f7a5c"/>
    <text x="580" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">AFTER · R9 = 2.4 kOhm</text>
    <text x="580" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#15181d">458 mA</text>
    <text x="580" y="972" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">0.46C, from R = 1100 / I</text>
    <text x="580" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">worst case 527 mA</text>
    <text x="580" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">(+15 % tolerance)</text>
  </g>

  <!-- honesty chip: what kind of evidence this is -->
  <rect x="72" y="1112" width="509" height="48" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/>
  <text x="92" y="1145" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#b4541a">CALCULATED · NOT YET BENCH-TESTED</text>

  <!-- source + footer -->
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#5b616b">
    <text x="72" y="1214">Source: BOM draft rev. 2 and review, 6-7 Nov 2026</text>
    <text x="72" y="1244">Formula from the charger datasheet; bench test pending</text>
  </g>
  <line x1="72" y1="1270" x2="1008" y2="1270" stroke="#e2ded5" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#5b616b">
    <text x="72" y="1307">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1307" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
