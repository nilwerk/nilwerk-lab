<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="User A cannot read user B&#x27;s plant data.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1350. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1350" fill="#101317"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 56.0) scale(1.4285714285714286)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#ecebe7" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#3fc79a" stroke-width="2"/></g>
  <text x="114" y="100" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="-1.5" fill="#ecebe7">nilwerk</text>
  <text x="1008" y="100" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1.4" fill="#a2a7af">TESTED · BACKEND SCAFFOLD</text>
  <line x1="72" y1="126" x2="1008" y2="126" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="80" letter-spacing="-2.4" fill="#ecebe7">
    <text x="72" y="268">User A cannot</text>
    <text x="72" y="356">read user B&#x27;s</text>
    <text x="72" y="444">plant data.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">
    <text x="72" y="520">Can one user see another user&#x27;s plants?</text>
    <text x="72" y="560">We tested all 14 tables of our schema.</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 600)"><text x="72" y="32.4" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" fill="#3fc79a">A</text><text x="72" y="77.2" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" fill="#ecebe7">B</text><path d="M104,26.8 H1090" fill="none" stroke="#3fc79a" stroke-width="3" stroke-linecap="round"/><path d="M324,26.8 L349,51 H608" fill="none" stroke="#3fc79a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M616,44 l14,14 M630,44 l-14,14" stroke="#e58a4f" stroke-width="3" stroke-linecap="round"/><path d="M104,71.6 H1090" fill="none" stroke="#ecebe7" stroke-width="3"/><line x1="648" y1="41" x2="648" y2="91" stroke="#ecebe7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="658" y="56" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.2" fill="#a2a7af">B'S ROWS</text><text x="658" y="16" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1.2" fill="#3fc79a">A'S OWN ROWS: ALLOWED</text></g>
  <line x1="72" y1="716" x2="1008" y2="716" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="754" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#a2a7af">TABLES WITH RLS</text>
  <text x="72" y="814" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="56" letter-spacing="-1" fill="#ecebe7">14 / 14</text>
  <text x="72" y="850" font-family="Inter, sans-serif" font-size="22" fill="#a2a7af">all tables of our own database schema, checked by the test run</text>
  <line x1="72" y1="882" x2="1008" y2="882" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="920" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.4" fill="#3fc79a">FOREIGN ROWS SEEN</text>
  <text x="64" y="1096" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="220" letter-spacing="-8" fill="#ecebe7">0</text>
  <text x="72" y="1138" font-family="Inter, sans-serif" font-size="24" fill="#a2a7af">A tries to read, change, delete or forge rows of B: none succeeded</text>
  <rect x="72" y="1168" width="15" height="15" fill="#e58a4f"/>
  <text x="98" y="1184" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="0.8" fill="#ecebe7">TESTED ON LOCAL POSTGRES 16 · NOT YET LIVE</text>
  <text x="72" y="1226" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#a2a7af"><text x="72" y="1250">Local PostgreSQL 16 run: RLS + retention tests</text><text x="72" y="1274">Auth, scheduler, storage stubbed locally; not on live Supabase</text></g>
  <line x1="72" y1="1288" x2="1008" y2="1288" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#a2a7af">
    <text x="72" y="1322">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1322" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
