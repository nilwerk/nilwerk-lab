<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="User A cannot read user B&#x27;s plant data.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1200x627. Hero number right, statement left, trace across. -->
  <rect width="1200" height="627" fill="#101317"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(52 22.0) scale(1.0714285714285714)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#ecebe7" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#3fc79a" stroke-width="2"/></g>
  <text x="88" y="55" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="24" letter-spacing="-1.2" fill="#ecebe7">nilwerk</text>
  <text x="1144" y="55" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.4" fill="#a2a7af">TESTED · BACKEND SCAFFOLD</text>
  <line x1="56" y1="74" x2="1144" y2="74" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="48" letter-spacing="-1.4" fill="#ecebe7">
    <text x="56" y="150">User A cannot</text>
    <text x="56" y="204">read user B&#x27;s</text>
    <text x="56" y="258">plant data.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="19" fill="#a2a7af">
    <text x="56" y="302">Can one user see another user&#x27;s plants?</text>
    <text x="56" y="328">We tested all 14 tables of our schema.</text>
  </g>
  <text x="680" y="124" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="1.4" fill="#3fc79a">FOREIGN ROWS SEEN</text>
  <text x="672" y="244" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="128" letter-spacing="-5" fill="#ecebe7">0</text>
  <g font-family="Inter, sans-serif" font-size="17" fill="#a2a7af">
    <text x="680" y="278">A tries to read, change,</text>
    <text x="680" y="300">delete or forge rows of B:</text>
    <text x="680" y="322">none succeeded</text>
  </g>
  <g transform="translate(0 372)"><text x="56" y="11.8" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#3fc79a">A</text><text x="56" y="45.4" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#ecebe7">B</text><path d="M80,7.600000000000001 H1210" fill="none" stroke="#3fc79a" stroke-width="2.5" stroke-linecap="round"/><path d="M360,7.600000000000001 L378,26 H680" fill="none" stroke="#3fc79a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M688,19 l14,14 M702,19 l-14,14" stroke="#e58a4f" stroke-width="2.5" stroke-linecap="round"/><path d="M80,41.2 H1210" fill="none" stroke="#ecebe7" stroke-width="2.5"/><line x1="720" y1="18" x2="720" y2="56" stroke="#ecebe7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="730" y="30" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="#a2a7af">B'S ROWS</text><text x="730" y="-1" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="#3fc79a">A'S OWN ROWS: ALLOWED</text></g>
  <line x1="56" y1="436" x2="1144" y2="436" stroke="#3a424c" stroke-width="1.5"/>
  <text x="56" y="466" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.4" fill="#a2a7af">TABLES WITH RLS</text>
  <text x="56" y="506" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="38" letter-spacing="-1" fill="#ecebe7">14 / 14</text>
  <text x="56" y="530" font-family="Inter, sans-serif" font-size="15" fill="#a2a7af">all tables of our own database schema, checked by the test run</text>
  <rect x="680" y="459" width="10" height="10" fill="#e58a4f"/>
  <text x="698" y="470" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="0.8" fill="#ecebe7">TESTED ON LOCAL POSTGRES 16 · NOT YET LIVE</text>
  <text x="56" y="554" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.4" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#a2a7af"><text x="190" y="554">Local PostgreSQL 16 run: RLS + retention tests</text><text x="190" y="574">Auth, scheduler, storage stubbed locally; not on live Supabase</text></g>
  <line x1="56" y1="592" x2="1144" y2="592" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#a2a7af">
    <text x="56" y="616">@nilwerk · nilwerk.de</text>
    <text x="1144" y="616" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
