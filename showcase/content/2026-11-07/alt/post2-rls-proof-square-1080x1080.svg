<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="User A cannot read user B&#x27;s plant data.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1080. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1080" fill="#101317"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 48.0) scale(1.2857142857142858)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#ecebe7" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#3fc79a" stroke-width="2"/></g>
  <text x="110" y="88" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="28" letter-spacing="-1.4" fill="#ecebe7">nilwerk</text>
  <text x="1008" y="88" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="1.4" fill="#a2a7af">TESTED · BACKEND SCAFFOLD</text>
  <line x1="72" y1="111" x2="1008" y2="111" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="66" letter-spacing="-2.0" fill="#ecebe7">
    <text x="72" y="232">User A cannot</text>
    <text x="72" y="304">read user B&#x27;s</text>
    <text x="72" y="376">plant data.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="26" fill="#a2a7af">
    <text x="72" y="428">Can one user see another user&#x27;s plants?</text>
    <text x="72" y="464">We tested all 14 tables of our schema.</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 470)"><text x="72" y="24.1" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#3fc79a">A</text><text x="72" y="63.3" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#ecebe7">B</text><path d="M100,19.2 H1090" fill="none" stroke="#3fc79a" stroke-width="3" stroke-linecap="round"/><path d="M324,19.2 L346,41 H608" fill="none" stroke="#3fc79a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M616,34 l14,14 M630,34 l-14,14" stroke="#e58a4f" stroke-width="3" stroke-linecap="round"/><path d="M100,58.400000000000006 H1090" fill="none" stroke="#ecebe7" stroke-width="3"/><line x1="648" y1="32" x2="648" y2="75" stroke="#ecebe7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="658" y="45" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.2" fill="#a2a7af">B'S ROWS</text><text x="658" y="9" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.2" fill="#3fc79a">A'S OWN ROWS: ALLOWED</text></g>
  <line x1="72" y1="548" x2="1008" y2="548" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="582" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1.4" fill="#a2a7af">TABLES WITH RLS</text>
  <text x="72" y="634" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="48" letter-spacing="-1" fill="#ecebe7">14 / 14</text>
  <text x="72" y="664" font-family="Inter, sans-serif" font-size="21" fill="#a2a7af">all tables of our own database schema, checked by the test run</text>
  <line x1="72" y1="690" x2="1008" y2="690" stroke="#3a424c" stroke-width="1.5"/>
  <text x="72" y="724" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#3fc79a">FOREIGN ROWS SEEN</text>
  <text x="66" y="858" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="170" letter-spacing="-6" fill="#ecebe7">0</text>
  <text x="72" y="894" font-family="Inter, sans-serif" font-size="22" fill="#a2a7af">A tries to read, change, delete or forge rows of B: none succeeded</text>
  <rect x="72" y="920" width="14" height="14" fill="#e58a4f"/>
  <text x="95" y="934" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="0.8" fill="#ecebe7">TESTED ON LOCAL POSTGRES 16 · NOT YET LIVE</text>
  <text x="72" y="972" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="1.4" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="#a2a7af"><text x="72" y="994">Local PostgreSQL 16 run, 7 Nov 2026: RLS + retention tests</text><text x="72" y="1016">Auth, scheduler, storage stubbed locally; not on live Supabase</text></g>
  <line x1="72" y1="1034" x2="1008" y2="1034" stroke="#3a424c" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="17" fill="#a2a7af">
    <text x="72" y="1062">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1062" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
