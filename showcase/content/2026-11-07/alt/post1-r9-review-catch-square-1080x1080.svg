<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="A review caught a charger resistor before any order.">
  <!-- Nilwerk post template v0.2 (designer alternative, PROPOSAL). 1080x1080. Strict grid, hairlines, no cards, no pills. -->
  <rect width="1080" height="1080" fill="#f6f4ef"/>
  <!-- header: line mark + wordmark left, mono kicker right, hairline -->
  <g transform="translate(68 48.0) scale(1.2857142857142858)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 25V8.5L19 25V12" stroke="#15181d" stroke-width="2.4"/><circle cx="19" cy="9.2" r="2.7" stroke="#0f7a5c" stroke-width="2"/></g>
  <text x="110" y="88" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="28" letter-spacing="-1.4" fill="#15181d">nilwerk</text>
  <text x="1008" y="88" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="1.4" fill="#5b616b">CAUGHT IN REVIEW · HARDWARE</text>
  <line x1="72" y1="111" x2="1008" y2="111" stroke="#c9c2b3" stroke-width="1.5"/>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="66" letter-spacing="-2.0" fill="#15181d">
    <text x="72" y="232">A review caught</text>
    <text x="72" y="304">a charger resistor</text>
    <text x="72" y="376">before any order.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="26" fill="#5b616b">
    <text x="72" y="428">A tiny part sets how fast the battery charges.</text>
    <text x="72" y="464">Our reviewing AI agent flagged the wrong value.</text>
  </g>
  <!-- trace: the one graphic device, drawn per post from the real content -->
  <g transform="translate(0 470)"><circle cx="78" cy="36" r="6" fill="none" stroke="#0f7a5c" stroke-width="3"/><path d="M84,36 H388 L396.1,23.4 L412.2,48.6 L428.4,23.4 L444.6,48.6 L460.8,23.4 L476.9,48.6 L485.0,36.0 H1090" fill="none" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/><text x="388" y="72" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5b616b">R9 · 1.2 kOhm to 2.4 kOhm</text></g>
  <line x1="72" y1="548" x2="1008" y2="548" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="72" y="582" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1.4" fill="#b4541a">BEFORE · R9 = 1.2 kOhm</text>
  <text x="72" y="634" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="48" letter-spacing="-1" fill="#15181d">~0.9 A</text>
  <text x="72" y="664" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">about 0.9C on a · 1000 mAh cell, · flagged in review</text>
  <line x1="72" y1="690" x2="1008" y2="690" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="72" y="724" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.4" fill="#0f7a5c">AFTER · R9 = 2.4 kOhm</text>
  <text x="66" y="858" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="170" letter-spacing="-6" fill="#15181d">458<tspan font-size="0.36em" letter-spacing="0" dx="0.25em">mA</tspan></text>
  <text x="72" y="894" font-family="Inter, sans-serif" font-size="22" fill="#5b616b">0.46C, from R = 1100 / I · worst case 527 mA · (+15 % tolerance)</text>
  <rect x="72" y="920" width="14" height="14" fill="#b4541a"/>
  <text x="95" y="934" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="0.8" fill="#15181d">CALCULATED · NOT YET BENCH-TESTED</text>
  <text x="72" y="972" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="1.4" fill="#0f7a5c">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="#5b616b"><text x="72" y="994">R9 sets charge current, R = 1100 / I (charger datasheet), BOM rev. 2</text><text x="72" y="1016">Calculated, not yet measured on a real board</text></g>
  <line x1="72" y1="1034" x2="1008" y2="1034" stroke="#c9c2b3" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" font-size="17" fill="#5b616b">
    <text x="72" y="1062">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1062" text-anchor="end">AI agents, led and reviewed by humans</text>
  </g>
</svg>
