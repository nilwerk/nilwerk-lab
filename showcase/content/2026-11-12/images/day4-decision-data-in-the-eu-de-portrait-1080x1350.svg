<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Wo liegen die Daten deiner Pflanze? In der EU.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Instagram portrait 4:5. Placeholders: {{...}}. Colours: brand.css tokens. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a3038" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#101317"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- logo: mark + wordmark (same geometry as nilwerk.de) -->
  <g transform="translate(72 64) scale(2.25)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#ecebe7">nil<tspan fill="#3fc79a">werk</tspan></text>

  <!-- kicker chip -->
  <rect x="72" y="176" width="594" height="52" rx="26" fill="#16302a" stroke="#3fc79a" stroke-width="2"/>
  <text x="96" y="211" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#3fc79a">LOGBUCH · TAG 4 · EINE ENTSCHEIDUNG</text>

  <!-- headline (max about 19 characters per line) -->
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.4">
    <text x="72" y="345" fill="#ecebe7">Wo liegen die</text>
    <text x="72" y="443" fill="#ecebe7">Daten deiner</text>
    <text x="72" y="541" fill="#3fc79a">Pflanze? In der EU.</text>
  </g>
  <g font-family="Inter, sans-serif" font-weight="400" font-size="34" fill="#a2a7af">
    <text x="72" y="622">Eine Entscheidung aus Woche eins: ein Backend,</text>
    <text x="72" y="668">gehostet in der EU. Noch nicht live.</text>
  </g>

  <!-- two evidence tiles -->
  <g>
    <rect x="72" y="730" width="456" height="350" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="72" y="730" width="456" height="10" rx="5" fill="#3fc79a"/>
    <text x="100" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#3fc79a">DATEN GEHOSTET IN</text>
    <text x="100" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#ecebe7">EU</text>
    <text x="100" y="972" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">eine Region, mit Export</text>
    <text x="100" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">und Löschung als</text>
    <text x="100" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">Anforderung</text>
  </g>
  <g>
    <rect x="552" y="730" width="456" height="350" rx="18" fill="#181c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="552" y="730" width="456" height="10" rx="5" fill="#3fc79a"/>
    <text x="580" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#3fc79a">ALTERNATIVEN ABGELEHNT</text>
    <text x="580" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#ecebe7">3</text>
    <text x="580" y="972" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">darunter Firebase</text>
    <text x="580" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">und ein eigener</text>
    <text x="580" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#a2a7af">Server</text>
  </g>

  <!-- honesty chip: what kind of evidence this is -->
  <rect x="72" y="1112" width="466" height="48" rx="8" fill="none" stroke="#e58a4f" stroke-width="2"/>
  <text x="92" y="1145" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#e58a4f">ENTSCHEIDUNG · NOCH NICHT LIVE</text>

  <!-- layer 2: for engineers (numbers, how checked, what is unmeasured) + footer -->
  <text x="72" y="1204" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#3fc79a">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#a2a7af">
    <text x="72" y="1232">Entscheidungsdokument vom 3. Nov 2026: Supabase, EU-Region</text>
    <text x="72" y="1258">Nur auf lokaler Datenbank getestet; nicht auf Live-Projekt</text>
  </g>
  <line x1="72" y1="1278" x2="1008" y2="1278" stroke="#2a3038" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#a2a7af">
    <text x="72" y="1316">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1316" text-anchor="end">KI-Agenten, geleitet und geprüft von Menschen</text>
  </g>
</svg>
