  <text x="56" y="534" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="15" letter-spacing="1.2" fill="#0f7a5c">FOR ENGINEERS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="15" fill="#5b616b">
