<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="Sprint 2, as of [day, time]: the numbers.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). LinkedIn landscape 1.91:1. Placeholders: {{...}}. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="#f6f4ef"/>
  <rect width="1200" height="627" fill="url(#grid)"/>

  <g transform="translate(56 36) scale(1.5)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="116" y="74" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="-0.9" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>

  <rect x="56" y="108" width="447" height="38" rx="19" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="1.5"/>
  <text x="74" y="133" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.9" fill="#0f7a5c">LOGBOOK · DAY 6 · SPRINT 2 IN NUMBERS</text>

  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="54" letter-spacing="-1.4">
    <text x="56" y="222" fill="#15181d">Sprint 2, as of</text>
    <text x="56" y="286" fill="#15181d">[day, time]:</text>
    <text x="56" y="350" fill="#0f7a5c">the numbers.</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="23" fill="#5b616b">
    <text x="56" y="400">SAMPLE LAYOUT: fill the values on the day</text>
    <text x="56" y="430">from the Plan and the Agent Log.</text>
  </g>

  <rect x="56" y="462" width="336" height="34" rx="6" fill="none" stroke="#b4541a" stroke-width="1.5"/>
  <text x="72" y="485" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="15" letter-spacing="0.8" fill="#b4541a">SAMPLE LAYOUT · FILL ON THE DAY</text>

  <!-- tiles, right column -->
  <g>
    <rect x="690" y="48" width="454" height="230" rx="14" fill="#ffffff" stroke="#e2ded5" stroke-width="1.5"/>
    <rect x="690" y="48" width="8" height="230" rx="4" fill="#0f7a5c"/>
    <text x="722" y="86" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.8" fill="#0f7a5c">DONE · AS OF [TIME]</text>
    <text x="722" y="170" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.3" fill="#15181d">n / n</text>
    <text x="722" y="212" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">tasks done of the</text>
    <text x="722" y="238" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">tasks committed</text>
    <text x="722" y="264" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">(source: Plan)</text>
  </g>
  <g>
    <rect x="690" y="298" width="454" height="230" rx="14" fill="#ffffff" stroke="#e2ded5" stroke-width="1.5"/>
    <rect x="690" y="298" width="8" height="230" rx="4" fill="#b4541a"/>
    <text x="722" y="336" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="0.8" fill="#b4541a">AGENT MIN · MEASURED</text>
    <text x="722" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.3" fill="#15181d">n min</text>
    <text x="722" y="462" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">without the lead&#x27;s time,</text>
    <text x="722" y="488" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">from the Agent Log;</text>
    <text x="722" y="514" font-family="Inter, sans-serif" font-size="21" fill="#5b616b">hours = estimate</text>
