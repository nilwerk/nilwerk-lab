<rect x="706" y="847" width="301" height="10" rx="5" fill="#0f7a5c"/>
<text x="856" y="939" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="62" letter-spacing="-2" text-anchor="middle" fill="#15181d">5 von 5</text>
<text x="856" y="979" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">mit Architektur- und</text><text x="856" y="1005" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">QA-Urteil (Gehäuse:</text><text x="856" y="1031" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">frühere Stände)</text>
