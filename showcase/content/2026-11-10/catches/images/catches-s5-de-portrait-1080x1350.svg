<text x="539" y="979" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">Entwurf noch offen</text><text x="539" y="1005" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">(Gehäuse)</text>
