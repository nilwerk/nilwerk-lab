<rect x="72" y="176" width="367" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="209" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.0" fill="#0f7a5c">DER MENSCHLICHE SCHRITT</text>
<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.2" fill="#15181d">Noch nicht gemergt.</text>
<text x="72" y="407" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.2" fill="#15181d">Ein Mensch</text>
<text x="72" y="476" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.2" fill="#0f7a5c">entscheidet.</text>
<text x="72" y="591" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Für alle fünf Änderungen liegen eine Architektur-Prüfung und</text>
<text x="72" y="630" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">ein QA-Urteil vor (eines davon war das eben beschriebene</text>
<text x="72" y="669" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">FAIL). Keine ist gemergt: Das entscheidet Arsany. Noch ist</text>
<text x="72" y="708" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">nichts gedruckt, bestellt oder auf einer Platine gelaufen.</text>
<text x="72" y="747" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Wir zeigen die Funde, weil ein Team, das nur Grün zeigt,</text>
<text x="72" y="786" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">nicht verrät, wie es dahin kam.</text>
