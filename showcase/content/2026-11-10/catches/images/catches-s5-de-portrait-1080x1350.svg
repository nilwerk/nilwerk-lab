<text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>
<rect x="72" y="176" width="367" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="209" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.0" fill="#0f7a5c">DER MENSCHLICHE SCHRITT</text>
<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#15181d">Vier gemergt,</text>
<text x="72" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#0f7a5c">einer offen.</text>
<text x="72" y="548" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Für jede der fünf Änderungen liegen eine Architektur-Prüfung</text>
<text x="72" y="587" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">und ein QA-Urteil vor (bei der Gehäuseänderung auf früheren</text>
<text x="72" y="626" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Ständen). Vier sind gemergt; die Gehäuseänderung ist noch ein</text>
<text x="72" y="665" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Entwurf, ihr QA-Urteil bezieht sich auf eine ältere Fassung.</text>
<text x="72" y="704" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Noch ist nichts gedruckt, bestellt oder auf einer Platine</text>
<text x="72" y="743" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">gelaufen. Wir zeigen die Funde, weil ein Team, das nur Grün</text>
<text x="72" y="782" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">zeigt, nicht verrät, wie es dahin kam.</text>
<rect x="72" y="847" width="301" height="206" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="847" width="301" height="10" rx="5" fill="#0f7a5c"/>
<text x="222" y="939" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="62" letter-spacing="-2" text-anchor="middle" fill="#15181d">4 von 5</text>
<text x="222" y="979" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">Änderungen gemergt,</text><text x="222" y="1005" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">Stand 10. Nov., 10:45</text>
<rect x="389" y="847" width="301" height="206" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="389" y="847" width="301" height="10" rx="5" fill="#0f7a5c"/>
