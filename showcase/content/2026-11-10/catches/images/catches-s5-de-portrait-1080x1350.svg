<text x="856" y="983" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">Agentenminuten heute,</text><text x="856" y="1009" font-family="Inter, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5b616b">grobe Zahl der Leitung</text>
<rect x="72" y="1079" width="443" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1107" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">GEZÄHLT · STAND 10. NOV., 08:40</text>
<text x="72" y="1182" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1210" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Fünf Pull Requests offen, CI auf allen fünf Ständen grün, Stand 10. Nov.,</text>
<text x="72" y="1234" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">08:40 Berliner Zeit. Die ~100 Minuten sind die grobe Zahl der Leitung für den</text>
<text x="72" y="1258" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Tag, noch nicht im Agent Log.</text>
