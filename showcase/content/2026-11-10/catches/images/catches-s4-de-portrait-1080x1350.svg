<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Fünf kurze Zeilen: ein Taster mit Masseschluss, 16 Vias aus Lötflächen verschoben, ein Startpin, der kein Taster sein kann, ein nur zur Prüfung getrimmter Name und 41 von 41 absichtlichen Fehlern entdeckt."><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/></pattern></defs><rect width="1080" height="1350" fill="#f6f4ef"/><rect width="1080" height="1350" fill="url(#grid)"/><g transform="translate(72 64) scale(2.25)">
<rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
<path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/><circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
<path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/></g>
<text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>
<rect x="72" y="176" width="494" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="209" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.0" fill="#0f7a5c">GLEICHER TAG, GLEICHE GEWOHNHEIT</text>
<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="56" letter-spacing="-2.2" fill="#15181d">Fünf weitere Prüfungen</text>
<text x="72" y="398" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="56" letter-spacing="-2.2" fill="#0f7a5c">am selben Tag.</text>
<rect x="72" y="482" width="936" height="106" rx="16" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="482" width="10" height="106" rx="5" fill="#0f7a5c"/>
<text x="104" y="514" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.2" fill="#0f7a5c">PCB</text>
<text x="104" y="540" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Ein Platzhalter-Taster hätte ein Signal direkt mit Masse</text>
<text x="104" y="569" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">verbunden. Die echte Zeichnung zeigte es.</text>
<rect x="72" y="600" width="936" height="106" rx="16" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="600" width="10" height="106" rx="5" fill="#0f7a5c"/>
<text x="104" y="632" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.2" fill="#0f7a5c">PCB</text>
<text x="104" y="658" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">16 winzige Bohrungen (Vias) lagen in Lötflächen. Jetzt 0. Die</text>
<text x="104" y="687" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Antennen-Sperrzone wird in der CI geprüft.</text>
<rect x="72" y="718" width="936" height="106" rx="16" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="718" width="10" height="106" rx="5" fill="#0f7a5c"/>
<text x="104" y="750" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.2" fill="#0f7a5c">FIRMWARE</text>
<text x="104" y="776" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Der Startpin kann keinen Taster „beim Einschalten halten“ tragen.</text>
<text x="104" y="805" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Beim Schreiben gefunden, bevor eine Platine existiert.</text>
<rect x="72" y="836" width="936" height="106" rx="16" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="836" width="10" height="106" rx="5" fill="#0f7a5c"/>
<text x="104" y="868" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.2" fill="#0f7a5c">APP</text>
<text x="104" y="894" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Wir bauen absichtlich Fehler ein, um die Tests zu testen. So fiel</text>
<text x="104" y="923" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">ein Name auf: getrimmt geprüft, ungetrimmt gesendet.</text>
<rect x="72" y="954" width="936" height="106" rx="16" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="954" width="10" height="106" rx="5" fill="#0f7a5c"/>
<text x="104" y="986" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="1.2" fill="#0f7a5c">CLOUD</text>
<text x="104" y="1012" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Funktion „Konto löschen“: alle 41 absichtlichen Fehler der</text>
<text x="104" y="1041" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#15181d">Testsuite entdeckt.</text>
<rect x="72" y="1074" width="508" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1102" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">GEMESSEN · NICHT AUF ECHTEN SYSTEMEN</text>
<text x="72" y="1182" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1210" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Firmware-Code (WLAN, Bluetooth LE, HTTP) wurde ohne Compiler geschrieben; die</text>
<text x="72" y="1234" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">CI hat ihn nach zwei Korrekturen übersetzt; nichts lief auf einer Platine.</text>
<text x="72" y="1258" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Cloud-Tests nutzen eine lokale Datenbank, nicht den Live-Dienst.</text>
<line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/><text x="72" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" fill="#5b616b">@nilwerk · nilwerk.de</text><text x="1008" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" text-anchor="end" fill="#5b616b">KI-Agenten, geleitet und geprüft von Menschen</text></svg>