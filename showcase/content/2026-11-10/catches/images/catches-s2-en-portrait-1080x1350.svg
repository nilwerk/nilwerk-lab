<circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/><circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
<path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/></g>
<text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>
<rect x="72" y="176" width="168" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="209" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1.0" fill="#0f7a5c">THE CATCH</text>
<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#15181d">Typed in: 6.0.</text>
<text x="72" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#15181d">In the file:</text>
<text x="72" y="502" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#0f7a5c">4.5 mm.</text>
<text x="72" y="630" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">The check had one board measurement typed in by hand: how far</text>
<text x="72" y="669" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">the antenna sticks out past the board. It said 6.0 mm. The</text>
<text x="72" y="708" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">real board file says 4.5 mm. So four of the 35 checks printed</text>
<text x="72" y="747" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">the same answer on the old and the new board. A test that</text>
<text x="72" y="786" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">cannot change its answer proves nothing.</text>
<rect x="72" y="851" width="460" height="206" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="851" width="460" height="10" rx="5" fill="#0f7a5c"/>
<text x="302" y="943" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2" text-anchor="middle" fill="#15181d">6.0 mm</text>
<text x="302" y="983" font-family="Inter, sans-serif" font-weight="400" font-size="22" text-anchor="middle" fill="#5b616b">typed into the check</text>
<rect x="548" y="851" width="460" height="206" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="548" y="851" width="460" height="10" rx="5" fill="#0f7a5c"/>
<text x="778" y="943" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2" text-anchor="middle" fill="#15181d">4.5 mm</text>
<text x="778" y="983" font-family="Inter, sans-serif" font-weight="400" font-size="22" text-anchor="middle" fill="#5b616b">in the real board file</text>
<rect x="72" y="1079" width="300" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1107" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">MEASURED · QA RE-RUN</text>
<text x="72" y="1182" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
<text x="72" y="1210" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Fit-check rows 2, 16, 17, 18 (26.2 / 28.4 / 21.2 mm, 1.0 mm gap) were</text>
<text x="72" y="1234" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">identical on both boards. Real gap above the antenna tip: 2.5 mm, not the</text>
<text x="72" y="1258" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">assumed 1.0 mm.</text>
