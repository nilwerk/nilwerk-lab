<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Two tiles: 6.0 millimetres typed into the check and 4.5 millimetres in the real board file."><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/></pattern></defs><rect width="1080" height="1350" fill="#f6f4ef"/><rect width="1080" height="1350" fill="url(#grid)"/><g transform="translate(72 64) scale(2.25)">
