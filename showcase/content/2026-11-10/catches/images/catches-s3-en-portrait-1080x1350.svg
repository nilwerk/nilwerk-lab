<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#15181d">Fixed, and it</text>
<text x="72" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#15181d">cannot drift</text>
<text x="72" y="502" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2" fill="#0f7a5c">again.</text>
<text x="72" y="630" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">The check now reads the board file itself. A new test fails</text>
<text x="72" y="669" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">if the stored copy of the board ever differs from the board</text>
<text x="72" y="708" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">design (we made it fail on purpose to be sure). Re-run on the</text>
<text x="72" y="747" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">new board, the check also found a real clash between the</text>
<text x="72" y="786" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">printed tray and a connector shell. Fixed too.</text>
