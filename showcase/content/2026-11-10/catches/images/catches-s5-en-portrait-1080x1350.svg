<text x="72" y="338" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="70" letter-spacing="-2.2" fill="#15181d">Four merged,</text>
<text x="72" y="414" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="70" letter-spacing="-2.2" fill="#0f7a5c">one draft open.</text>
<text x="72" y="536" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Each of the five changes has an architect review and a QA</text>
<text x="72" y="575" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">verdict on record. Four are merged; the enclosure change is</text>
<text x="72" y="614" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">still a draft, and its QA verdict is on an older version.</text>
<text x="72" y="653" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">Nothing is printed, ordered or run on a board yet. We show</text>
<text x="72" y="692" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">the catches because a team that only shows green is not</text>
<text x="72" y="731" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#15181d">telling you how it got there.</text>
