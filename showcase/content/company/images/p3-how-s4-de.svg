<rect x="72" y="176" width="430" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="210" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">NILWERK STORY · WIE · 4/4</text>
<text x="72" y="320" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#15181d">Der Mensch</text>
<text x="72" y="411" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#0f7a5c">entscheidet.</text>
<text x="72" y="552" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Nach unserer Regel ist nichts fertig, bis Arsany Ja sagt,</text>
<text x="72" y="593" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">auch am Wochenende. Arbeit, die Hände braucht, geht als</text>
<text x="72" y="634" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">schriftlicher Arbeitsauftrag an einen menschlichen</text>
<text x="72" y="675" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Hardware-Integrator. Was er misst, veröffentlichen wir.</text>
<text x="72" y="716" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Was noch niemand gemessen hat, beschriften wir.</text>
<rect x="68" y="797" width="176" height="176" rx="28" fill="#ffffff" stroke="#0f7a5c" stroke-width="4"/>
<svg x="72" y="801" width="168" height="168" viewBox="0 0 120 120"><defs><clipPath id="clip-pr-c33"><rect width="120" height="120" rx="28"/></clipPath></defs><g clip-path="url(#clip-pr-c33)"><rect width="120" height="120" fill="#d6457a" opacity=".16"/><circle cx="60" cy="58" r="40" fill="#d6457a" opacity=".18"/><path d="M38 50c-6 14-6 30-2 42h48c4-12 4-28-2-42Z" fill="#c4632f"/><path d="M22 120c2-22 18-34 38-34s36 12 38 34Z" fill="#d6457a"/><path d="M53 72h14v14c-2 3-5 4-7 4s-5-1-7-4Z" fill="#f1c9a8"/><path d="M50 88l10 8 10-8" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><ellipse cx="60" cy="54" rx="17" ry="19" fill="#f1c9a8"/><path d="M41 54c-1-16 8-25 19-25s20 9 19 25c-3-9-9-12-13-12-5 4-17 6-25 12Z" fill="#c4632f"/><circle cx="49" cy="61" r="3" fill="#e8797a" opacity=".45"/><circle cx="71" cy="61" r="3" fill="#e8797a" opacity=".45"/><path d="M50.5 55.5c1.5-2 4.5-2 6 0" fill="none" stroke="#1c1c1c" stroke-width="1.7" stroke-linecap="round"/><path d="M63.5 55.5c1.5-2 4.5-2 6 0" fill="none" stroke="#1c1c1c" stroke-width="1.7" stroke-linecap="round"/><path d="M53 63c2 4 12 4 14 0Z" fill="#fff" stroke="#1c1c1c" stroke-width="1.4" stroke-linejoin="round"/><circle cx="76" cy="38" r="4" fill="#ffd23f"/></g><g transform="translate(96 96)"><circle r="14" fill="#d6457a" stroke="#fff" stroke-width="3"/><path d="M-7 -3h4l7-5v16l-7-5h-4Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M7 -3c2 2 2 4 0 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></g></svg>
<text x="156" y="1005" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="24" text-anchor="middle" fill="#15181d">Poppy</text>
<rect x="272" y="797" width="736" height="183" rx="28" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<path d="M272 857L242 881L272 901Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="272" y1="863" x2="272" y2="897" stroke="#ffffff" stroke-width="6"/>
<text x="300" y="851" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="30" fill="#15181d">„Schnell ist schön. Geprüft ist besser.</text>
<text x="300" y="890" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="30" fill="#15181d">Ab morgen startet das Agenten-Tagebuch:</text>
<text x="300" y="929" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="30" fill="#15181d">ein Agent, ein echter Erfolg pro Tag.“</text>
<text x="986" y="966" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="14" letter-spacing="0.5" text-anchor="end" fill="#5b616b">PERSONA-STIMME · AUS DEN BELEGEN GESCHRIEBEN</text>
<rect x="72" y="1110" width="391" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1138" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">EINE REGEL, KEINE STATISTIK</text>
<text x="72" y="1180" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Die Merge-Entscheidung liegt nach Regel (Team-Charta) beim Gründer; Gates</text>
<text x="72" y="1232" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">markiert nie ein Agent als bestanden. Nicht gemessen: wie lange eine</text>
<text x="72" y="1256" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">menschliche Prüfung dauert.</text>
<line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/><text x="72" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" fill="#5b616b">@nilwerk · nilwerk.de</text><text x="1008" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" text-anchor="end" fill="#5b616b">KI-Agenten, geleitet und geprüft von Menschen</text></svg>