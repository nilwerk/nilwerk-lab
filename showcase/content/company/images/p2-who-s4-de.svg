<rect x="72" y="176" width="430" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="210" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">NILWERK STORY · WER · 4/4</text>
<text x="72" y="320" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#15181d">Zwei Menschen</text>
<text x="72" y="411" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#0f7a5c">machen es real.</text>
<rect x="72" y="542" width="936" height="206" rx="20" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<svg x="92" y="562" width="166" height="166" viewBox="0 0 120 120"><defs><clipPath id="clip-int-c23h0"><rect width="120" height="120" rx="28"/></clipPath></defs><g clip-path="url(#clip-int-c23h0)"><rect width="120" height="120" fill="#5b6770" opacity=".16"/><circle cx="60" cy="56" r="40" fill="#5b6770" opacity=".18"/><circle cx="60" cy="50" r="15" fill="#5b6770"/><path d="M30 92c3-17 15-25 30-25s27 8 30 25Z" fill="#5b6770"/></g><g transform="translate(96 96)"><circle r="14" fill="#5b6770" stroke="#fff" stroke-width="3"/><path d="M-6 6L2 -2M1 -7a5 5 0 1 0 6 6l-3-1-2-2Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
<text x="286" y="604" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="36" letter-spacing="-1" fill="#15181d">Arsany, Gründer</text>
<text x="286" y="632" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1" fill="#0f7a5c">MENSCH</text>
<text x="286" y="670" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#15181d">Leitet das Team, entscheidet, bestellt. Nach</text>
<text x="286" y="703" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#15181d">unserer Regel ist ohne sein Ja nichts fertig.</text>
<rect x="72" y="768" width="936" height="206" rx="20" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<svg x="92" y="788" width="166" height="166" viewBox="0 0 120 120"><defs><clipPath id="clip-int-c23h1"><rect width="120" height="120" rx="28"/></clipPath></defs><g clip-path="url(#clip-int-c23h1)"><rect width="120" height="120" fill="#5b6770" opacity=".16"/><circle cx="60" cy="56" r="40" fill="#5b6770" opacity=".18"/><circle cx="60" cy="50" r="15" fill="#5b6770"/><path d="M30 92c3-17 15-25 30-25s27 8 30 25Z" fill="#5b6770"/></g><g transform="translate(96 96)"><circle r="14" fill="#5b6770" stroke="#fff" stroke-width="3"/><path d="M-6 6L2 -2M1 -7a5 5 0 1 0 6 6l-3-1-2-2Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
<text x="286" y="830" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="36" letter-spacing="-1" fill="#15181d">Hardware-Integrator</text>
<text x="286" y="858" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="17" letter-spacing="1" fill="#0f7a5c">MENSCH</text>
<text x="286" y="896" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#15181d">Ein Mensch, der die ersten echten Platinen</text>
<text x="286" y="929" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#15181d">bestücken, flashen und am Prüfstand testen wird.</text>
<text x="72" y="1024" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#5b616b">Agenten dürfen einen Kauf vorbereiten, aber nie auslösen. Noch ist</text>
<text x="72" y="1058" font-family="Inter, sans-serif" font-weight="400" font-size="25" fill="#5b616b">keine Platine gebaut: Bisher sind es Entwurf, Simulation und Tests.</text>
<rect x="72" y="1110" width="365" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1138" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">NOCH KEINE PLATINE GEBAUT</text>
<text x="72" y="1180" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Praktische Arbeit geht als schriftlicher Arbeitsauftrag an den Integrator und</text>
<text x="72" y="1232" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">kommt mit Messwerten zurück. Hardware-Zahlen bleiben „simuliert“ oder</text>
<text x="72" y="1256" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">„geschätzt“, bis er gemessen hat.</text>
<line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/><text x="72" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" fill="#5b616b">@nilwerk · nilwerk.de</text><text x="1008" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" text-anchor="end" fill="#5b616b">KI-Agenten, geleitet und geprüft von Menschen</text></svg>