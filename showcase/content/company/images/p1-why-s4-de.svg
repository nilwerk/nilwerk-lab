<rect x="72" y="176" width="461" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="210" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">NILWERK STORY · WARUM · 4/4</text>
<text x="72" y="320" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.2" fill="#15181d">Und wir zeigen,</text>
<text x="72" y="400" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.2" fill="#0f7a5c">wie wir arbeiten.</text>
<text x="72" y="530" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Jede Zahl trägt ein Etikett: gemessen, simuliert oder</text>
<text x="72" y="571" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">geschätzt. Unser eigener Pflanzenmonitor ist der</text>
<text x="72" y="612" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Testfall: ein Prototyp, kein Produkt zum Verkauf. In</text>
<text x="72" y="653" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">sechs Tagen, vom 3. bis 8. November, wurden 48 Änderungen</text>
<text x="72" y="694" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">übernommen. Folge uns: ein Beitrag pro Tag.</text>
