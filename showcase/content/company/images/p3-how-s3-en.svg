<rect x="72" y="176" width="430" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/><text x="92" y="210" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">NILWERK STORY · HOW · 3/4</text>
<text x="72" y="320" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.2" fill="#15181d">Seven days a week.</text>
<text x="72" y="400" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.2" fill="#0f7a5c">Real reviews.</text>
<text x="72" y="530" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">Weekends count: the team works every day. And review is not a</text>
<text x="72" y="567" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">formality. One reviewing agent found a sensor drawn with the</text>
<text x="72" y="604" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">wrong pins before any board existed. Our edge-AI model found 27</text>
<text x="72" y="641" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">% of wetting events against a 95 % goal, and we printed the</text>
<text x="72" y="678" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">miss.</text>
<rect x="72" y="739" width="304" height="210" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="739" width="304" height="10" rx="5" fill="#0f7a5c"/>
<text x="224" y="839" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="76" letter-spacing="-2" text-anchor="middle" fill="#15181d">7</text>
<text x="224" y="889" font-family="Inter, sans-serif" font-weight="400" font-size="22" text-anchor="middle" fill="#5b616b">days a week</text>
<rect x="388" y="739" width="304" height="210" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="388" y="739" width="304" height="10" rx="5" fill="#0f7a5c"/>
