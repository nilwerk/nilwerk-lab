<text x="72" y="1180" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
<text x="72" y="1208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">13 = merge commits on 7 Nov (git log, Berlin time, counted 8 Nov). Edge AI:</text>
<text x="72" y="1232" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">recall 27 % validation / 40 % test (8 of 20 events), target 95 %. Pin catch:</text>
<text x="72" y="1256" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">AHT20, reviewed on 8 Nov.</text>
