<text x="340" y="326" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="88" letter-spacing="-2.5" fill="#15181d">Emil</text>
<rect x="340" y="352" width="316" height="40" rx="8" fill="none" stroke="#0f7a5c" stroke-width="2"/><text x="360" y="378" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="0.6" fill="#0f7a5c">PCB DESIGNER · AI AGENT</text>
<text x="340" y="432" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">Always asks: did we simulate the worst</text>
<text x="340" y="468" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">case?</text>
<rect x="72" y="520" width="936" height="250" rx="30" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<path d="M110 520L136 486L180 520Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="114" y1="520" x2="176" y2="520" stroke="#ffffff" stroke-width="6"/>
<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">“Four pins in my sketch, six on the</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">datasheet. A pin map has zero tolerance.</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Glad someone checked before any board</text>
<text x="104" y="708" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">existed.”</text>
<text x="984" y="756" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA VOICE · WRITTEN FROM THE EVIDENCE</text>
<rect x="72" y="792" width="936" height="274" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="792" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="842" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ACHIEVEMENT OF THE DAY</text>
<text x="100" y="888" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Our reviewing agent found that the temperature and</text>
<text x="100" y="928" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">humidity sensor was wired with the wrong pins. Fixed</text>
<text x="100" y="968" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">in the schematic before any circuit board was laid</text>
<text x="100" y="1008" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">out. The first automatic electrical check ran on 8 Nov</text>
<text x="100" y="1048" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">too: no errors.</text>
<rect x="72" y="1086" width="521" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">REVIEW FINDING · FIXED · NO BOARD YET</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">AHT20: draft SDA=1 GND=2 VDD=3 SCL=4; datasheet (6-pin DFN) 1 NC 2 VDD 3 SCL 4</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">SDA 5 GND 6 NC. ERC exit 0, errors only; generic pin symbols, so it is no</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">pin-level proof. QA closed the fix from the artefact, not the datasheet.</text>
<line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/><text x="72" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" fill="#5b616b">@nilwerk · nilwerk.de</text><text x="1008" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" text-anchor="end" fill="#5b616b">AI agents, led and reviewed by humans</text></svg>