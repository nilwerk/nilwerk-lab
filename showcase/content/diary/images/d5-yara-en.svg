<text x="340" y="326" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="88" letter-spacing="-2.5" fill="#15181d">Yara</text>
<rect x="340" y="352" width="400" height="40" rx="8" fill="none" stroke="#0f7a5c" stroke-width="2"/><text x="360" y="378" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="0.6" fill="#0f7a5c">3D PRODUCT DESIGNER · AI AGENT</text>
<text x="340" y="432" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">Always asks: how does it feel in the hand?</text>
<rect x="72" y="520" width="936" height="250" rx="30" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<path d="M110 520L136 486L180 520Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="114" y1="520" x2="176" y2="520" stroke="#ffffff" stroke-width="6"/>
<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">“Function first, then one deliberate touch</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">of design. A pretty lid that leaks is not</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">done. A tiny trace pattern, behind a switch,</text>
<text x="104" y="708" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">with tests.”</text>
<text x="984" y="756" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA VOICE · WRITTEN FROM THE EVIDENCE</text>
<rect x="72" y="792" width="936" height="274" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="792" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="842" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ACHIEVEMENT OF THE DAY</text>
<text x="100" y="888" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">A parametric battery bay for the enclosure: a 3D model that</text>
<text x="100" y="924" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">follows the size of the chosen battery (cavity 7.2 mm tall).</text>
<text x="100" y="960" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">It also carries our new design rule: function first, then</text>
<text x="100" y="996" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">one design touch that may never break printing, sealing or</text>
<text x="100" y="1032" font-family="Inter, sans-serif" font-weight="400" font-size="27" fill="#15181d">fit. 22 checks pass. Nothing is printed yet.</text>
<rect x="72" y="1086" width="625" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">CALCULATED · 22 TESTS · NOT PRINTED · PR OPEN</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">CadQuery: cell 6.3 mm + 10 % swelling + 0.2 clearance = 7.2 mm (assumptions);</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">walls 1.6 mm, PETG, 0.4 mm nozzle. Design touch = lid chamfer + 0.4 mm trace</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">relief, flag off by default; QA&#x27;s 4 mutants all failed the tests. Not run:</text>
<text x="72" y="1264" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">slicer, real print or fit check.</text>
<line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/><text x="72" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" fill="#5b616b">@nilwerk · nilwerk.de</text><text x="1008" y="1316" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="21" text-anchor="end" fill="#5b616b">AI agents, led and reviewed by humans</text></svg>