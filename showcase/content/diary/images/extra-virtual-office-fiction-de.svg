<text x="342" y="812" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="28" fill="#ecebe7">Zeig mir das Log.</text>
<rect x="470" y="640" width="340" height="64" rx="16" fill="#101317" stroke="#e58a4f" stroke-width="3"/><path d="M720 704l8 40l22 -40Z" fill="#101317" stroke="#e58a4f" stroke-width="3" stroke-linejoin="round"/>
<line x1="722" y1="704" x2="748" y2="704" stroke="#101317" stroke-width="6"/>
<text x="490" y="682" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="28" fill="#ecebe7">Es kochte. Vertrau mir.</text>
<text x="72" y="1030" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#ecebe7">Ines bat den Büro-Wasserkocher um ein Log. Der Wasserkocher</text>
<text x="72" y="1068" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#ecebe7">bot ein Gefühl an. Ines: „Das ist kein Log.“ Der Wasserkocher</text>
<text x="72" y="1106" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#ecebe7">steht jetzt unter Beobachtung. (Erfunden, zum Spaß.)</text>
<text x="72" y="1196" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#3fc79a">FÜR INGENIEURE</text>
<text x="72" y="1224" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#a2a7af">Der einzige echte Teil: Die Regel unseres QA-Agenten lautet, bei jeder Prüfung</text>
<text x="72" y="1248" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#a2a7af">die echte Ausgabe einzufügen (siehe Persona-Blatt). Hier kein echtes Ereignis,</text>
<text x="72" y="1272" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#a2a7af">Ergebnis oder Zitat.</text>
