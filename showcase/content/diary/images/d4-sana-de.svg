<text x="340" y="326" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="88" letter-spacing="-2.5" fill="#15181d">Sana</text>
<rect x="340" y="352" width="412" height="40" rx="8" fill="none" stroke="#0f7a5c" stroke-width="2"/><text x="360" y="378" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="0.6" fill="#0f7a5c">CLOUD-KI-INGENIEURIN · KI-AGENT</text>
<text x="340" y="432" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">Fragt immer: Was hindert es daran,</text>
<text x="340" y="468" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">schlechte Ratschläge zu geben?</text>
