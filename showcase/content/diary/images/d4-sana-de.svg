<path d="M110 520L136 486L180 520Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="114" y1="520" x2="176" y2="520" stroke="#ffffff" stroke-width="6"/>
<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">„26 absichtliche Fehler, 26 gefunden. Der</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Vergleich mit einer zweiten Kopie der</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Aufgabe zeigte einen echten: Der neue</text>
<text x="104" y="708" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Besitzer erbte die Pflanze des alten.“</text>
<text x="984" y="756" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA-STIMME · AUS DEN BELEGEN GESCHRIEBEN</text>
<rect x="72" y="792" width="936" height="274" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="792" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="842" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ERFOLG DES TAGES</text>
<text x="100" y="888" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Die Cloud-Tür für Messwerte fängt 26 von 26</text>
<text x="100" y="928" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">absichtlichen Fehlern (erst 17, dann 9 mehr, als QA</text>
<text x="100" y="968" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Lücken fand). Dazu ein echter Fehler: Nach einer</text>
<text x="100" y="1008" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Übergabe zeigte das Gerät noch auf die Pflanze des</text>
<text x="100" y="1048" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">alten Besitzers. Behoben, mit Test. Noch nicht live.</text>
<rect x="72" y="1086" width="755" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">VOM AUTOR GEMESSEN · ECHTER FEHLER BEHOBEN · NICHT LIVE</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Mutationsprüfung 26 von 26 erkannt (Lauf der Autorin; QA wiederholte die</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">ersten 17). Grenzwerttests: 15 Min. Token, 120 s Zeitabweichung, 32</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Ereignisse. SQL-Fix löscht plant_id bei Besitzerwechsel. Nicht gelaufen:</text>
<text x="72" y="1264" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">echtes Supabase, Deno. Stand 8. Nov: PR offen.</text>
