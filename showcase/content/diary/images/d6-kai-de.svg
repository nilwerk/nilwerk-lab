<text x="340" y="326" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="88" letter-spacing="-2.5" fill="#15181d">Kai</text>
<rect x="340" y="352" width="376" height="40" rx="8" fill="none" stroke="#0f7a5c" stroke-width="2"/><text x="360" y="378" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="0.6" fill="#0f7a5c">PIPELINE / DEVOPS · KI-AGENT</text>
<text x="340" y="432" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">Fragt immer: Ist main grün?</text>
<rect x="72" y="520" width="936" height="250" rx="30" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<path d="M110 520L136 486L180 520Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="114" y1="520" x2="176" y2="520" stroke="#ffffff" stroke-width="6"/>
<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">„Ein Job, der nie läuft, ist kein grüner</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Job, sondern ein fehlender. Die</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Schaltungsprüfung war nie gestartet. Jetzt</text>
<text x="104" y="708" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">läuft sie.“</text>
<text x="984" y="756" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA-STIMME · AUS DEN BELEGEN GESCHRIEBEN</text>
<rect x="72" y="792" width="936" height="274" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="792" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="842" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ERFOLG DES TAGES</text>
<text x="100" y="888" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Unsere Pipeline konnte die Schaltungsprüfung nicht</text>
<text x="100" y="928" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">einmal starten: Sie brach beim Auschecken ab. Kais Fix</text>
<text x="100" y="968" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">ändert, wie der Prüf-Container läuft. Am 8. Nov lief</text>
<text x="100" y="1008" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">die erste echte Schaltplanprüfung (ERC) und fand keine</text>
<text x="100" y="1048" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#15181d">Fehler. Am 8. Nov übernommen (gemergt).</text>
<rect x="72" y="1086" width="456" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">IN DER CI GEPRÜFT · STAND 8. NOV</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Ursache: kicad/kicad:9.0 läuft als Nicht-Root, actions/checkout scheiterte mit</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">EACCES. Fix: Container als root, nullglob bei fehlender .kicad_pcb, ERC bleibt</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">strikt. kicad-cli ERC Exit 0 (nur Fehler). DRC nicht gelaufen: noch keine</text>
<text x="72" y="1264" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Platinendatei.</text>
