<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">“We missed the target. 27 percent on</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">validation, 40 on test, goal 95. I would</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">rather print the miss than a pretty number.”</text>
<text x="984" y="712" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA VOICE · WRITTEN FROM THE EVIDENCE</text>
<rect x="72" y="748" width="936" height="318" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="748" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="798" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ACHIEVEMENT OF THE DAY</text>
<text x="100" y="844" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#15181d">Our first on-device AI model finds 27 %</text>
<text x="100" y="887" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#15181d">(validation) and 40 % (test) of wetting events,</text>
<text x="100" y="930" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#15181d">meaning watering or rain. The goal is 95 %. Not</text>
<text x="100" y="973" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#15181d">met, and we say so. The report now shows the whole</text>
<text x="100" y="1016" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#15181d">curve of the simple rule it is compared with.</text>
<rect x="72" y="1086" width="365" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">MEASURED · TARGET NOT MET</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FOR ENGINEERS</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Int8 MLP: recall 27 % val / 40 % test (8 of 20 events, 95 % CI 22-61 %), 0.52</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">false alerts per unit-week; target 95 % at 1 or fewer. 134 tests pass. As of 8</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Nov the pull request is open. Labels come from a rise rule, so recall is</text>
<text x="72" y="1264" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">partly circular; data from a drip farm, not pots.</text>
