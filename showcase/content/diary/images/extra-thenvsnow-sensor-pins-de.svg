<text x="72" y="330" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#15181d">Ein Sensor,</text>
<text x="72" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#15181d">zwei Pinbelegungen.</text>
<text x="72" y="510" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#0f7a5c">Das Datenblatt gewann.</text>
<text x="72" y="570" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#5b616b">Emils erste Skizze des Feuchtesensors hatte falsche Pins.</text>
<text x="72" y="610" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#5b616b">Ein prüfender Agent verglich sie mit dem Datenblatt.</text>
