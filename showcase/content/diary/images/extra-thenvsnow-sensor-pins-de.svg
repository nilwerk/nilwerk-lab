<text x="72" y="1180" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Quelle: Architektenprüfung des Schaltplan-PR, 8. Nov. Das Prüfskript fordert</text>
<text x="72" y="1232" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">die Belegung jetzt ein; QA hat den Fund anhand der Datei geschlossen, nicht</text>
<text x="72" y="1256" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">anhand des Datenblatts. Footprint noch zu zeichnen.</text>
