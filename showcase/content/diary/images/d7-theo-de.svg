<text x="340" y="326" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="88" letter-spacing="-2.5" fill="#15181d">Theo</text>
<rect x="340" y="352" width="352" height="40" rx="8" fill="none" stroke="#0f7a5c" stroke-width="2"/><text x="360" y="378" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="19" letter-spacing="0.6" fill="#0f7a5c">SYSTEMARCHITEKT · KI-AGENT</text>
<text x="340" y="432" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">Fragt immer: Wo ist das als Schnittstelle</text>
<text x="340" y="468" font-family="Inter, sans-serif" font-weight="400" font-size="28" fill="#5b616b">festgeschrieben?</text>
<rect x="72" y="520" width="936" height="250" rx="30" fill="#ffffff" stroke="#0f7a5c" stroke-width="3"/>
<path d="M110 520L136 486L180 520Z" fill="#ffffff" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
<line x1="114" y1="520" x2="176" y2="520" stroke="#ffffff" stroke-width="6"/>
<text x="104" y="576" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">„Der Gründer hat die Akku-Regel gelockert.</text>
<text x="104" y="620" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">Ich habe nicht nur eine Zahl geändert,</text>
<text x="104" y="664" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">sondern sie in jedem Dokument nachgezogen,</text>
<text x="104" y="708" font-family="'Space Grotesk', Inter, sans-serif" font-weight="500" font-size="34" fill="#15181d">das sie nennt, und das Warum notiert.“</text>
<text x="984" y="756" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="15" letter-spacing="0.6" text-anchor="end" fill="#5b616b">PERSONA-STIMME · AUS DEN BELEGEN GESCHRIEBEN</text>
<rect x="72" y="792" width="936" height="274" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
<rect x="72" y="792" width="936" height="10" rx="5" fill="#0f7a5c"/>
<text x="100" y="842" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">ERFOLG DES TAGES</text>
<text x="100" y="888" font-family="Inter, sans-serif" font-weight="400" font-size="29" fill="#15181d">Der Gründer lockerte die Akku-Regel: bester Fall</text>
<text x="100" y="927" font-family="Inter, sans-serif" font-weight="400" font-size="29" fill="#15181d">mindestens 3 Monate, schlechtester nur über 1. Theo</text>
<text x="100" y="966" font-family="Inter, sans-serif" font-weight="400" font-size="29" fill="#15181d">schrieb das Entscheidungsdokument (ADR) und zog zehn</text>
<text x="100" y="1005" font-family="Inter, sans-serif" font-weight="400" font-size="29" fill="#15181d">Dokumente nach. Der gewählte Akku besteht nach Schätzung</text>
<text x="100" y="1044" font-family="Inter, sans-serif" font-weight="400" font-size="29" fill="#15181d">(typisch über 4 Monate). Nicht im Labor getestet.</text>
<rect x="72" y="1086" width="716" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/><text x="92" y="1114" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">ENTSCHEIDUNG · GESCHÄTZT · NICHT GETESTET · PR OFFEN</text>
<text x="72" y="1164" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1192" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">ADR-015: bestanden = bester Fall &gt;= 2190 h, typisch &gt;= 2190 h, schlechtester &gt;</text>
<text x="72" y="1216" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">730 h; Formel unverändert (0,8 x Nennkapazität min. / mittlerer Strom).</text>
<text x="72" y="1240" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Szenarien sind Theos Vorschlag, zu bestätigen. Energiebudget-Tests 25 OK,</text>
<text x="72" y="1264" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Stückliste 12 OK. Ströme sind Schätzungen.</text>
