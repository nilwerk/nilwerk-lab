<text x="72" y="330" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#15181d">Eine Pflanze, ein</text>
<text x="72" y="420" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="84" letter-spacing="-2.2" fill="#0f7a5c">Sensor, ein Handy.</text>
<text x="72" y="480" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#5b616b">Die Idee in einem Bild. Das ist eine Zeichnung: Noch</text>
<text x="72" y="520" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#5b616b">läuft kein Prototyp.</text>
