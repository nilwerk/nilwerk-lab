<rect x="196" y="994" width="620" height="80" rx="16" fill="#f6f4ef" stroke="#0f7a5c" stroke-width="3"/>
<text x="214" y="1026" font-family="Inter, sans-serif" font-weight="600" font-size="22" fill="#15181d">Das ist eine Zeichnung. Das echte Foto kommt,</text>
<text x="214" y="1054" font-family="Inter, sans-serif" font-weight="600" font-size="22" fill="#15181d">sobald die erste Platine gebaut ist.</text>
<rect x="72" y="1106" width="755" height="44" rx="8" fill="none" stroke="#b4541a" stroke-width="2" stroke-dasharray="10 7"/><text x="92" y="1134" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.0" fill="#b4541a">ILLUSTRATION, KEIN FOTO · NOCH KEIN PROTOTYP IM BETRIEB</text>
<text x="72" y="1196" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
<text x="72" y="1224" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Geplante Kette: Bodensensor, Board der ESP32-Klasse, WLAN, Cloud, App.</text>
<text x="72" y="1248" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">Akkulaufzeit bleibt „simuliert“, bis ein Bench-Test existiert. Die Zeichnung</text>
<text x="72" y="1272" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="20" fill="#5b616b">zeigt keinen echten Messwert und kein echtes Gerät.</text>
