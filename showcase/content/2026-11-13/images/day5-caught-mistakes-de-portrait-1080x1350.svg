<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Prüfung fand drei Fehler. Ein Ziel verfehlt.">
  <!-- Nilwerk post template v0.1 (PROPOSAL). Instagram portrait 4:5. Placeholders: {{...}}. Colours: brand.css tokens. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2ded5" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#f6f4ef"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- logo: mark + wordmark (same geometry as nilwerk.de) -->
  <g transform="translate(72 64) scale(2.25)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M10 22V9.5l12 12.5V9.5" fill="none" stroke="#3fc79a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <circle cx="22" cy="9.5" r="2.6" fill="#15181d" stroke="#3fc79a" stroke-width="1.8"/>
    <path d="M6.5 26.6c2.4-1.5 4.8-1.5 7.2 0s4.8 1.5 7.2 0 4.8-1.5 6.9-.1" fill="none" stroke="#8fd9ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="156" y="119" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.3" fill="#15181d">nil<tspan fill="#0f7a5c">werk</tspan></text>

  <!-- kicker chip -->
  <rect x="72" y="176" width="563" height="52" rx="26" fill="#e3f2ec" stroke="#0f7a5c" stroke-width="2"/>
  <text x="96" y="211" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="24" letter-spacing="1.2" fill="#0f7a5c">LOGBUCH · TAG 5 · FEHLER GEFUNDEN</text>

  <!-- headline (max about 19 characters per line) -->
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.4">
    <text x="72" y="345" fill="#15181d">Prüfung fand</text>
    <text x="72" y="443" fill="#15181d">drei Fehler.</text>
    <text x="72" y="541" fill="#0f7a5c">Ein Ziel verfehlt.</text>
  </g>
  <g font-family="Inter, sans-serif" font-weight="400" font-size="34" fill="#5b616b">
    <text x="72" y="622">Fünf Bausteine am 8. Nov, je zweifach geprüft.</text>
    <text x="72" y="668">Keiner ist gemergt: Das entscheidet ein Mensch.</text>
  </g>

  <!-- two evidence tiles -->
  <g>
    <rect x="72" y="730" width="456" height="350" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="72" y="730" width="456" height="10" rx="5" fill="#0f7a5c"/>
    <text x="100" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#0f7a5c">IN DER PRÜFUNG GEFUNDEN</text>
    <text x="100" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#15181d">3</text>
    <text x="100" y="972" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">falsche Pinbelegung, falsche</text>
    <text x="100" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">Zahl in der Bildunterschrift,</text>
    <text x="100" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">ein wertloser Vergleich</text>
  </g>
  <g>
    <rect x="552" y="730" width="456" height="350" rx="18" fill="#ffffff" stroke="#e2ded5" stroke-width="2"/>
    <rect x="552" y="730" width="456" height="10" rx="5" fill="#b4541a"/>
    <text x="580" y="796" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#b4541a">EDGE-KI RECALL · ZIEL 95 %</text>
    <text x="580" y="906" font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" font-size="100" letter-spacing="-3" fill="#15181d">27-40 %</text>
    <text x="580" y="972" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">der Ereignisse erkannt,</text>
    <text x="580" y="1010" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">Ziel nicht erreicht;</text>
    <text x="580" y="1048" font-family="Inter, sans-serif" font-size="28" fill="#5b616b">Schaltplan-ERC nie gelaufen</text>
  </g>

  <!-- honesty chip: what kind of evidence this is -->
  <rect x="72" y="1112" width="835" height="48" rx="8" fill="none" stroke="#b4541a" stroke-width="2"/>
  <text x="92" y="1145" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="22" letter-spacing="1" fill="#b4541a">AUS PRÜFBERICHTEN GEZÄHLT · STAND 8. NOV · NICHT GEMERGT</text>

  <!-- layer 2: for engineers (numbers, how checked, what is unmeasured) + footer -->
  <text x="72" y="1204" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="20" letter-spacing="1.5" fill="#0f7a5c">FÜR INGENIEURE</text>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#5b616b">
    <text x="72" y="1232">Prüfkommentare PR 41, 44, 46; Modellbericht, PR 46</text>
    <text x="72" y="1258">Agentenzeit je Baustein: 6 bis 15 Minuten (gemessen)</text>
  </g>
  <line x1="72" y1="1278" x2="1008" y2="1278" stroke="#e2ded5" stroke-width="2"/>
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#5b616b">
    <text x="72" y="1316">@nilwerk · nilwerk.de</text>
    <text x="1008" y="1316" text-anchor="end">KI-Agenten, geleitet und geprüft von Menschen</text>
  </g>
</svg>
