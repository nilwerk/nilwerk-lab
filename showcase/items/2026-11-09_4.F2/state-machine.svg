<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111">4.F2 setup state machine: transitions observed in nw_prov.c</text>
<text x="20" y="46" font-size="11" fill="#555">Driven by a scratch gcc harness (7 scenarios, real code, no hardware). Edge labels are the events that caused each move.</text>
<line x1="199" y1="170" x2="249" y2="170" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="224" y="164" font-size="11" text-anchor="middle" fill="#0b4f8a">boot / boot / boot / boot / boot / button_10s / boot_hold_3s</text>
<line x1="429" y1="170" x2="479" y2="170" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="454" y="164" font-size="11" text-anchor="middle" fill="#0b4f8a">handshake_ok / handshake_ok / handshake_ok</text>
<line x1="558" y1="198" x2="558" y2="320" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="551" y="253" font-size="11" text-anchor="middle" fill="#0b4f8a">apply / apply / apply</text>
<line x1="481" y1="350" x2="431" y2="350" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="456" y="344" font-size="11" text-anchor="middle" fill="#0b4f8a">wifi_ok / wifi_ok</text>
<line x1="251" y1="350" x2="201" y2="350" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="226" y="344" font-size="11" text-anchor="middle" fill="#0b4f8a">claim_ok</text>
