<text x="340" y="175" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">ADVERTISING</text>
<rect x="485.0" y="146.0" width="170" height="48" rx="6" fill="#f2f4f7" stroke="#444"/>
<text x="570" y="175" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">SESSION</text>
<rect x="485.0" y="326.0" width="170" height="48" rx="6" fill="#f2f4f7" stroke="#444"/>
<text x="570" y="355" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">WIFI_CONNECTING</text>
<rect x="255.0" y="326.0" width="170" height="48" rx="6" fill="#f2f4f7" stroke="#444"/>
<text x="340" y="355" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">CLAIMING</text>
