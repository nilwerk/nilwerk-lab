<text x="340" y="110" font-size="11" text-anchor="middle" fill="#0b4f8a">handshake_fail / tick_5min</text>
<line x1="582" y1="322" x2="582" y2="200" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="589" y="255" font-size="11" text-anchor="middle" fill="#0b4f8a">wifi_auth</text>
<line x1="374" y1="324" x2="535" y2="198" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="454" y="255" font-size="11" text-anchor="middle" fill="#0b4f8a">claim_token_invalid</text>
