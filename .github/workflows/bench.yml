name: Bench (self-hosted)

# Runs on the bench Raspberry Pi (self-hosted runner, label `bench`). Supersedes the HIL design in
# projects/plant-monitor/docs/ci-firmware-in-the-loop.md (hil.yml, label esp32c3-bench, Environment gate).
# This workflow has no Environment gate (owner declined it).
# Triggers are deliberately narrow: the repository is PUBLIC, so anyone can open a pull request or fork it.
# Only users with write access can start a workflow_dispatch run, which is why manual dispatch is the only
# trigger here. Code from pull requests, forks or pushed branches must never execute on this runner.
#   workflow_dispatch  manual run only (owner decision, 22 Nov 2026: no nightly schedule),
#                      only from main (guard below). No branch allowance.
# NO schedule, pull_request, pull_request_target, push or issue_comment triggers, on purpose.
# Owner decision (21 Nov): nothing else may run on the Pi. The former branch allowance
# (for PR #156, now closed) was removed in the PR #162 fix round. Manual runs from main only.
#
# Order (build first, then install and test together). Decided by the owner (option 1): step 3 (provisioning) runs
# after a. Step c (BLE scan) runs inside the bench image's BLE setup window, which is 300 s from the reset of step 3
# (sdkconfig.defaults.bench-ci; A-138 changed it from 60 s). Step b (serial live-stream check, NWBENCH wake line) runs
# LATE, after the app flow d (A-139, owner-approved recommendation a): the measurement loop and its first wake line start
# only when the setup window closes (main.c calls nw_setup_run before the loop). Step b waits for that moment (the reset
# time is recorded by step 3), then reads the stream for 75 s. Bench step order: 1, 2, a, 3, c, 4, d, b, e, E2E.
#   build-firmware   GitHub-hosted, no secrets. Builds the setup-flow firmware. Artifact: plant-monitor-firmware-setup.
#   build-apk        GitHub-hosted, no secrets. Builds the Android debug APK. Artifact: plant-monitor-app-debug-<sha7>.
#   bench            the Pi. Needs both builds. Downloads both artifacts from THIS run, then runs steps
#                    1 (firmware), 2 (APK), a (flash), 3 (provision and flash NVS), c (BLE scan), 4 (APK install),
#                    d (app flow), b (serial live stream, no reset, after the setup window), e (cloud check), E2E.
# The two build jobs never touch the Pi. Their steps are copied from ci.yml (firmware job, setup image)
# and app-apk.yml (android-debug-apk job); they are not new builds.
#
# Requirements the bench round touches (rows in projects/plant-monitor/tests/acceptance-matrix.md).
# Each line says only what the named step checks. The rows are not passed by this workflow.
#   FR-D03  partial: step c finds the device by name; step d writes the setup data and checks only that
#           the app shows the device as connected. Not checked: that the device is claimed by, or
#           appears in, the user's account.
#   FR-A03  partial: step d only (scan, connect, write setup data, connected). Not checked: the rest
#           of the setup flow.
#   NFR-04  step e only shows that a row reached the cloud after the test start. Latency is not measured here.
#   NFR-06  partial, step e only: one row from this device reached the cloud. Not checked: per-device
#           credentials and user isolation. Secrets are used by name only and no reading value is printed.
#   NFR-07  not checked here: step e checks one row in the project named by BENCH_CLOUD_CHECK_CONFIG, which
#           the step comment calls the EU project. The workflow does not verify the region or hosting,
#           and tests no export or delete.
# The bench round checks ESP32-to-app and ESP32-to-cloud communication only. This workflow alone
# passes none of these rows.
# See docs/ci-bench-runner.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    name: build setup firmware (GitHub-hosted)
    runs-on: ubuntu-latest
    # No secrets. One repository VARIABLE (SUPABASE_URL, a public client value). The steps below are copied from the
    # firmware job of ci.yml (setup image only), plus the cloud API base URL step.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cloud API base URL for the bench build (repository variable SUPABASE_URL, fail closed)
        # The upload build needs CONFIG_PLANT_API_BASE_URL (DEV_GUIDE 7.1, option 2). It is built from the project URL in the
        # repository variable SUPABASE_URL (not a secret): <SUPABASE_URL>/functions/v1, the path of the functions
        # (docs/interfaces/openapi.yaml, servers; /device-claim and /ingest are under it).
        # The line goes into the git-ignored file firmware/sdkconfig.defaults.local, which the build step reads as one of
        # its SDKCONFIG_DEFAULTS. It is never printed. The artifact holds flash files only, so the file is never uploaded.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Repository variable SUPABASE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables (a variable, not a secret). Bench build aborted."
            exit 1
          fi
          # Checked exactly as set: no trailing slash is removed first, so a slash fails here.
          # Bash regex, not grep: grep matches per line, so a value with a newline could pass and break the config line.
          # Host only: https://<project-ref>.supabase.co, nothing after it. The host must end in .supabase.co.
          re='^https://[a-z0-9-]+\.supabase\.co$'
          if ! [[ "$SUPABASE_URL" =~ $re ]]; then
            echo "::error::Repository variable SUPABASE_URL must be https://<project-ref>.supabase.co (host ending in .supabase.co, no path, no trailing slash). Bench build aborted. The value is not printed."
            exit 1
          fi
          base="$SUPABASE_URL"
          umask 077
          printf 'CONFIG_PLANT_API_BASE_URL="%s/functions/v1"\n' "$base" > projects/plant-monitor/firmware/sdkconfig.defaults.local
          test -s projects/plant-monitor/firmware/sdkconfig.defaults.local
          echo "Bench build: cloud API base URL written to the git-ignored sdkconfig.defaults.local (value not printed)."
      - name: ESP-IDF build (esp32c3, setup flow on, simulator off)
        # Copied from ci.yml (job firmware). Pinned SHA: see the header of ci.yml. The firmware owner re-checks the pin.
        # set -e first: the first failing line fails the step, so the upload below does not run on a bad build.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: projects/plant-monitor/firmware
          command: |
            set -e
            rm -f sdkconfig.setup
            # sdkconfig.defaults.local is LAST, so its CONFIG_PLANT_API_BASE_URL overrides any earlier file (bench-ci included).
            idf.py -B build-setup -DIDF_TARGET=esp32c3 -DSDKCONFIG=sdkconfig.setup -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.v1;sdkconfig.defaults.setup;sdkconfig.defaults.bench-ci;sdkconfig.defaults.local" build size
            grep -q "^CONFIG_PLANT_SETUP_FLOW=y" sdkconfig.setup
            grep -q "^CONFIG_PLANT_BOARD_V1_SUPERMINI=y" sdkconfig.setup
            grep -q "^CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig.setup
            if grep -q "^CONFIG_PLANT_SIM_MOCK_SENSORS=y" sdkconfig.setup; then echo "simulated sensors must be off"; exit 1; fi
            # Bench CI image stays awake on USB: bench sleep cycle must be unset (sdkconfig.defaults.bench-ci).
            # Double quotes only in this block: the action wraps the whole command in single quotes, so a single quote here ends that wrapper early.
            if grep -q "^CONFIG_PLANT_BENCH_SLEEP_CYCLE=y" sdkconfig.setup; then echo "bench sleep cycle must be unset in the setup image (sdkconfig.defaults.bench-ci)"; exit 1; fi
            grep -qxF "# CONFIG_PLANT_BENCH_SLEEP_CYCLE is not set" sdkconfig.setup || { echo "sdkconfig.setup lacks the line: # CONFIG_PLANT_BENCH_SLEEP_CYCLE is not set (bench-ci overlay not applied)"; exit 1; }
            # Bench CI image: BLE setup window on every cold start without BOOT (sdkconfig.defaults.bench-ci). Double quotes only.
            grep -q "^CONFIG_PLANT_BENCH_AUTO_SETUP=y" sdkconfig.setup || { echo "sdkconfig.setup lacks CONFIG_PLANT_BENCH_AUTO_SETUP=y (bench-ci overlay not applied)"; exit 1; }
            grep -q "^CONFIG_PLANT_BENCH_SETUP_WINDOW_S=300" sdkconfig.setup || { echo "sdkconfig.setup lacks CONFIG_PLANT_BENCH_SETUP_WINDOW_S=300 (bench-ci overlay not applied)"; exit 1; }
            # Cloud API base URL from sdkconfig.defaults.local (written by the step before this build). Double quotes only here.
            grep -Eq "^CONFIG_PLANT_API_BASE_URL=.https://" sdkconfig.setup || { echo "sdkconfig.setup lacks CONFIG_PLANT_API_BASE_URL=https (sdkconfig.defaults.local not applied)"; exit 1; }
            if grep -Eq "^CONFIG_PLANT_API_BASE_URL=.*invalid" sdkconfig.setup; then echo "CONFIG_PLANT_API_BASE_URL is still the invalid placeholder"; exit 1; fi
            test -s build-setup/plant_monitor.bin
      - name: Check every flash file named in flasher_args.json
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # Copied from ci.yml (job firmware). The artifact holds every file esptool flashes (bootloader, partition table,
        # app). The list comes from flasher_args.json, so a missing or empty file, or an unsafe path, fails this step.
        id: files
        working-directory: projects/plant-monitor/firmware/build-setup
        shell: bash
        run: |
          set -euo pipefail
          test -s flasher_args.json
          files=$(jq -r '.flash_files[]' flasher_args.json)
          test -n "$files"
          for f in $files; do
            case "$f" in
              /*|*..*) echo "unsafe path in flasher_args.json: $f"; exit 1 ;;
            esac
            test -s "$f" || { echo "missing or empty flash file named in flasher_args.json: $f"; exit 1; }
          done
          {
            echo "paths<<PATHS_EOF"
            echo "projects/plant-monitor/firmware/build-setup/flasher_args.json"
            for f in $files; do echo "projects/plant-monitor/firmware/build-setup/$f"; done
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Flash files verified:"
          echo "$files"
      - name: Upload setup firmware artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: plant-monitor-firmware-setup
          # Exactly the flash files named in flasher_args.json, plus that file, so the artifact root is the build-setup
          # folder (flasher_args.json at the root). No sdkconfig, no logs, no NVS files (NVS is written per unit at the bench).
          path: ${{ steps.files.outputs.paths }}
          if-no-files-found: error

  build-apk:
    name: Android debug APK (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No secrets: the debug APK is signed with the debug key Gradle generates on the runner. The two inputs are
    # repository VARIABLES (public client values), not secrets. The steps below are copied from app-apk.yml.
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned to the commit SHA of v4.4.0 (11d5960a326750d5838078e36cf38b85af677262).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fail closed - app folder and documented build command
        run: |
          set -euo pipefail
          APP=projects/plant-monitor/app
          if [ ! -f "$APP/package.json" ] || [ ! -f "$APP/package-lock.json" ] || [ ! -f "$APP/app.config.ts" ]; then
            echo "::error::$APP is missing package.json, package-lock.json or app.config.ts. Build aborted."
            exit 1
          fi
          if ! grep -q 'expo prebuild --no-install' "$APP/README.md"; then
            echo "::error::$APP/README.md no longer documents 'npx expo prebuild --no-install'. Build aborted. Update the README and this workflow together."
            exit 1
          fi
          echo "App folder and the documented build command (npx expo prebuild --no-install) are present."

      - name: Check repository variable SUPABASE_URL
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Repository variable SUPABASE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables (a variable, not a secret). Build aborted."
            exit 1
          fi
          # Same host rule as the bench build (build-firmware): https://<project-ref>.supabase.co, nothing after it.
          # Checked exactly as set (no slash is removed first). Bash regex, so a value with a newline cannot pass.
          re='^https://[a-z0-9-]+\.supabase\.co$'
          if ! [[ "$SUPABASE_URL" =~ $re ]]; then
            echo "::error::Repository variable SUPABASE_URL must be https://<project-ref>.supabase.co (host ending in .supabase.co, no path, no trailing slash). Build aborted. The value is not printed."
            exit 1
          fi
          echo "SUPABASE_URL is set (a public client value; the job log MAY show it, depending on debug settings)."

      - name: Check repository variable SUPABASE_PUBLISHABLE_KEY
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY is not set. Add it under Settings > Secrets and variables > Actions > Variables (a variable, not a secret; the sb_publishable_... key). Build aborted."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*)
              echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY holds a secret key (sb_secret_...). Use the publishable key (sb_publishable_...). Build aborted. The value is not printed."
              exit 1 ;;
            sb_publishable_*) ;;
            *)
              # Legacy JWT-style keys: accept only a three-part JWT whose payload role is not service_role.
              if ! printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
                echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_ (or be a JWT-style publishable key). Build aborted. The value is not printed."
                exit 1
              fi
              PAYLOAD=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
              if ! DECODED=$(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null); then
                echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY looks like a JWT, but its payload cannot be base64url-decoded. Use the publishable key (sb_publishable_...). Build aborted. The value is not printed."
                exit 1
              fi
              if ! ROLE=$(printf '%s' "$DECODED" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert isinstance(p, dict); print(p.get("role", ""))' 2>/dev/null); then
                echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY looks like a JWT, but its payload is not a JSON object. Use the publishable key (sb_publishable_...). Build aborted. The value is not printed."
                exit 1
              fi
              if [ "$ROLE" = "service_role" ]; then
                echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY holds a service-role key. Use the publishable key. Build aborted. The value is not printed."
                exit 1
              fi ;;
          esac
          echo "SUPABASE_PUBLISHABLE_KEY is set (a public client value; the job log MAY show it, depending on debug settings)."

      - name: Set up Node
        # Node 22 (LTS), the same version the app job in ci.yml uses.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/plant-monitor/app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies (lockfile)
        working-directory: projects/plant-monitor/app
        run: npm ci

      - name: Generate the Android project (expo prebuild)
        working-directory: projects/plant-monitor/app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK with the JavaScript bundle (Gradle)
        # assembleRelease, not assembleDebug: the bench has no Metro server (bench decision, 23 Nov 2026). The release
        # build embeds the JS bundle, and expo-dev-launcher's Android code exists only in its debug source set.
        # Same change as app-apk.yml (keep the two in step). Signing: the template's release config (debug key).
        working-directory: projects/plant-monitor/app/android
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleRelease

      - name: Check the bundled release APK (fail closed)
        # Same check as app-apk.yml: one valid zip with assets/index.android.bundle, valid signature, package
        # de.nilwerk.plantmonitor, launcher de.nilwerk.plantmonitor.MainActivity only, no DevLauncherActivity in the
        # manifest. Reads the build output only; no secret is used or printed.
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::APK check: $1"; exit 1; }
          shopt -s nullglob
          apks=(projects/plant-monitor/app/android/app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" = "1" ] || fail "expected one release APK, found ${#apks[@]}"
          apk="${apks[0]}"
          unzip -tq "$apk" >/dev/null 2>&1 || fail "the release APK is not a valid zip archive"
          listing="$(mktemp)"
          unzip -l "$apk" > "$listing"
          grep -q ' assets/index.android.bundle$' "$listing" || fail "the JavaScript bundle (assets/index.android.bundle) is not inside the APK"
          aapt2=""
          apksigner=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
            [ -n "$aapt2" ] || aapt2="$(find "$root/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)"
            [ -n "$apksigner" ] || apksigner="$(find "$root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
          done
          [ -n "$aapt2" ] && [ -n "$apksigner" ] || fail "aapt2 or apksigner not found under ANDROID_HOME or ANDROID_SDK_ROOT (build-tools)"
          "$apksigner" verify "$apk" >/dev/null 2>&1 || fail "the APK signature does not verify"
          badging="$("$aapt2" dump badging "$apk")" || fail "aapt2 dump badging failed"
          grep -q "^package: name='de.nilwerk.plantmonitor'" <<<"$badging" || fail "the package is not de.nilwerk.plantmonitor"
          launchers="$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" <<<"$badging")"
          [ "$launchers" = "de.nilwerk.plantmonitor.MainActivity" ] || fail "the launcher activity is '${launchers:-none}', expected de.nilwerk.plantmonitor.MainActivity"
          dump="$(mktemp)"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$dump" 2>&1 || fail "aapt2 dump xmltree failed"
          if grep -q 'DevLauncherActivity' "$dump"; then fail "the manifest contains DevLauncherActivity (dev launcher, not usable on the bench)"; fi
          echo "APK check passed: JavaScript bundle inside, signature valid, package de.nilwerk.plantmonitor, launcher de.nilwerk.plantmonitor.MainActivity, no DevLauncherActivity."

      - name: Print APK sha256, size and manifest dump (diagnostic, never fails)
        # Diagnostic only: this step never fails the job. It prints the APK sha256 and size, the manifest entry
        # size, and the aapt2 xmltree dump of AndroidManifest.xml (full dump in the job summary). Purpose: the 6P
        # rejected the manifest at install (run 45184412853); the 6P runs at most Android 8.1 (API 27).
        shell: bash
        run: |
          set +eo pipefail
          shopt -s nullglob
          apks=(projects/plant-monitor/app/android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" != "1" ]; then
            echo "APK diagnostics: expected one debug APK, found ${#apks[@]}. Nothing printed; job continues."
            exit 0
          fi
          apk="${apks[0]}"
          echo "APK sha256=$(sha256sum "$apk" | cut -d' ' -f1) size=$(stat -c %s "$apk")"
          echo "APK manifest entry size=$(unzip -l "$apk" 2>/dev/null | awk '$NF=="AndroidManifest.xml" {print $1}')"

          aapt2=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
            cand="$(find "$root/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$cand" ]; then aapt2="$cand"; break; fi
          done
          if [ -z "$aapt2" ]; then
            echo "aapt2: not available on this runner (no build-tools/*/aapt2 under ANDROID_HOME or ANDROID_SDK_ROOT). Manifest dump skipped; job continues."
            exit 0
          fi
          echo "aapt2: ${aapt2}"
          dump="${RUNNER_TEMP:-/tmp}/manifest-xmltree.txt"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$dump" 2>&1
          echo "aapt2 dump exit code: $? (diagnostic only)"
          if [ ! -s "$dump" ]; then
            echo "aapt2 produced no output. Job continues."
            exit 0
          fi

          echo "--- uses-sdk ---"
          awk '/E: uses-sdk/ {p=1; print; next} /E: / {p=0} p && /A: / {print}' "$dump"
          for name in minSdkVersion targetSdkVersion; do
            hex="$(grep -m1 -oE "android:${name}\([^)]*\)=\(type 0x[0-9a-f]+\)0x[0-9a-f]+" "$dump" | grep -oE '0x[0-9a-f]+$')"
            if [ -n "$hex" ]; then echo "${name}=$((hex))"; else echo "${name}=not found"; fi
          done

          echo "--- lines with neverForLocation or attributes newer than API 27 ---"
          grep -nE 'android:(neverForLocation|dataExtractionRules|foregroundServiceType|enableOnBackInvokedCallback|localeConfig|hasFragileUserData|forceQueryable|preserveLegacyExternalStorage|requestLegacyExternalStorage|minAspectRatio|appComponentFactory|allowNativeHeapPointerTagging|gwpAsanMode)\(' "$dump" || echo "(none)"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### APK manifest dump (aapt2 xmltree, diagnostic)"
              echo ""
              echo "<details><summary>AndroidManifest.xml of ${apk##*/}</summary>"
              echo ""
              echo '```'
              cat "$dump"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Name the artifact by commit
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload the debug APK
        # Pinned to the commit SHA of actions/upload-artifact v4.6.2 (copied from app-apk.yml).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plant-monitor-app-debug-${{ steps.meta.outputs.short }}
          path: projects/plant-monitor/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  bench:
    name: bench smoke and E2E
    # Needs both builds of THIS run. If either build fails or is skipped, this job does not start.
    needs: [build-firmware, build-apk]
    # Only main. Any other ref, including PR branches, runs nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, bench]
    timeout-minutes: 60
    # Job-level only (22 Nov): steps 1 and 2 download this run's artifacts through the workflow token.
    # The workflow-level permissions above stay contents: read.
    permissions:
      contents: read
      actions: read
    # Job-level. One bench job at a time on the Pi: a queued run waits, a running one is never killed mid-test.
    concurrency:
      group: bench-runner
      cancel-in-progress: false
    env:
      # Node major the runner must provide. See docs/ci-bench-runner.md, "Node workaround".
      EXPECTED_NODE_MAJOR: "20"
    steps:
      - name: Record job start (for the wait limit in step d)
        # The job timeout (timeout-minutes: 60) counts from the job start. This is the first step, so its time is the start
        # that step d uses to check that each wait fits. Written to GITHUB_ENV for this run only.
        run: echo "BENCH_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        # Pinned to the full commit SHA of the actions/checkout v4.4.0 tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Clear bench-artifacts from earlier runs
        # Steps 1 and 2 download the firmware and the APK into bench-artifacts/ in the workspace.
        run: rm -rf -- "${GITHUB_WORKSPACE}/bench-artifacts"

      - name: Runner smoke check
        run: |
          echo "hostname: $(hostname)"
          echo "arch: $(uname -m)"
          echo "adb: $(command -v adb || true)"
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node not found on PATH; expected Node ${EXPECTED_NODE_MAJOR}.x (see docs/ci-bench-runner.md)"
            exit 1
          fi
          node_version="$(node --version)"
          node_major="${node_version#v}"
          node_major="${node_major%%.*}"
          echo "node: ${node_version}"
          if [ "${node_major}" != "${EXPECTED_NODE_MAJOR}" ]; then
            echo "::error::node major is ${node_major}, expected ${EXPECTED_NODE_MAJOR} (see docs/ci-bench-runner.md)"
            exit 1
          fi

      # Downloads and hardware steps, in the order the owner decided (option 1; A-138/A-139 moved b). The downloads come first
      # (they are the builds of this run), then a (flash), 3 (provisioning, NVS last), c (BLE scan), 4 (APK install), d (app flow),
      # b (serial check, after the setup window), e (cloud check), E2E.
      # Each one fails closed: if its input is missing it prints "not configured: nothing tested" and exits 1.
      # The E2E test bundle (expo export, run by bench/run_e2e.sh) is built on the Pi only when the app's node_modules
      # are installed on the runner. That is not yet the case.
      # Scope (owner decision, 21 Nov): the bench round tests ESP32-to-app and ESP32-to-cloud
      # communication only. Sensor values are not checked yet. The firmware is the setup-flow build
      # (CONFIG_PLANT_SETUP_FLOW=y, simulator off), built by the build-firmware job of this run.

      - name: "1. Download firmware image (build-firmware of this run)"
        # Input: artifact plant-monitor-firmware-setup from the build-firmware job of THIS run (run-id is this run;
        # older runs are never searched). The artifact root is the build-setup folder: flasher_args.json and the .bin
        # files it lists sit at the root (upload-artifact v4 roots the artifact at the common ancestor of the uploaded
        # paths). Extracted to bench-artifacts/firmware/build-setup/. Steps a and 3 read it from there.
        # Needs the job permission actions: read, through the workflow token. Nothing is uploaded.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plant-monitor-firmware-setup
          path: bench-artifacts/firmware/build-setup
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: "2. Download app APK (build-apk of this run)"
        # Input: artifact plant-monitor-app-debug-<sha7> from the build-apk job of THIS run (same run-id rule as step 1).
        # Downloaded into bench-artifacts/app-apk/. The next run step checks that exactly one APK is there.
        # Downloaded with the GitHub CLI, not actions/download-artifact: on this self-hosted runner the action wrote a
        # truncated APK (96,227,715 bytes instead of 180,763,206; runs 45180735909 and 45184412853). gh run download
        # gave the complete file (size, SHA-256 and unzip -t checked on the Pi).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/bench-artifacts/app-apk"
          mkdir -p "$dest"
          gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" -p 'plant-monitor-app-debug-*' -D "$dest"
          find "$dest" -type f -name '*.apk' -exec sh -c 'echo "2. app APK downloaded: $1 ($(stat -c %s "$1") bytes)"' _ {} \;

      - name: "2. Check app APK (one APK from build-apk of this run)"
        run: |
          set -euo pipefail
          fail() { echo "::error::2. app APK: $1"; exit 1; }
          work="${GITHUB_WORKSPACE}/bench-artifacts/app-apk"
          apks=()
          while IFS= read -r -d '' f; do apks+=("$f"); done < <(find "$work" -type f -name '*.apk' -print0 2>/dev/null)
          [ "${#apks[@]}" = "1" ] || fail "not found: expected one APK from the build-apk job of this run, found ${#apks[@]}"
          apk="${apks[0]}"
          [ -s "$apk" ] || fail "APK file is empty"
          # An APK is a zip archive with an end-of-archive record and a manifest. A download cut short fails here,
          # with a clear message, instead of failing later at adb install. This check does NOT catch the install
          # failure seen in run 45184412853: that APK was a complete zip (unzip -t OK, sha256 matched the upload).
          # The device rejected its AndroidManifest.xml during parsing; that cause is still open.
          unzip -tq "$apk" >/dev/null 2>&1 || fail "APK is not a valid zip archive (truncated or corrupt download): $apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml' || fail "APK has no AndroidManifest.xml"
          echo "APK sha256=$(sha256sum "$apk" | cut -d' ' -f1) size=$(stat -c %s "$apk")"
          echo "BENCH_APK_PATH=${apk}" >> "$GITHUB_ENV"
          echo "2. app APK: saved to the runner workspace from run ${GITHUB_RUN_ID} (commit ${GITHUB_SHA})"

      - name: "a. Firmware flash (ESP32-C3 over USB)"
        # Input: the setup firmware from step 1 (bench-artifacts/firmware/build-setup: flasher_args.json and the files it
        # lists). The artifact has no merged image, so every file in flash_files is written at its listed offset, in
        # offset order (the same rule as step 3). No offset is hard-coded. No file, no flash.
        env:
          BENCH_ESP_PORT: /dev/ttyACM0     # USB serial port of the ESP32-C3 on the bench Pi
        run: |
          set -euo pipefail
          build="${GITHUB_WORKSPACE}/bench-artifacts/firmware/build-setup"
          if [ ! -f "${build}/flasher_args.json" ]; then
            echo "::error::a. firmware flash: not configured: nothing tested (missing ${build}/flasher_args.json from step 1)"
            exit 1
          fi
          esptool="$(command -v esptool.py || command -v esptool || true)"
          if [ -z "$esptool" ]; then
            echo "::error::a. firmware flash: not configured: nothing tested (esptool not installed on the runner)"
            exit 1
          fi
          if [ ! -e "$BENCH_ESP_PORT" ]; then
            echo "::error::a. firmware flash: not configured: nothing tested (no device at ${BENCH_ESP_PORT})"
            exit 1
          fi
          # Pinned: esptool v5.x only. The chip-id command below is the v5 spelling.
          esptool_major="$("$esptool" version 2>&1 | sed -n -E 's/^[^0-9]*([0-9]+)\..*$/\1/p' | head -n 1 || true)"
          if [ "$esptool_major" != "5" ]; then
            echo "::error::a. firmware flash: esptool major is '${esptool_major}', expected 5 (esptool v5.x is pinned)"
            exit 1
          fi
          # Read the chip id first. Stop unless it is an ESP32-C3.
          chip_out="$("$esptool" --port "$BENCH_ESP_PORT" chip-id 2>&1)"
          echo "$chip_out"
          if ! grep -q "ESP32-C3" <<<"$chip_out"; then
            echo "::error::a. firmware flash: chip is not an ESP32-C3, not flashing"
            exit 1
          fi
          # Flash plan, read before any write. Same rules as step 3: each path inside the build-setup folder,
          # the file present and not empty, offsets as numbers, written in offset order.
          plan="$(mktemp)"
          python3 -I - "$build" > "$plan" <<'PY' || { rm -f "$plan"; echo "::error::a. firmware flash: flash plan could not be read from flasher_args.json (reason above)"; exit 1; }
          import json, os, sys
          build = os.path.realpath(sys.argv[1])
          with open(os.path.join(build, "flasher_args.json"), encoding="utf-8") as f:
              data = json.load(f)
          ff = data.get("flash_files") if isinstance(data, dict) else None
          if not isinstance(ff, dict) or not ff:
              sys.exit("flasher_args.json has no flash_files map")
          rows = []
          for off_text, rel in ff.items():
              off = int(str(off_text), 0)
              if off < 0 or not isinstance(rel, str) or not rel or os.path.isabs(rel) \
                      or ".." in rel.split("/") or "\\" in rel:
                  sys.exit("flash_files has a file path outside the build-setup folder")
              path = os.path.realpath(os.path.join(build, rel))
              if os.path.commonpath([build, path]) != build or not os.path.isfile(path) \
                      or os.path.getsize(path) == 0:
                  sys.exit("a file listed in flash_files is missing or empty: " + rel)
              rows.append((off, path))
          for off, path in sorted(rows):
              print(f"{off:#x}\t{path}")
          PY
          while IFS=$'\t' read -r off path; do
            echo "a. flash: writing $(basename "$path") at ${off}"
            "$esptool" --chip esp32c3 --port "$BENCH_ESP_PORT" write_flash "$off" "$path" < /dev/null
          done < "$plan"
          rm -f "$plan"
          echo "a. firmware flash: setup firmware written to ${BENCH_ESP_PORT}"

      - name: "3. Provision and flash board (build-setup files, then NVS last)"
        # Inputs: repo variable BENCH_BOARD_HW_ID (non-secret, <board-hw-id>); repo variable BENCH_PROVISION_DIR
        # (required, no default: the provisioning folder on the Pi, set by the owner) with
        # <hw_id>.nvs.csv and <hw_id>.label.txt, both mode 0600; the build-setup folder of the
        # firmware artifact from step 1 (flasher_args.json and the .bin files it lists).
        # Every file in flasher_args.json flash_files is written at its listed offset (none hard-coded).
        # The NVS partition is built from the CSV and written LAST, at the offset of the partition
        # named nvs in the partition table binary of the build. No offset is fixed in this file.
        # The CSV and label are never printed. The label is checked, but the flash does not use it.
        # Runs before steps c, 4, d and b. It does not read anything they write. esptool's default --after is hard_reset, so
        # the last write (NVS) ends with a board reset and the board boots the provisioned image. Steps c, d and b use that
        # boot. Step c must finish inside the bench setup window (300 s, A-138), which opens at that reset.
        # The NVS CSV is built into a 0700 temp dir, removed by the EXIT trap.
        env:
          BENCH_BOARD_HW_ID: ${{ vars.BENCH_BOARD_HW_ID }}
          BENCH_PROVISION_DIR: ${{ vars.BENCH_PROVISION_DIR }}
          BENCH_ESP_PORT: /dev/ttyACM0     # USB serial port of the ESP32-C3 on the bench Pi
        run: |
          set -euo pipefail
          umask 077
          # Pi venv with the ESP-IDF NVS tool: ~/nvs-venv (package esp-idf-nvs-partition-gen 0.3.0, installed on the Pi).
          # This step installs nothing. The pin is PROVISIONAL (ESP-IDF v5.4 constraints check open, see docs/ci-bench-runner.md).
          nvs_venv="$HOME/nvs-venv"
          nvs_pin="0.3.0"
          fail() { echo "::error::3. provisioning: $1"; exit 1; }
          hw_id="${BENCH_BOARD_HW_ID:-}"
          [ -n "$hw_id" ] || fail "not configured: nothing tested (repository variable BENCH_BOARD_HW_ID is not set)"
          [[ "$hw_id" =~ ^[A-Za-z0-9_-]+$ ]] || fail "not configured: nothing tested (BENCH_BOARD_HW_ID has characters that are not allowed)"
          prov_dir="${BENCH_PROVISION_DIR:-}"
          [ -n "$prov_dir" ] || fail "not configured: nothing tested (repository variable BENCH_PROVISION_DIR is not set; it is required and names the provisioning folder on the Pi)"
          csv="${prov_dir}/${hw_id}.nvs.csv"
          label="${prov_dir}/${hw_id}.label.txt"
          for f in "$csv" "$label"; do
            [ -f "$f" ] || fail "not configured: nothing tested (provisioning file for board ${hw_id} is missing in the provisioning folder)"
            mode="$(stat -c %a "$f")"
            [ "$mode" = "600" ] || fail "not configured: nothing tested (provisioning file for board ${hw_id} has mode ${mode}, must be 0600)"
          done
          build="${GITHUB_WORKSPACE}/bench-artifacts/firmware/build-setup"
          [ -f "${build}/flasher_args.json" ] || fail "firmware artifact not found (step 1 did not provide build-setup/flasher_args.json)"
          [ -e "$BENCH_ESP_PORT" ] || fail "not configured: nothing tested (no device at ${BENCH_ESP_PORT})"
          esptool="$(command -v esptool.py || command -v esptool || true)"
          [ -n "$esptool" ] || fail "not configured: nothing tested (esptool not installed on the runner)"
          # NVS tool: esp-idf-nvs-partition-gen, exactly ${nvs_pin} (provisional), from the Pi venv.
          # The venv bin goes first on PATH so that python3 is the venv's python. Any other version stops here.
          [ -x "${nvs_venv}/bin/python3" ] || fail "not configured: nothing tested (ESP-IDF NVS tool venv not found at ${nvs_venv})"
          export PATH="${nvs_venv}/bin:${PATH}"
          nvs_ver="$(python3 -I -c 'import importlib.metadata as m; print(m.version("esp-idf-nvs-partition-gen"))' 2>/dev/null || true)"
          if [ "$nvs_ver" != "$nvs_pin" ]; then
            fail "NVS tool version is '${nvs_ver:-not installed}', expected exactly ${nvs_pin} (pinned, provisional)"
          fi
          echo "3. provisioning: NVS tool esp-idf-nvs-partition-gen ${nvs_ver} (pinned ${nvs_pin}, provisional)"
          nvs_gen=(python3 -I -m esp_idf_nvs_partition_gen generate)
          # Pinned: esptool v5.x only. The chip-id command below is the v5 spelling.
          esptool_major="$("$esptool" version 2>&1 | sed -n -E 's/^[^0-9]*([0-9]+)\..*$/\1/p' | head -n 1 || true)"
          [ "$esptool_major" = "5" ] || fail "esptool major is '${esptool_major}', expected 5 (esptool v5.x is pinned)"
          # Read the chip id first. Stop unless it is an ESP32-C3.
          chip_out="$("$esptool" --port "$BENCH_ESP_PORT" chip-id 2>&1 || true)"
          echo "$chip_out"
          if ! grep -q "ESP32-C3" <<<"$chip_out"; then
            fail "chip is not an ESP32-C3, not flashing"
          fi
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bench-prov.XXXXXX")"
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          # Plan first, nothing is written yet. The plan comes from flasher_args.json (files and offsets)
          # and from the partition table binary of the build (offset and size of the nvs partition).
          # Python reads only the build folder, never the CSV or the label. Errors go to plan.err only.
          plan_rc=0
          python3 -I - "$build" "$work" 2>"$work/plan.err" <<'PY' || plan_rc=$?
          import json, os, struct, sys

          def err(msg):
              sys.stderr.write("ERR: " + msg + "\n")
              sys.exit(2)

          build = os.path.realpath(sys.argv[1])
          work = sys.argv[2]
          try:
              with open(os.path.join(build, "flasher_args.json"), encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, ValueError):
              err("flasher_args.json is missing or is not valid JSON")
          ff = data.get("flash_files") if isinstance(data, dict) else None
          if not isinstance(ff, dict) or not ff:
              err("flasher_args.json has no flash_files map")
          entries = []
          for off_text, rel in ff.items():
              try:
                  off = int(str(off_text), 0)
              except ValueError:
                  err("flash_files has an offset that is not a number")
              if off < 0 or not isinstance(rel, str) or not rel or os.path.isabs(rel) \
                      or ".." in rel.split("/") or "\\" in rel:
                  err("flash_files has a file path outside the build-setup folder")
              path = os.path.realpath(os.path.join(build, rel))
              if os.path.commonpath([build, path]) != build or not os.path.isfile(path) \
                      or os.path.getsize(path) == 0:
                  err("a file listed in flash_files is missing or empty in the artifact")
              entries.append((off, path))
          offsets = [o for o, _ in entries]
          if len(set(offsets)) != len(offsets):
              err("flash_files lists two files at the same offset")
          pt = [p for _, p in entries if "partition-table" in os.path.basename(p)]
          if len(pt) != 1:
              err("flash_files must list exactly one partition table file")
          raw = open(pt[0], "rb").read()
          nvs = []
          for i in range(0, len(raw) - 31, 32):
              # 32-byte entries, magic 0xAA50. Anything else (end marker 0xEBEB, erased 0xFFFF) ends the table.
              if raw[i:i + 2] != b"\xaa\x50":
                  break
              _typ, _sub, off, size, label = struct.unpack_from("<BBII16s", raw, i + 2)
              if label.split(b"\x00", 1)[0] == b"nvs":
                  nvs.append((off, size))
          if len(nvs) != 1 or nvs[0][0] == 0 or nvs[0][1] == 0:
              err("partition table has no single usable entry named nvs (no NVS offset)")
          nvs_off, nvs_size = nvs[0]
          for off, path in entries:
              if off < nvs_off + nvs_size and nvs_off < off + os.path.getsize(path):
                  err("the nvs partition overlaps a file listed in flash_files")
          with open(os.path.join(work, "flash.tsv"), "w") as f:
              for off, path in sorted(entries):
                  f.write(f"{off:#x}\t{path}\n")
          with open(os.path.join(work, "nvs.tsv"), "w") as f:
              f.write(f"{nvs_off:#x}\t{nvs_size:#x}\n")
          PY
          if [ "$plan_rc" != "0" ]; then
            msg="$(sed -n 's/^ERR: //p' "$work/plan.err" | head -n 1)"
            fail "${msg:-cannot read the flash plan from build-setup (no offsets written)}"
          fi
          read -r nvs_off nvs_size < "$work/nvs.tsv"
          echo "3. provisioning: flash plan read from build-setup: $(wc -l < "$work/flash.tsv") files, nvs at ${nvs_off}"
          cp "$csv" "$work/nvs.csv"
          chmod 600 "$work/nvs.csv"
          nvs_bin="$work/nvs.bin"
          # Tool output is kept in the temp dir and not printed: it may echo CSV lines on error.
          if ! "${nvs_gen[@]}" "$work/nvs.csv" "$nvs_bin" "$nvs_size" >"$work/nvs-gen.log" 2>&1; then
            fail "NVS partition generation failed for board ${hw_id} (tool output withheld: it may contain provisioning data)"
          fi
          [ -s "$nvs_bin" ] || fail "NVS partition generation produced no file"
          echo "3. provisioning: NVS partition built for board ${hw_id} (contents not shown)"
          # Every file from flash_files, in offset order, one write_flash call each.
          while IFS=$'\t' read -r off path; do
            echo "3. flash: writing $(basename "$path") at ${off}"
            "$esptool" --chip esp32c3 --port "$BENCH_ESP_PORT" write_flash "$off" "$path" < /dev/null
          done < "$work/flash.tsv"
          # The NVS partition is written last.
          echo "3. flash: writing nvs partition at ${nvs_off}"
          "$esptool" --chip esp32c3 --port "$BENCH_ESP_PORT" write_flash "$nvs_off" "$nvs_bin" < /dev/null
          echo "3. provisioning: build-setup files and NVS written to ${BENCH_ESP_PORT}"
          # Reset time of this step (A-139): step b waits for the setup window to close, counted from here. Not a secret.
          echo "BENCH_RESET_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: "c. BLE scan (10 s), runs before b"
        # Runs after step 3 and before step b. The bench image opens its BLE setup window on every cold start, and that window
        # is 300 s (CONFIG_PLANT_BENCH_SETUP_WINDOW_S, sdkconfig.defaults.bench-ci; A-138, was 60 s). BLE advertises only inside
        # it, so this scan must end inside it: it starts a few seconds after the reset of step 3 and takes about 15 s
        # (see docs/ci-bench-runner.md).
        # Input: bench/ble/expect.txt (first line that is neither empty nor a # comment = device name prefix).
        # Checks only that the device advertises its expected name prefix. No other check.
        run: |
          set -euo pipefail
          expect="bench/ble/expect.txt"
          if [ ! -f "$expect" ]; then
            echo "::error::c. BLE check: not configured: nothing tested (missing ${expect})"
            exit 1
          fi
          # Lines starting with # are the header comment of the file, not the expected name.
          first="$(grep -v -E '^[[:space:]]*#' "$expect" | grep -m1 -E '[^[:space:]]' || true)"
          prefix="$(printf '%s' "$first" | tr -d '[:space:]')"
          if [ -z "$prefix" ]; then
            echo "::error::c. BLE check: not configured: nothing tested (${expect} is empty)"
            exit 1
          fi
          if [ "$prefix" = "UNSET" ]; then
            echo "::error::bench/ble/expect.txt has no expected name yet: owner input needed"
            exit 1
          fi
          if ! command -v hcitool >/dev/null 2>&1; then
            echo "::error::c. BLE check: not configured: nothing tested (hcitool not installed)"
            exit 1
          fi
          log="$(mktemp)"
          names="$(mktemp)"
          # hcitool lescan prints one "<MAC> <Name>" line per advertisement ("(unknown)" when there is no name).
          # bluetoothctl did not list an NW- advertisement that hcitool sees on the bench, so the check uses hcitool.
          # The runner user needs HCI access (setcap on hcitool, or a sudo rule). A permission error fails the step below.
          # One BLE scan at a time on the bench. A second LE scan while one runs fails with
          # "Set scan parameters failed: Input/output error", so every scan takes this lock and
          # retries a few times. Nothing else on the bench may run a BLE scan (no bluetoothctl scan).
          ble_lock="/tmp/nw-ble-scan.lock"
          for attempt in 1 2 3; do
            flock -w 60 "$ble_lock" timeout 10 hcitool lescan --duplicates > "$log" 2>&1 || true
            if grep -q "^LE Scan" "$log"; then break; fi
            echo "c. BLE: scan attempt ${attempt} did not start, retrying"
            # bluez can get stuck after earlier scans: every scan then fails with "Set scan parameters failed:
            # Input/output error". Restart the bluetooth service once through the sudo rule that the Pi grants
            # to the runner user only (/etc/sudoers.d/ghrunner-bluetooth), then retry.
            if grep -q "Set scan parameters failed" "$log"; then
              sudo -n /usr/bin/systemctl restart bluetooth || echo "::warning::c. BLE: could not restart bluetooth (sudo rule missing on the Pi)"
              sleep 4
            fi
            sleep 3
          done
          if grep -q "Operation not permitted" "$log"; then
            echo "::error::c. BLE check: hcitool has no HCI permission for the runner user (setcap or sudo rule needed)"
            cat "$log"
            exit 1
          fi
          if ! grep -q "^LE Scan" "$log"; then
            echo "::error::c. BLE check: no BLE scan could start after 3 attempts (bluetooth service stuck? restart it on the Pi)"
            cat "$log"
            exit 1
          fi
          # Take only the NAME field of each device line, after the MAC. Accepted lines (any prompt
          # or text before "Device" is ignored, and so is a [NEW] or [CHG] tag):
          #   Device <MAC> <Name>
          #   [NEW] Device <MAC> <Name>
          #   [CHG] Device <MAC> Name: <name>      (the "Name: " label is dropped)
          # Every other [CHG] line (RSSI, TxPower, UUIDs, ...) is a property, not a name, and is ignored.
          # [DEL] lines are skipped: a removed device is not a seen device.
          # Written to a file first, with no grep -q after a pipe (SIGPIPE and pipefail false FAIL).
          sed -n -E 's/^[0-9A-Fa-f:]{17} (.*)$/\1/p' "$log" > "$names" || true
          # The prefix must match the START of the name field. A MAC address or any other text
          # on the line never counts. "$prefix"* is a literal prefix in a case pattern.
          found=""
          while IFS= read -r name; do
            case "$name" in
              "$prefix"*) found="$name"; break ;;
            esac
          done < "$names"
          if [ -n "$found" ]; then
            echo "c. BLE: device name '${found}' starts with prefix '${prefix}' in 10 s scan"
          else
            echo "::error::c. BLE check failed: no device with name prefix '${prefix}' in 10 s scan"
            tail -n 20 "$log"
            exit 1
          fi

      - name: "4. Install app APK on the 6P (adb)"
        # Input: the APK from step 2; secret BENCH_ANDROID_SERIAL (phone id, never printed).
        env:
          BENCH_ANDROID_SERIAL: ${{ secrets.BENCH_ANDROID_SERIAL }}
        run: |
          set -euo pipefail
          fail() { echo "::error::4. APK install: $1"; exit 1; }
          serial="${BENCH_ANDROID_SERIAL:-}"
          [ -n "$serial" ] || fail "not configured: nothing tested (secret BENCH_ANDROID_SERIAL is not set)"
          apk="${BENCH_APK_PATH:-}"
          [ -n "$apk" ] && [ -f "$apk" ] || fail "not configured: nothing tested (no APK from step 2)"
          command -v adb >/dev/null 2>&1 || fail "not configured: nothing tested (adb not installed)"
          adb start-server >/dev/null 2>&1 || true
          # Count attached devices with the configured serial in state "device". The serial is not printed.
          n="$(adb devices | awk -v s="$serial" 'NR>1 && $1==s && $2=="device" {n++} END {print n+0}')"
          [ "$n" = "1" ] || fail "expected exactly one attached device with the configured serial in state device, found ${n}"
          adb -s "$serial" install -r "$apk"
          echo "4. APK installed on the configured device (serial not shown)"

      - name: "d. App flow on phone (Appium 2.x, UiAutomator2)"
        # Inputs: bench/app/run_appium.sh; secrets BENCH_ANDROID_SERIAL (phone id) and
        # BENCH_TEST_EMAIL and BENCH_TEST_EMAIL_PASSWORD (test account). Values are never in the repo.
        # The script signs in, adds the sensor (scan, connect, Wi-Fi, name, plant details), then checks that
        # this run's plant shows a soil-moisture reading on My plants. The reading value is never read or printed.
        # Repository variable: BENCH_BOARD_HW_ID (device id, nw-<12 hex>). The script fails closed if it is missing.
        # Step d waits are fixed in the script (first reading at most 900 s, whole step at most 2400 s); timeout-minutes is the backstop.
        timeout-minutes: 45
        env:
          BENCH_ANDROID_SERIAL: ${{ secrets.BENCH_ANDROID_SERIAL }}
          BENCH_TEST_EMAIL: ${{ secrets.BENCH_TEST_EMAIL }}
          BENCH_TEST_EMAIL_PASSWORD: ${{ secrets.BENCH_TEST_EMAIL_PASSWORD }}
          BENCH_TEST_USER: ${{ secrets.BENCH_TEST_USER }}
          # PoP and Wi-Fi go to the Appium script as environment variables only. Never echo them.
          BENCH_BOARD_POP: ${{ secrets.BENCH_BOARD_POP }}
          BENCH_WIFI_SSID: ${{ secrets.BENCH_WIFI_SSID }}
          BENCH_WIFI_PASSWORD: ${{ secrets.BENCH_WIFI_PASSWORD }}
          BENCH_BOARD_HW_ID: ${{ vars.BENCH_BOARD_HW_ID }}
          APPIUM_PLATFORM_NAME: Android
          APPIUM_AUTOMATION_NAME: UiAutomator2
        run: |
          set -euo pipefail
          script="bench/app/run_appium.sh"
          if [ ! -f "$script" ]; then
            echo "::error::d. app flow: not configured: nothing tested (missing ${script})"
            exit 1
          fi
          if [ -z "${BENCH_TEST_EMAIL:-}" ]; then
            echo "::error::d. app flow: not configured: nothing tested (secret BENCH_TEST_EMAIL is not set)"
            exit 1
          fi
          if [ -z "${BENCH_TEST_EMAIL_PASSWORD:-}" ]; then
            echo "::error::d. app flow: not configured: nothing tested (secret BENCH_TEST_EMAIL_PASSWORD is not set)"
            exit 1
          fi
          if [ -z "${BENCH_ANDROID_SERIAL:-}" ]; then
            echo "::error::d. app flow: not configured: nothing tested (secret BENCH_ANDROID_SERIAL is not set)"
            exit 1
          fi
          if ! command -v appium >/dev/null 2>&1; then
            echo "::error::d. app flow: not configured: nothing tested (appium not installed)"
            exit 1
          fi
          # Appium health check (bench/app/appium_health.sh): asks <APPIUM_URL>/status up to 4 times (5 s each, about 30 s in all).
          # Fails with one clear error before any phone command runs if Appium does not answer "ready".
          bash bench/app/appium_health.sh
          # Prepare the phone for UiAutomator2: stop a stale automation server and wake the screen.
          # Without this the server can crash with "UiAutomation not connected" (seen on the bench, run 45184412853).
          adb -s "$BENCH_ANDROID_SERIAL" shell am force-stop io.appium.uiautomator2.server || true
          adb -s "$BENCH_ANDROID_SERIAL" shell am force-stop io.appium.uiautomator2.server.test || true
          adb -s "$BENCH_ANDROID_SERIAL" shell input keyevent KEYCODE_WAKEUP || true
          adb -s "$BENCH_ANDROID_SERIAL" shell input keyevent 82 || true
          sleep 3
          appium_major="$(appium --version 2>/dev/null | cut -d. -f1)"
          if [ "$appium_major" != "2" ]; then
            echo "::error::d. app flow: not configured: nothing tested (Appium 2.x required, found major '${appium_major}')"
            exit 1
          fi
          # Test start time (UTC), read by step e to find rows received after the test started.
          echo "BENCH_TEST_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          bash "$script"

      - name: "b. Serial live stream check (75 s, no reset), runs after d, after the setup window"
        # Runs after step d and before step e (A-139, owner-approved recommendation a; it was after c). No reset here: this step
        # sends no esptool run, no reset and no RTS/DTR toggle. It reads the live USB serial stream for a 75 s window and passes
        # only when the expected line appears. The content and the pass/fail rule are unchanged.
        # The line is "NWBENCH wake=", printed by the measurement loop of the bench app (main/main.c, the printf with
        # "NWBENCH wake=", about every 2 s plus sensor time).
        # The bench image never deep-sleeps (CONFIG_PLANT_BENCH_SLEEP_CYCLE is unset). The measurement loop starts only when
        # the 300 s setup window closes (main.c calls nw_setup_run before the loop, A-138), so the wake lines start about 300 s
        # after the reset of step 3. Before reading, this step waits until 310 s after that reset (BENCH_RESET_EPOCH, written by
        # step 3; the 10 s is a margin). Usually there is no wait, because steps 4 and d take longer than that. The bench upload
        # build prints one wake line per minute, so the 75 s window always holds one. No reset is added.
        # A board that prints no wake line for the whole window fails closed.
        # Inputs: bench/firmware/expect.txt (first line that is neither empty nor a # comment = expected line text).
        env:
          BENCH_ESP_PORT: /dev/ttyACM0
        run: |
          set -euo pipefail
          window=75   # seconds of live stream to read (the step timeout): one full sleep cycle
          expect="bench/firmware/expect.txt"
          if [ ! -f "$expect" ]; then
            echo "::error::b. serial check: not configured: nothing tested (missing ${expect})"
            exit 1
          fi
          # Lines starting with # are the header comment of the file, not the expected text.
          line="$(grep -v -E '^[[:space:]]*#' "$expect" | grep -m1 -E '[^[:space:]]' || true)"
          if [ -z "$line" ]; then
            echo "::error::b. serial check: not configured: nothing tested (${expect} is empty)"
            exit 1
          fi
          esptool="$(command -v esptool.py || command -v esptool || true)"
          if [ -z "$esptool" ] || [ ! -e "$BENCH_ESP_PORT" ]; then
            echo "::error::b. serial check: not configured: nothing tested (no esptool or no device at ${BENCH_ESP_PORT})"
            exit 1
          fi
          esptool_major="$("$esptool" version 2>&1 | sed -n -E 's/^[^0-9]*([0-9]+)\..*$/\1/p' | head -n 1 || true)"
          if [ "$esptool_major" != "5" ]; then
            echo "::error::b. serial check: esptool major is '${esptool_major}', expected 5 (esptool v5.x is pinned)"
            exit 1
          fi
          # A-139: the setup window must be closed before the wake lines start. Step 3 recorded the reset time.
          reset_epoch="${BENCH_RESET_EPOCH:-}"
          if ! [[ "$reset_epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::b. serial check: reset time of step 3 not recorded, nothing tested"
            exit 1
          fi
          ready_epoch=$(( reset_epoch + 310 ))   # 300 s setup window (sdkconfig.defaults.bench-ci) plus a 10 s margin
          now_epoch="$(date +%s)"
          if [ "$now_epoch" -lt "$ready_epoch" ]; then
            echo "b. serial: waiting $(( ready_epoch - now_epoch )) s until the setup window has closed (no reset sent)"
            sleep $(( ready_epoch - now_epoch ))
          fi
          log="$(mktemp)"
          stty -F "$BENCH_ESP_PORT" 115200 raw -echo
          # Read the live stream for the window. timeout exits 124 when the window ends (the expected end);
          # any other non-zero exit means the read itself failed.
          rc=0
          timeout "$window" cat "$BENCH_ESP_PORT" > "$log" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::b. serial check failed: could not read ${BENCH_ESP_PORT} (cat exit ${rc}), nothing tested"
            exit 1
          fi
          if grep -F -q -- "$line" "$log"; then
            echo "b. serial: expected line seen in the live stream: ${line}"
          else
            echo "::error::b. serial check failed: timeout, expected line not seen in ${window} s of live stream (no reset sent): ${line}"
            tail -n 20 "$log"
            exit 1
          fi

      - name: "e. Cloud check (EU project, communication only)"
        # Input: bench/cloud/check.sh; secret BENCH_CLOUD_CHECK_CONFIG (config for the EU project).
        # Scope: checks only that the device communicated with the cloud, i.e. at least one row
        # from this device exists in the EU project and was received after BENCH_TEST_START_UTC
        # (set by step d). It must not read, print or compare any reading value.
        # Wait: repository variable BENCH_FIRST_READING_WAIT_S (60 to 3600 seconds, no default). The step sleeps that long
        # before its one read, so the first upload of the 1-minute bench build can reach the cloud. Missing or out of range fails.
        # Range reason: 60 s is the shortest wait that covers one upload cycle of the 1-minute build; 3600 s is the ceiling,
        # the whole bench job timeout (timeout-minutes 60), so no wait can run past the job.
        # LIMIT: 60 to 3600 s is the allowed range, but the wait is NOT the whole job budget. The job timeout is timeout-minutes 60
        # (3600 s, counted from the job start), and steps 1 to d and b run before this step (b may wait for the setup window, A-139). The step fails closed, before sleeping, when
        # elapsed-since-job-start + wait + 900 s reserve (for bench/cloud/check.sh and Bench E2E, which run after the wait)
        # would exceed 3600 s. A longer wait needs the owner to set a longer timeout-minutes on the bench job.
        env:
          BENCH_CLOUD_CHECK_CONFIG: ${{ secrets.BENCH_CLOUD_CHECK_CONFIG }}
          # Device identity (the board's hw_id, nw-<12 hex>), a repository variable (name only here).
          BENCH_BOARD_HW_ID: ${{ vars.BENCH_BOARD_HW_ID }}
          BENCH_FIRST_READING_WAIT_S: ${{ vars.BENCH_FIRST_READING_WAIT_S }}
        run: |
          set -euo pipefail
          script="bench/cloud/check.sh"
          if [ ! -f "$script" ]; then
            echo "::error::e. cloud check: not configured: nothing tested (missing ${script})"
            exit 1
          fi
          if [ -z "${BENCH_CLOUD_CHECK_CONFIG:-}" ]; then
            echo "::error::e. cloud check: not configured: nothing tested (secret BENCH_CLOUD_CHECK_CONFIG is not set)"
            exit 1
          fi
          if [ -z "${BENCH_TEST_START_UTC:-}" ]; then
            echo "::error::e. cloud check: not configured: nothing tested (test start time not set by step d)"
            exit 1
          fi
          wait_s="${BENCH_FIRST_READING_WAIT_S:-}"
          if [ -z "$wait_s" ]; then
            echo "::error::e. cloud check: not configured: nothing tested (repository variable BENCH_FIRST_READING_WAIT_S is not set; set it to 60 to 3600 seconds, there is no default)"
            exit 1
          fi
          if ! [[ "$wait_s" =~ ^[0-9]{2,4}$ ]] || [ "$wait_s" -lt 60 ] || [ "$wait_s" -gt 3600 ]; then
            echo "::error::e. cloud check: BENCH_FIRST_READING_WAIT_S must be a whole number of seconds from 60 to 3600 (out of range or not a number; value not printed)"
            exit 1
          fi
          # Job budget check (fail closed, nothing slept if it does not fit). 3600 = timeout-minutes 60 of the bench job.
          # 900 = reserve for check.sh and Bench E2E after the wait (an assumption, not measured; the owner may tune it).
          job_budget_s=3600
          reserve_s=900
          start="${BENCH_JOB_START_EPOCH:-}"
          if ! [[ "$start" =~ ^[0-9]+$ ]]; then
            echo "::error::e. cloud check: job start time not recorded (first step of the job); nothing tested"
            exit 1
          fi
          elapsed_s=$(( $(date +%s) - start ))
          max_wait_s=$(( job_budget_s - elapsed_s - reserve_s ))
          if [ "$wait_s" -gt "$max_wait_s" ]; then
            echo "::error::e. cloud check: wait of ${wait_s} s does not fit the 60 min job timeout: ${elapsed_s} s already used, ${reserve_s} s reserved for the check and E2E, so the largest wait now is ${max_wait_s} s. Nothing tested. Lower BENCH_FIRST_READING_WAIT_S, or the owner sets a longer timeout-minutes on the bench job."
            exit 1
          fi
          echo "e. cloud check: waiting ${wait_s} s for the first reading (BENCH_FIRST_READING_WAIT_S); largest wait that fits now is ${max_wait_s} s"
          # This sleep is NOT redundant with step d: step d does not read BENCH_FIRST_READING_WAIT_S, so this is the only wait.
          sleep "$wait_s"
          bash "$script"

      - name: Bench E2E
        run: |
          if [ -f bench/run_e2e.sh ]; then
            bash bench/run_e2e.sh
          else
            echo "::error::bench E2E not configured: nothing tested"
            exit 1
          fi
