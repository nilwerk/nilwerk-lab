# Pinned action: espressif/esp-idf-ci-action in the firmware job's "setup flow" step is pinned to a full commit SHA
# (every other ESP-IDF step in this file uses @v1). To bump that pin: take the SHA from the head of the action's
# `v1` branch with `git ls-remote https://github.com/espressif/esp-idf-ci-action refs/heads/v1`, put it in the `uses:` line and
# keep the trailing comment naming the branch (`# v1`). Do not use the tag v1.2.0: it is a different commit.
# The firmware owner re-checks the pin in every PR that changes it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  P: projects/plant-monitor

jobs:
  detect:
    name: Detect workstreams
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.d.outputs.firmware }}
      firmwaresim: ${{ steps.d.outputs.firmwaresim }}
      app: ${{ steps.d.outputs.app }}
      cloud: ${{ steps.d.outputs.cloud }}
      clouddb: ${{ steps.d.outputs.clouddb }}
      cloudmut: ${{ steps.d.outputs.cloudmut }}
      ml: ${{ steps.d.outputs.ml }}
      pcb: ${{ steps.d.outputs.pcb }}
      sim: ${{ steps.d.outputs.sim }}
      mechanical: ${{ steps.d.outputs.mechanical }}
      interfaces: ${{ steps.d.outputs.interfaces }}
      powerbudget: ${{ steps.d.outputs.powerbudget }}
      costs: ${{ steps.d.outputs.costs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PRs diff against the base commit
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Change check: only on pull_request. Push to main / manual runs treat everything as changed.
          CHANGED=""
          ALL=true
          if [ "$EVENT" = "pull_request" ]; then
            ALL=false
            CHANGED="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
            echo "Changed files:"; echo "$CHANGED"
            # Shared build config: the workflow files and tool-version files re-test every workstream.
            if echo "$CHANGED" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/workflows/cloud-mutation\.yml|\.github/actions/|\.tool-versions$)'; then ALL=true; echo "Shared build config changed: running all workstreams"; fi
          fi
          # touched <name> <path-prefix...> -> true if running everything or a changed file is under a prefix
          touched() { [ "$ALL" = true ] && return 0; shift; for pre in "$@"; do echo "$CHANGED" | grep -q "^$pre" && return 0; done; return 1; }
          # gate <name> <exists-cmd> <path-prefix...>: output true only if project exists AND (not a PR OR files changed)
          gate() {
            n="$1"; cmd="$2"; shift 2
            if eval "$cmd" >/dev/null 2>&1 && touched "$n" "$@"; then echo "$n=true" >> "$GITHUB_OUTPUT"
            elif eval "$cmd" >/dev/null 2>&1; then echo "$n=false" >> "$GITHUB_OUTPUT"; echo "::notice::$n skipped: no changes under $*"
            else echo "$n=false" >> "$GITHUB_OUTPUT"; fi
          }
          # Contracts and decisions (docs/interfaces, docs/adr) also re-test their consumers.
          CT="$P/docs/interfaces/ $P/docs/adr/"
          # v1/ too: v1/WIRING.md (pin table) is checked against board.h by a firmware host test (check_board_v1.py).
          gate firmware "test -f $P/firmware/CMakeLists.txt" "$P/firmware/" "$P/v1/" $CT
          # firmwaresim = QEMU boot check (job firmware-sim). Narrower than firmware: only files under firmware/. Push to main also turns it on
          # (ALL), so main warms the ESP-IDF/QEMU cache that PR runs restore.
          gate firmwaresim "test -f $P/firmware/CMakeLists.txt" "$P/firmware/"
          gate app "test -f $P/app/package.json" "$P/app/" $CT
          # cloud = Deno lint/typecheck of the Supabase edge functions (they are Deno code, there is no cloud/package.json and must not be one).
          # Their tests run in cloud-db (Node 22 + Postgres), see the comment there.
          gate cloud "find $P/cloud/supabase/functions -name index.ts 2>/dev/null | grep -q ." "$P/cloud/" $CT
          gate clouddb "test -f $P/cloud/test.sh" "$P/cloud/" $CT
          # cloudmut = the ~15 min mutation suites (cloud-mutation.yml). Narrower than clouddb on purpose: only files under cloud/ (not contract docs)
          # trigger it on a PR. ALL (ci.yml / tool versions changed, manual run) still turns it on. Push to main skips it, see the job's `if`.
          gate cloudmut "test -f $P/cloud/test/mutation.sh" "$P/cloud/"
          gate ml "find $P/ml -name '*.py' 2>/dev/null | grep -q ." "$P/ml/"
          gate pcb "ls $P/pcb/*.kicad_pro" "$P/pcb/"
          # sim = ngspice netlists (.cir/.sp), a run_all.sh, or a Python check script that drives ngspice (ldo_dropout.py)
          gate sim "find $P/pcb/sim \\( -name '*.cir' -o -name '*.sp' -o -name '*.py' -o -name run_all.sh \\) 2>/dev/null | grep -q ." "$P/pcb/"
          gate mechanical "ls $P/mechanical/*.py" "$P/mechanical/"
          gate interfaces "find $P/docs/interfaces \\( -name '*.json' -o -name '*.yaml' -o -name '*.yml' \\) 2>/dev/null | grep -q ." "$P/docs/interfaces/"
          gate powerbudget "find $P/hardware/power-budget -name '*.py' 2>/dev/null | grep -q ." "$P/hardware/power-budget/"
          gate costs "find $P/docs/costs -name 'test_*.py' 2>/dev/null | grep -q ." "$P/docs/costs/"
          cat "$GITHUB_OUTPUT"

  firmware:
    needs: detect
    if: needs.detect.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build (esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: projects/plant-monitor/firmware
          command: idf.py build && idf.py size
      - name: ESP-IDF build (esp32c3, v1 perfboard defaults = PLANT_BOARD_V1_SUPERMINI)
        # Separate build dir and sdkconfig: SDKCONFIG_DEFAULTS only seeds a NEW sdkconfig, so reusing build/sdkconfig would
        # silently build the devkit option again. The grep proves the v1 board option really was selected.
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: projects/plant-monitor/firmware
          command: idf.py -B build-v1 -DIDF_TARGET=esp32c3 -DSDKCONFIG=sdkconfig.v1 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.v1" build size && grep -q '^CONFIG_PLANT_BOARD_V1_SUPERMINI=y' sdkconfig.v1
      - name: ESP-IDF build (esp32c3, hourly upload = CONFIG_PLANT_UPLOAD, compiles only)
        # Third build, own dir and sdkconfig (see above). Compiles the 4.F3 slice 3 adapter (nw_upload_idf.c), which is off in the two builds above.
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: projects/plant-monitor/firmware
          command: idf.py -B build-upload -DIDF_TARGET=esp32c3 -DSDKCONFIG=sdkconfig.upload -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.upload" build size && grep -q '^CONFIG_PLANT_UPLOAD=y' sdkconfig.upload
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: projects/plant-monitor/firmware/build/*.bin
          if-no-files-found: warn
      - name: ESP-IDF build (esp32c3, setup flow on, simulator off)
        # Fork PRs skip this step and the two after it (flash-file check, upload): setup packages are built and published for PRs from this repository only.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # Requirements traceability (checked against projects/plant-monitor/tests/acceptance-matrix.md): FR-D03 (BLE setup
        # mode, line 20) and NFR-06 (security, line 53). This build step does not pass either one; it only proves the
        # setup-flow image compiles and carries the setup-flow config.
        # Pinned SHA (see the header of this file). Separate build dir and settings file, so no stale sdkconfig is reused.
        # set -e first: the first failing line fails the step, so the upload below does not run on a bad build.
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: projects/plant-monitor/firmware
          command: |
            set -e
            rm -f sdkconfig.setup
            idf.py -B build-setup -DIDF_TARGET=esp32c3 -DSDKCONFIG=sdkconfig.setup -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.v1;sdkconfig.defaults.setup;sdkconfig.defaults.bench-ci" build size
            grep -q "^CONFIG_PLANT_SETUP_FLOW=y" sdkconfig.setup
            grep -q "^CONFIG_PLANT_BOARD_V1_SUPERMINI=y" sdkconfig.setup
            grep -q "^CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig.setup
            if grep -q "^CONFIG_PLANT_SIM_MOCK_SENSORS=y" sdkconfig.setup; then echo "simulated sensors must be off"; exit 1; fi
            # Bench CI image stays awake on USB: bench sleep cycle must be unset (sdkconfig.defaults.bench-ci, last in the list).
            # Double quotes only in this block: the action wraps the whole command in single quotes, so a single quote here ends that wrapper early.
            if grep -q "^CONFIG_PLANT_BENCH_SLEEP_CYCLE=y" sdkconfig.setup; then echo "bench sleep cycle must be unset in the setup image (sdkconfig.defaults.bench-ci)"; exit 1; fi
            grep -qxF "# CONFIG_PLANT_BENCH_SLEEP_CYCLE is not set" sdkconfig.setup || { echo "sdkconfig.setup lacks the line: # CONFIG_PLANT_BENCH_SLEEP_CYCLE is not set (bench-ci overlay not applied)"; exit 1; }
            # Bench CI image: BLE setup window on every cold start without BOOT (sdkconfig.defaults.bench-ci). Double quotes only.
            grep -q "^CONFIG_PLANT_BENCH_AUTO_SETUP=y" sdkconfig.setup || { echo "sdkconfig.setup lacks CONFIG_PLANT_BENCH_AUTO_SETUP=y (bench-ci overlay not applied)"; exit 1; }
            grep -q "^CONFIG_PLANT_BENCH_SETUP_WINDOW_S=60" sdkconfig.setup || { echo "sdkconfig.setup lacks CONFIG_PLANT_BENCH_SETUP_WINDOW_S=60 (bench-ci overlay not applied)"; exit 1; }
            test -s build-setup/plant_monitor.bin
      - name: Check every flash file named in flasher_args.json
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # The artifact holds every file esptool flashes (bootloader, partition table, app). The list comes from
        # flasher_args.json, so a missing or empty file, or an unsafe path, fails this step before the upload.
        id: files
        working-directory: projects/plant-monitor/firmware/build-setup
        shell: bash
        run: |
          set -euo pipefail
          test -s flasher_args.json
          files=$(jq -r '.flash_files[]' flasher_args.json)
          test -n "$files"
          for f in $files; do
            case "$f" in
              /*|*..*) echo "unsafe path in flasher_args.json: $f"; exit 1 ;;
            esac
            test -s "$f" || { echo "missing or empty flash file named in flasher_args.json: $f"; exit 1; }
          done
          {
            echo "paths<<PATHS_EOF"
            echo "projects/plant-monitor/firmware/build-setup/flasher_args.json"
            for f in $files; do echo "projects/plant-monitor/firmware/build-setup/$f"; done
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Flash files verified:"
          echo "$files"
      - name: Upload setup firmware artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: plant-monitor-firmware-setup
          # Exactly the flash files named in flasher_args.json, plus that file. No sdkconfig, no logs, no NVS files
          # (NVS is written per unit at the bench, not built here).
          path: ${{ steps.files.outputs.paths }}
          if-no-files-found: error
      - name: Host unit tests
        working-directory: projects/plant-monitor/firmware
        run: |
          if [ -f test/host/CMakeLists.txt ]; then
            cmake -S test/host -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
          else
            echo "No host tests yet (test/host/)."
          fi

  firmware-sim:
    name: firmware simulator boot check (QEMU, mocked sensors)
    # Runs on a PR that changes projects/plant-monitor/firmware and on every push to main (see the detect gate firmwaresim).
    # Simulator only: the boot check in tests/qemu_boot_check.sh. Not a hardware test.
    needs: detect
    if: needs.detect.outputs.firmwaresim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IDF_VERSION: v5.4
      QEMU_VERSION: "9.0.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Host packages (ESP-IDF prerequisites, libslirp0 and libsdl2-2.0-0 for QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-venv python3-pip cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 libslirp0 libsdl2-2.0-0
      # The cache holds the ESP-IDF source tree and ~/.espressif (toolchains, Python env, QEMU). Key = IDF version + QEMU version + OS.
      # A PR can restore a cache saved on main; a cache saved on a PR branch is visible only to that branch.
      - name: Restore ESP-IDF and QEMU cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.espressif
            ~/esp/esp-idf
          key: idf-v5.4-qemu-9.0.0-${{ runner.os }}
      - name: Install ESP-IDF v5.4 (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/esp"
          git clone --depth 1 --branch "$IDF_VERSION" --shallow-submodules --recursive https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          "$HOME/esp/esp-idf/install.sh" esp32c3
      - name: Install QEMU via idf_tools.py (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export IDF_PATH="$HOME/esp/esp-idf"
          . "$IDF_PATH/export.sh" >/dev/null
          python "$IDF_PATH/tools/idf_tools.py" install qemu-riscv32
      - name: Check toolchain versions (every run, cache hit or miss)
        run: |
          export IDF_PATH="$HOME/esp/esp-idf"
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py --version > idf_version.txt; cat idf_version.txt
          grep -q "ESP-IDF v5\.4" idf_version.txt || { echo "::error::ESP-IDF is not ${IDF_VERSION}"; exit 1; }
          qemu-system-riscv32 --version | head -1
          qemu-system-riscv32 --version | grep -q "version ${QEMU_VERSION}" || { echo "::error::qemu-system-riscv32 is not ${QEMU_VERSION}"; exit 1; }
      - name: Simulator boot check (scenario 1)
        id: boot
        working-directory: projects/plant-monitor/firmware
        shell: bash
        run: |
          export IDF_PATH="$HOME/esp/esp-idf"
          . "$IDF_PATH/export.sh" >/dev/null
          set +e
          bash tests/qemu_boot_check.sh --log "$RUNNER_TEMP/qemu_boot.log" > "$RUNNER_TEMP/boot_check.txt" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/boot_rc"
          cat "$RUNNER_TEMP/boot_check.txt"
          exit "$rc"
      # Runs even when an earlier step failed: every scenario gets PASS, FAIL or NOT RUN. Scenarios 2 to 4 have no harness yet.
      - name: Scenario summary
        if: always()
        shell: bash
        env:
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
        run: |
          rc="$(cat "$RUNNER_TEMP/boot_rc" 2>/dev/null || echo none)"
          case "$BOOT_OUTCOME" in
            success) s1="PASS"; note="all checks in tests/qemu_boot_check.sh passed" ;;
            failure)
              s1="FAIL"
              case "$rc" in
                1) note="a boot or sensor check failed (see the lines below)" ;;
                2) note="setup or build problem, not a firmware verdict" ;;
                *) note="script exit code: $rc" ;;
              esac ;;
            *) s1="NOT RUN"; note="the boot check did not start (an earlier step failed)" ;;
          esac
          {
            echo "## Firmware simulator: scenario results"
            echo "Simulator only (QEMU ESP32-C3, mocked sensors). Not hardware. ESP-IDF ${IDF_VERSION}, QEMU ${QEMU_VERSION}."
            echo ""
            echo "| # | Scenario | Result | Note |"
            echo "|---|---|---|---|"
            echo "| 1 | Boot to app_main, five readings, mock decode, sleep call (tests/qemu_boot_check.sh) | $s1 | $note |"
            echo "| 2 | Missing security-2 data in NVS: BLE must stay off | NOT RUN | no simulator harness yet |"
            echo "| 3 | Failed boot decision (NWSETUP boot decision failed) | NOT RUN | no simulator harness yet |"
            echo "| 4 | Five resets | NOT RUN | no simulator harness yet |"
            echo ""
            if [ -f "$RUNNER_TEMP/boot_check.txt" ]; then
              echo "<details><summary>Scenario 1 check lines</summary>"
              echo ""
              echo '```'
              grep -E '^(PASS|FAIL|RESULT|NOTE|SETUP)' "$RUNNER_TEMP/boot_check.txt" || true
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  app:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/plant-monitor/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test --if-present -- --ci

  cloud:
    name: cloud edge functions (Deno lint + typecheck)
    needs: detect
    if: needs.detect.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    # The edge functions are Deno code (supabase/functions, npm: specifiers, .ts imports). There is no cloud/package.json.
    # Only static checks live here. The edge-function TESTS stay in the cloud-db job: they are node:test files
    # (Node 22 type stripping) that need the migrated Postgres, so they cannot run under plain `deno test` without a rewrite.
    defaults:
      run:
        working-directory: projects/plant-monitor/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.4"          # the version this was verified with
      - run: deno lint supabase/functions
      # Care-tips engine (4.B3): plain TypeScript with no I/O, not under supabase/functions. Lint covers the sources AND all tips test files
      # (the require-await and no-explicit-any findings in the tests were fixed in code, no rule is silenced or skipped).
      - run: deno lint tips/*.ts tips/test/*.test.ts
      - name: Typecheck entry points and the test files
        run: deno check supabase/functions/*/index.ts test/functions/api.test.ts test/functions/export.test.ts test/functions/mcp.test.ts tips/*.ts tips/test/*.test.ts

  cloud-db:
    name: cloud DB tests
    needs: detect
    if: needs.detect.outputs.clouddb == 'true'
    runs-on: ubuntu-latest
    # Not gated on cloud/package.json (there is none): test.sh needs only Postgres + psql (migrations, RLS, retention, 2.4 contract test)
    # and runs the edge-function tests (test/functions/api.test.ts) with Node 22 type stripping. Deno lint/typecheck is the `cloud` job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/postgres   # superuser; test.sh creates/drops nw_test_* databases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4      # edge function tests run TypeScript natively (Node >= 22.6)
        with:
          node-version: 22
      - run: pip install pyyaml          # cloud/test/openapi_check.py
      - name: Cloud DB tests (projects/plant-monitor/cloud/test.sh)
        run: bash projects/plant-monitor/cloud/test.sh

  cloud-mutation:
    name: cloud mutation suite (full)
    needs: detect
    # Runs on a pull_request that changes cloud/ (or the shared build config) and on a manual CI run; NOT on push to main (the PR already ran it,
    # the nightly schedule in cloud-mutation.yml covers drift). Docs-only PRs: detect says cloudmut=false, so this job is skipped and costs nothing.
    if: needs.detect.outputs.cloudmut == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/cloud-mutation.yml
    secrets: inherit   # pass CI_POSTGRES_PASSWORD into the reusable workflow (A-114)

  ml:
    needs: detect
    if: needs.detect.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/plant-monitor/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        if: hashFiles('projects/plant-monitor/ml/requirements.txt') != ''
      - run: pip install pytest && pytest -q
      - name: Model budget check
        run: |
          for m in $(ls models/*.tflite 2>/dev/null); do
            s=$(stat -c%s "$m"); echo "$m: $s bytes"; [ "$s" -le 30720 ] || { echo "::error::$m exceeds 30 KB budget (FR-E04)"; exit 1; }
          done

  pcb:
    needs: detect
    if: needs.detect.outputs.pcb == 'true'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      # The kicad image runs as a non-root user (uid 1000) that cannot write the runner's
      # /__w/_temp files, so actions/checkout fails with EACCES. Run as root instead.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Layout checks (antenna keep-out, antenna-to-cell distance, via-in-pad; check_layout.py exits 1 on any FAIL)
        working-directory: projects/plant-monitor/pcb
        shell: bash
        run: |
          set -e
          [ -f plant-monitor.kicad_pcb ] || { echo "No .kicad_pcb yet: layout checks skipped"; exit 0; }
          python3 -I check_layout.py
      - name: ERC / DRC and fabrication exports
        working-directory: projects/plant-monitor/pcb
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          mkdir -p out
          # A project file exists (detect gate), so a schematic must too: fail loudly instead of skipping ERC.
          ls *.kicad_sch >/dev/null || { echo "::error::no .kicad_sch next to the .kicad_pro, ERC cannot run"; exit 1; }
          [ -n "$(echo *.kicad_pcb)" ] || echo "No .kicad_pcb yet: DRC and board exports skipped (ERC and schematic exports still run)."
          for s in *.kicad_sch; do kicad-cli sch erc --severity-error --exit-code-violations -o out/erc.rpt "$s" || { cat out/erc.rpt; exit 1; }; break; done
          for b in *.kicad_pcb; do
            kicad-cli pcb drc --severity-error --exit-code-violations -o out/drc.rpt "$b" || { cat out/drc.rpt; exit 1; }
            kicad-cli pcb export gerbers -o out/gerbers/ "$b"
            kicad-cli pcb export drill -o out/gerbers/ "$b"
            kicad-cli pcb export pos --format csv --units mm -o out/cpl.csv "$b"
            kicad-cli pcb export step -o out/board.step "$b" || true
          done
          for s in *.kicad_sch; do kicad-cli sch export pdf -o out/schematic.pdf "$s"; kicad-cli sch export bom -o out/bom.csv "$s"; break; done
      - uses: actions/upload-artifact@v4
        if: always()   # keep erc.rpt / drc.rpt when ERC or DRC fails
        with:
          name: pcb-fab
          path: projects/plant-monitor/pcb/out

  sim:
    needs: detect
    if: needs.detect.outputs.sim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install matplotlib      # optional: only for the plot artifact, the checks do not need it
      - name: Run simulations (the exit code of each check script is the test)
        working-directory: projects/plant-monitor/pcb/sim
        shell: bash                        # explicit bash = -eo pipefail, so `| tee` cannot hide a failing script
        run: |
          mkdir -p out
          ran=0
          if [ -f run_all.sh ]; then
            bash run_all.sh; ran=1
          else
            for c in *.cir *.sp; do
              if [ -f "$c" ]; then echo "== ngspice -b $c"; ngspice -b "$c"; ran=1; fi
            done
            for p in *.py; do
              if [ -f "$p" ]; then echo "== python3 -I $p"; python3 -I "$p" | tee "out/${p%.py}.log"; ran=1; fi   # exit code of the script fails the step
            done
          fi
          [ "$ran" = 1 ] || { echo "::error::sim gate matched but nothing ran"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-results
          path: |
            projects/plant-monitor/pcb/sim/out
            projects/plant-monitor/pcb/sim/*.png
          if-no-files-found: ignore

  mechanical:
    needs: detect
    if: needs.detect.outputs.mechanical == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/plant-monitor/mechanical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cadquery trimesh pytest
      - name: Regenerate models
        run: |
          if [ -f build.py ]; then python build.py; else echo "No build.py yet."; fi
      - name: Geometry checks
        run: |
          if ls test_*.py >/dev/null 2>&1; then pytest -q; else echo "No geometry tests yet."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: enclosure
          path: projects/plant-monitor/mechanical/out
          if-no-files-found: ignore

  interfaces:
    needs: detect
    if: needs.detect.outputs.interfaces == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema pyyaml
      - name: Validate schemas and fixtures
        working-directory: projects/plant-monitor/docs/interfaces
        run: |
          python - <<'PY'
          import json, glob, sys, os
          from jsonschema import Draft202012Validator
          ok = True
          for f in glob.glob("*.schema.json"):
              schema = json.load(open(f)); Draft202012Validator.check_schema(schema)
              print("schema ok:", f)
              base = f[:-len(".schema.json")]
              for fx in glob.glob(f"fixtures/{base}*.json"):
                  errs = list(Draft202012Validator(schema).iter_errors(json.load(open(fx))))
                  print(("FAIL " if errs else "ok   ") + fx)
                  for e in errs: print("   ", e.message)
                  ok &= not errs
          # Every JSON / YAML contract must at least parse (openapi.yaml, mcp-tools.json, ...)
          import yaml
          for f in sorted(glob.glob("**/*.json", recursive=True)):
              try: json.load(open(f)); print("json ok:", f)
              except Exception as e: print("FAIL json", f, e); ok = False
          for f in sorted(glob.glob("**/*.y*ml", recursive=True)):
              try: yaml.safe_load(open(f)); print("yaml ok:", f)
              except Exception as e: print("FAIL yaml", f, e); ok = False
          sys.exit(0 if ok else 1)
          PY

  powerbudget:
    name: power-budget tests
    needs: detect
    if: needs.detect.outputs.powerbudget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unittest
        working-directory: projects/plant-monitor/hardware/power-budget
        run: python -m unittest discover -v

  costs:
    name: cost-model tests
    needs: detect
    if: needs.detect.outputs.costs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unittest
        working-directory: projects/plant-monitor/docs/costs
        run: python -m unittest discover -v

  summary:
    name: Final status
    needs: [detect, firmware, firmware-sim, app, cloud, cloud-db, cloud-mutation, ml, pcb, sim, mechanical, interfaces, powerbudget, costs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        run: |
          {
            echo "## Pipeline status"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| detect | ${{ needs.detect.result }} |"
            echo "| firmware | ${{ needs.firmware.result }} |"
            echo "| firmware-sim | ${{ needs.firmware-sim.result }} |"
            echo "| app | ${{ needs.app.result }} |"
            echo "| cloud | ${{ needs.cloud.result }} |"
            echo "| cloud-db | ${{ needs.cloud-db.result }} |"
            echo "| cloud-mutation | ${{ needs.cloud-mutation.result }} |"
            echo "| ml | ${{ needs.ml.result }} |"
            echo "| pcb | ${{ needs.pcb.result }} |"
            echo "| sim | ${{ needs.sim.result }} |"
            echo "| mechanical | ${{ needs.mechanical.result }} |"
            echo "| interfaces | ${{ needs.interfaces.result }} |"
            echo "| powerbudget | ${{ needs.powerbudget.result }} |"
            echo "| costs | ${{ needs.costs.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Detect must succeed: if it fails, every job is skipped and that must not look green.
          [ "${{ needs.detect.result }}" = "success" ] || { echo "Pipeline RED: Detect ${{ needs.detect.result }}"; exit 1; }
          for r in "${{ needs.firmware.result }}" "${{ needs.firmware-sim.result }}" "${{ needs.app.result }}" "${{ needs.cloud.result }}" "${{ needs.cloud-db.result }}" "${{ needs.cloud-mutation.result }}" "${{ needs.ml.result }}" "${{ needs.pcb.result }}" "${{ needs.sim.result }}" "${{ needs.mechanical.result }}" "${{ needs.interfaces.result }}" "${{ needs.powerbudget.result }}" "${{ needs.costs.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then echo "Pipeline RED"; exit 1; fi
          done
          echo "Pipeline GREEN (skipped = workstream not started yet)"
