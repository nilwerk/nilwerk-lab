# Plant Monitor cloud backend - Supabase local config (task 4.B1).
# Local development only: `supabase start` runs everything in Docker, no account, no cost.
# Production = ONE free Supabase project in an EU region (A-025 zero-cost rule, NFR-07 EU data residency),
# e.g. Frankfurt (eu-central-1). Creating it is Arsany's click, not an agent's; see ../README.md.
# No secrets here. Secret NAMES (A-035, new Supabase key model): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY (fallback: SUPABASE_SERVICE_ROLE_KEY / SUPABASE_ANON_KEY, see _shared/env.ts)
# (GitHub/Supabase secrets, read from the environment only, never committed).
project_id = "plant-monitor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15   # schema needs PG15+ (security_invoker views)

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true
jwt_expiry = 3600
[auth.email]
enable_confirmations = false   # local only

[storage]
enabled = true
file_size_limit = "10MiB"      # plant photos (FR-A05) are compressed client-side

[studio]
enabled = true
port = 54323

# Edge functions (4.B2). The device endpoints authenticate with their own bearer tokens (ADR-004), not a Supabase JWT, so the
# platform JWT check is off for all three; claim-token verifies the user JWT itself (auth.getUser) in the function.
[functions.ingest]
verify_jwt = false
[functions.device-claim]
verify_jwt = false
[functions.claim-token]
verify_jwt = false
[functions.delete-account]
verify_jwt = false   # 4.B2b DELETE /account: the function verifies the user JWT itself (auth.getUser), FR-A01, NFR-07
[functions.export]
verify_jwt = false   # 4.B2c GET /export: the function verifies the user JWT itself (auth.getUser), NFR-07, FR-A01
[functions.mcp]
verify_jwt = false   # 4.B5 MCP server: the bearer is the user's API key (nwk_...), checked in the function against api_keys (FR-P03, NFR-06)
[functions.analytics]
verify_jwt = false   # 4.B4 GET /analytics: the function verifies the user JWT itself (getUser) and runs every query as the user (FR-P04, FR-P01, NFR-06)
