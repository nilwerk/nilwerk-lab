openapi: 3.1.0
info:
  title: Plant Monitor cloud API (Supabase Edge Functions)
  version: 0.1.0-draft
  description: |
    Task 2.4 contract for the edge functions in architecture.md (C-05). Direct table access by the app
    (supabase-js under RLS) is specified in db-schema.sql, not here. Tips and analytics endpoints
    (FR-P01, FR-P02) are contracts of 4.B3/4.B4 and are not part of this draft.
    Every operation cites its requirements in `x-requirements`.
    Status: DRAFT; not validated against a live Supabase project.
    Implemented in task 4.B2 (projects/plant-monitor/cloud/supabase/functions/, checked against this file by cloud/test/openapi_check.py):
    /claim-token, /device-claim, /ingest; task 4.B2b adds DELETE /account (edge function `delete-account`). Differences from the draft that are NOT built yet are marked "[not in 4.B2]" below.
    All other paths are still contract only.
servers:
  - url: https://{project_ref}.supabase.co/functions/v1
    variables: { project_ref: { default: TBD-set-in-4.B1 } }
tags:
  - { name: device, description: "Called by the sensor (device bearer token or claim token)" }
  - { name: app, description: "Called by the phone app (user JWT)" }
paths:
  /claim-token:
    post:
      tags: [app]
      summary: Issue a one-time claim token bound to the signed-in user
      x-requirements: [FR-D03, FR-A03, FR-A02, NFR-06]
      description: |
        The app calls this before BLE setup and sends the token to the sensor inside the encrypted BLE
        channel (ble-provisioning.md, endpoint nw-claim). Token: 16 random bytes, base64url, valid 15 min,
        single use; only its SHA-256 is stored. No cap on tokens or devices per user (FR-A02), but at most
        10 open tokens per user.
      security: [{ userJwt: [] }]
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [claim_token, expires_at]
                properties:
                  claim_token: { type: string, example: "k3J9...redacted" }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { description: "error: rate_limited (10 open tokens); Retry-After: 900", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/Internal" }
  /device-claim:
    post:
      tags: [device]
      summary: First call of a new or reset sensor; binds it to the user and returns its device token
      x-requirements: [FR-D03, FR-A03, FR-A08, NFR-06]
      description: |
        Sent once over HTTPS right after the sensor joined Wi-Fi (TLS 1.2+, pinned CA). Rules:
        - claim token valid, unexpired, unused -> device row created or updated, token marked used.
        - hw_id unknown -> device created (owner = token user).
        - hw_id known and unowned (released, FR-A08) -> new owner, any old credential revoked, and the previous plant link (`devices.plant_id`) is cleared (unchanged for a same-owner factory reset).
        - hw_id known and owned by the SAME user (factory reset, FR-D07) -> credential rotated.
        - hw_id owned by ANOTHER user -> 409 device_owned; the owner must release it first.
        The device token (32 random bytes, hex) is returned ONCE; only its SHA-256 is stored (ADR-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hw_id, claim_token, fw]
              additionalProperties: false
              properties:
                hw_id: { type: string, pattern: "^nw-[0-9a-f]{12}$", example: "nw-a1b2c3d4e5f6" }
                claim_token: { type: string }
                name: { type: string, maxLength: 80, description: "Device name entered in the app (UC-02)" }
                fw: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_token, server_time, config]
                properties:
                  device_id: { type: string, format: uuid }
                  device_token: { type: string, pattern: "^[0-9a-f]{64}$", description: "Shown once; store in NVS" }
                  server_time: { type: integer, description: "Unix seconds" }
                  config: { $ref: "#/components/schemas/DeviceConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "claim_token unknown, expired or already used (error: claim_token_invalid)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "error: device_owned", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: "error: payload_too_large (body > 64 KiB)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { description: "[not in 4.B2] error: rate_limited; no per-IP/hw_id limit is implemented yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/Internal" }
  /ingest:
    post:
      tags: [device]
      summary: Upload a batch of samples, forecast and events; receive time, config and OTA manifest
      x-requirements: [FR-D01, FR-D02, FR-D04, FR-D05, FR-D06, FR-E01, FR-E03, FR-A07, NFR-04, NFR-06]
      description: |
        Hourly (FR-D02: 24 +/- 1 reports per day), immediately on a critical event (FR-E03), and on
        reconnect after an offline period (FR-D04). The device deletes a sample from its buffer only after
        a 2xx for the batch containing it. [Device-side behaviour, not enforced by the server: the device deliberately drops a
        batch that was rejected 3 times with 400/413, so one bad batch cannot block its buffer for good.] Idempotent on (device, ts): replays are counted as duplicates.
        Processing order (so data is visible in the app within 2 min, NFR-04): authenticate -> validate
        schema -> insert samples (plausible flag by G1 ranges: temp -10..60 degC, RH 0..100 %, lux 0..100000,
        battery 3000..4250 mV, moisture 0..100 %) -> insert events -> update device (last_seen_at, fw,
        forecast, cal) -> evaluate_alerts() -> push dispatch -> build response.
        Authentication failure semantics for firmware: 401 token_revoked means the device was released or
        deleted: it stops uploading, discards its buffer and re-enters setup mode [proposed, Mira to confirm].
        Limit: max 6 requests per device per hour; excess gets 429 with Retry-After [proposed] [not in 4.B2].
        4.B2 scope: a request without Authorization gets 401 before the body is read; a body that violates the schema gets 400/413
        before the token is looked up (token check and inserts are one database call). Push dispatch and the OTA manifest are not
        part of 4.B2: fw_target and model_target are always null. The idempotency key is (device, ts); a duplicate ts inside one
        request counts once. Samples are stamped with the token owner's id and plant at insert time (FR-A08).
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "device-report.schema.json" }
            example:
              v: 1
              sent_at: 1799000000
              trigger: scheduled
              fw: "0.1.0"
              model: "m0"
              forecast_h: 36.5
              samples:
                - { ts: 1798997200, moisture_pct: 41.2, moisture_raw: 1900, temp_c: 21.4, rh_pct: 48, lux: 320, vbat_mv: 3920 }
                - { ts: 1798998100, moisture_pct: 41.0, moisture_raw: 1904, temp_c: 21.5, rh_pct: 48, lux: 310, vbat_mv: 3918 }
              events: []
      responses:
        "200":
          description: Accepted (also when every sample was a duplicate)
          content:
            application/json:
              schema:
                type: object
                required: [server_time, accepted, duplicates, implausible, config]
                properties:
                  server_time: { type: integer, description: "Unix seconds; device re-syncs its RTC" }
                  accepted: { type: integer, description: "Samples newly stored" }
                  duplicates: { type: integer }
                  implausible: { type: integer, description: "Stored with plausible=false (outside G1 ranges)" }
                  config: { $ref: "#/components/schemas/DeviceConfig" }
                  fw_target: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Artifact" }] }
                  model_target: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Artifact" }] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "error: token_invalid (missing, malformed or unknown token) | token_revoked", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { description: "error: payload_too_large (more than 192 samples or body > 64 KiB)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "[not in 4.B2] error: rate_limited; the 6-per-hour limit is not implemented yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/Internal" }
  /device-release:
    post:
      tags: [app]
      summary: Release a device so another user can claim it
      x-requirements: [FR-A08, NFR-06]
      description: |
        Sets owner_id and plant_id to null, revokes the device token (next /ingest returns 401 token_revoked).
        History stays with the releasing owner (readings.owner_id). The app additionally revokes the
        device's hub credential on the LAN (architecture L-24); that call is not part of this API.
      security: [{ userJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [device_id], properties: { device_id: { type: string, format: uuid } } } } }
      responses:
        "204": { description: Released }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not your device (indistinguishable from unknown id)" }
  /plants/{id}:
    delete:
      tags: [app]
      summary: Delete a plant together with its photos and readings
      x-requirements: [FR-A08, NFR-07]
      description: |
        Calls the database function `delete_plant(p_plant)` (db-schema.sql). Deletes the plant, its photos,
        readings, events, alerts and tips. The sensor stays claimed (plant_id becomes null) and is released
        separately with POST /device-release. The app MUST show a warning first and offer the export
        (GET /export); there is no undo. In the app only the JSON export (photos downloaded into the archive, A-107) satisfies the
        export-before-delete gate and unlocks this call; a CSV export lists the photos but does not contain them, so it does NOT unlock
        deletion (wording change, NFR-07; ADR/Q-ID note pending with Theo). Photo objects in Storage bucket 'plant-photos' are removed by the caller
        from the returned `photo_paths`. Readings recorded before the sensor was assigned to this plant are kept.
      security: [{ userJwt: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [plant_id, photo_paths, deleted]
                properties:
                  plant_id: { type: string, format: uuid }
                  photo_paths: { type: array, items: { type: string } }
                  deleted: { type: object, properties: { readings: { type: integer }, events: { type: integer }, alerts: { type: integer }, photos: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not your plant (indistinguishable from unknown id)" }
  /api-keys:
    post:
      tags: [app]
      summary: Create a personal API key for the MCP server (premium)
      x-requirements: [FR-P03, FR-P04, NFR-06]
      description: Key = "nwk_" + 32 random bytes base64url. Returned ONCE; only SHA-256 and the 8-char prefix are stored. 403 premium_required for free users.
      security: [{ userJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 60 } } } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, required: [id, key, prefix], properties: { id: { type: string, format: uuid }, key: { type: string }, prefix: { type: string } } } } }
        "403": { $ref: "#/components/responses/PremiumRequired" }
    get:
      tags: [app]
      summary: List own keys (never the key itself)
      x-requirements: [FR-P03]
      description: Equivalent to a supabase-js select on api_keys; listed for completeness.
      security: [{ userJwt: [] }]
      responses:
        "200": { description: OK }
  /api-keys/{id}:
    delete:
      tags: [app]
      summary: Revoke a key; the next MCP call with it fails
      x-requirements: [FR-P03, NFR-06]
      security: [{ userJwt: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked (sets revoked_at) }
        "404": { description: Not found }
  /export:
    get:
      tags: [app]
      summary: Export all of the user's data (JSON or CSV)
      x-requirements: [NFR-07, FR-A01, NFR-06]
      description: |
        Implemented in task 4.B2c by the edge function `export` (cloud/supabase/functions/export, `verify_jwt = false`; the function verifies
        the user JWT itself with auth.getUser, NFR-06). The user is ONLY the one the token identifies; no parameter can name another user,
        and every table is read with an explicit owner filter (service-role SQL function export_account, migration ..0008).
        Available to free and premium users alike, covers all retained data (raw readings 3 months, hourly roll-up 12 months), and is not
        subject to the 7-day free-user read window of the readings policy. No device tokens, API-key hashes, push tokens or claim tokens.
        format=json: one JSON document {exported_at, profile, plants, devices, readings, readings_hourly, events, alerts, tips,
        photos:[{id, plant_id, taken_at, url, expires_at, file}]}. `plants` is always a top-level array (the app client rejects anything
        else); an account without data answers 200 with empty arrays, never an empty body.
        Photos are linked, not embedded: `url` is a signed Storage URL valid 7 days, `expires_at` its absolute end (exported_at + 7 days),
        `file` the name to save it under ('<plant_id>/<uuid>.jpg'). The APP downloads the photos from these URLs before it unlocks account
        deletion (A-107 option b); after deletion the Storage objects are gone. A photo whose Storage object is missing has url and
        expires_at null, and so does a photo row whose storage_path is not exactly '<caller id>/<folder>/<file>' (contains '..', a leading '/',
        a backslash or other unsafe characters, or another user's prefix): such a path is never signed. If Storage signing fails, the whole request fails with 500 (never a document without photo links).
        Upload path contract: '<uid>/<plant_id>/<uuid>.<ext>', each segment only [A-Za-z0-9._-]; any other path exports with url null.
        format=csv: application/zip with plants.csv, devices.csv, readings.csv, readings_hourly.csv, events.csv, alerts.csv, tips.csv,
        photos.csv (id, plant_id, taken_at, url, expires_at, file) (UTF-8, header row, ISO-8601 UTC timestamps, one row per record,
        RFC 4180 quoting; text cells starting with = + - @ get a leading ' against spreadsheet formula injection).
        Responses are `Cache-Control: no-store`. Size/time limits of the Supabase function runtime are UNVERIFIED (the document is built
        in memory); if a large export times out, move to an async job (4.B1 to confirm). Not run against a live project.
      security: [{ userJwt: [] }]
      parameters: [{ name: format, in: query, required: true, schema: { type: string, enum: [json, csv] } }]
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                type: object
                required: [exported_at, profile, plants, devices, readings, readings_hourly, events, alerts, tips, photos]
                properties:
                  exported_at: { type: string, format: date-time }
                  profile: { type: [object, "null"] }
                  plants: { type: array, items: { type: object } }
                  devices: { type: array, items: { type: object } }
                  readings: { type: array, items: { type: object } }
                  readings_hourly: { type: array, items: { type: object } }
                  events: { type: array, items: { type: object } }
                  alerts: { type: array, items: { type: object } }
                  tips: { type: array, items: { type: object } }
                  photos:
                    type: array
                    items:
                      type: object
                      required: [id, plant_id, taken_at, url, expires_at, file]
                      properties:
                        id: { type: string, format: uuid }
                        plant_id: { type: string, format: uuid }
                        taken_at: { type: string, format: date-time }
                        url: { type: [string, "null"], description: "Signed Storage URL, valid 7 days; null if the object is missing" }
                        expires_at: { type: [string, "null"], format: date-time }
                        file: { type: string }
            application/zip: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
  /account:
    delete:
      tags: [app]
      summary: Delete the account and all its data
      x-requirements: [FR-A01, FR-A08, NFR-07, NFR-06]
      description: |
        Implemented in task 4.B2b (edge function `delete-account`, `verify_jwt = false`; the function verifies the user JWT itself
        with auth.getUser, FR-A01, NFR-06). The user to delete is ONLY the one the token identifies; the body cannot name a user
        (unknown properties -> 400), so one user can never delete another (NFR-06).
        Order: release and revoke all devices (device rows stay as unowned hardware, plant link cleared, device token revoked, open
        claim tokens deleted; FR-A08) -> delete Storage objects under '<owner_id>/' in plant-photos -> delete auth.users row
        (FK cascade removes profiles, plants, plant_images, readings, readings_hourly, events, alerts, tips, api_keys, push_tokens,
        claim_tokens; GDPR erasure, NFR-07). Verified for the SQL cascade in db-schema.test.sql and for the whole function in
        cloud/test/functions/api.test.ts against a local Postgres (Storage and hosted Auth are stubbed there: UNVERIFIED against a live project).
        Failure semantics: if a step fails the function returns 500 and has NOT deleted the auth user, so the client retries; every
        step is idempotent. A repeated call with a token whose user still resolves returns 204 again; once the auth user is gone
        the hosted Auth rejects the token, so the repeat gets 401 (the account is already erased).
        Export (FR-A08) before deleting is the app's job (UC flow), not enforced here. The app's gate opens only after a complete JSON
        export (photos downloaded and handed to the user, A-107, NFR-07); a CSV export alone does NOT unlock account deletion.
      security: [{ userJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], additionalProperties: false, properties: { confirm: { type: string, enum: [DELETE] } } } } }
      responses:
        "204": { description: Deleted (empty body) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { description: "error: payload_too_large (body > 64 KiB)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/Internal" }
  /analytics:
    get:
      tags: [app]
      summary: 30- or 90-day aggregates, trend, watering events and comparison for the user's plants (premium)
      x-requirements: [FR-P01, FR-P04]
      description: |
        [built, 4.B4 slice 2] Implemented by the edge function `analytics` (cloud/supabase/functions/analytics; handler in _shared/analytics.ts,
        aggregates in cloud/analytics/aggregate.ts). No migration. Not deployed. The function calls public.is_premium() as the user first
        (FR-P04, ADR-008) and returns 403 premium_required before reading any reading. Every query runs as the user under RLS (owner_id = auth.uid()),
        so no parameter can name another user. Response carries Cache-Control: no-store.
        Watering events: the rule is decided (A-115): a soil rise of 10 percentage points or more, and two readings more than 2 hours apart do not join into one event.
        Per plant: readingCount (plausible samples in the window), soil percent and battery mV as mean/min/max (null when no usable sample),
        wateringEvents (consecutive plausible soil samples at most 2 h apart whose rise is 10 soil percent points or more, decided A-115),
        trend (mean of the last 7 days minus mean of the first 7 days of the window, soil percent points; null if either week is empty).
        Plants are sorted by name. Plants with no readings are listed with zeros and nulls.
        [proposed, 4.B4b: not built yet] (ADR-018, owner decision A-131) Each plant also carries an optional `daily` array for the 30/90-day line chart:
        one item per UTC calendar day of the window (the `window_days` dates ending today, oldest first, at most 90, empty days included),
        {date YYYY-MM-DD (UTC), soil_pct_mean, battery_mv_mean (null for a day with no value), reading_count}. Same plausible-only, own-rows-only,
        premium-gated rules as the aggregates (FR-P04, NFR-06). Additive: existing clients ignore it. Clients treat null as a gap, never as 0.
        The deployed function does not return `daily` yet; it is not in `required` until built.
        [proposed, A-140] UTC calendar days, and the first rolling-window day not being listed (so daily counts may not add up to reading_count), await the owner's confirmation.
      security: [{ userJwt: [] }]
      parameters:
        - { name: window, in: query, required: true, schema: { type: integer, enum: [30, 90] } }
      responses:
        "200":
          description: Aggregates per plant, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [window_days, plants]
                properties:
                  window_days: { type: integer, enum: [30, 90] }
                  plants:
                    type: array
                    items:
                      type: object
                      required: [plant_id, name, reading_count, soil_pct, battery_mv, watering_events, trend]
                      properties:
                        plant_id: { type: string, format: uuid }
                        name: { type: string }
                        reading_count: { type: integer, minimum: 0 }
                        soil_pct: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Stat" }] }
                        battery_mv: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Stat" }] }
                        watering_events: { type: integer, minimum: 0 }
                        daily:
                          description: "[proposed, 4.B4b: not built yet] ADR-018. One item per UTC calendar day of the window, oldest first, empty days included (length = window_days, at most 90). Optional until built."
                          type: array
                          minItems: 30
                          maxItems: 90
                          items:
                            type: object
                            required: [date, soil_pct_mean, battery_mv_mean, reading_count]
                            properties:
                              date: { type: string, format: date, description: "YYYY-MM-DD, UTC calendar day" }
                              soil_pct_mean: { type: [number, "null"], description: "null = no soil reading that day (a gap, not 0)" }
                              battery_mv_mean: { type: [number, "null"], description: "null = no battery reading that day" }
                              reading_count: { type: integer, minimum: 0 }
                        trend:
                          type: object
                          required: [soil_change_pct, first_week_mean, last_week_mean]
                          properties:
                            soil_change_pct: { type: [number, "null"] }
                            first_week_mean: { type: [number, "null"] }
                            last_week_mean: { type: [number, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PremiumRequired" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    userJwt: { type: http, scheme: bearer, bearerFormat: "Supabase user JWT" }
    deviceToken: { type: http, scheme: bearer, bearerFormat: "256-bit hex device token (ADR-004)" }
  schemas:
    Stat:
      type: object
      description: "mean, min, max of the plausible samples in the window (4.B4)"
      required: [mean, min, max]
      properties: { mean: { type: number }, min: { type: number }, max: { type: number } }
    DeviceConfig:
      type: object
      required: [sample_interval_s, report_interval_s, dry_pct, wet_pct, low_battery_mv]
      description: "Per-device settings pushed with every response (architecture D-5). Defaults are the G1 decisions."
      properties:
        sample_interval_s: { type: integer, default: 900, description: "15 min (Requirements section 5)" }
        report_interval_s: { type: integer, default: 3600, description: "FR-D02" }
        dry_pct: { type: number, default: 25, description: "Dry threshold of the assigned plant; model input T (edge-ai-concept 2.2). Default 25 when no plant is assigned." }
        wet_pct: { type: number, default: 85 }
        low_battery_mv: { type: integer, default: 3400, description: "FR-D06; G1: 3.4 V" }
    Artifact:
      type: object
      required: [version, url, sha256, size_bytes]
      description: "OTA artefact. Integrity = SHA-256 over TLS (G1, A-009); image signing is a follow-up (needs its own ADR)."
      properties:
        version: { type: string }
        url: { type: string, format: uri, description: "Signed Storage URL, valid 1 h" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: integer }
        min_battery_mv: { type: integer, description: "Do not start the update below this voltage" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "Stable machine code, e.g. token_invalid, token_revoked, claim_token_invalid, device_owned, premium_required, bad_request, payload_too_large, method_not_allowed, internal, rate_limited, unauthorized" }
        message: { type: string }
  responses:
    BadRequest: { description: "error: bad_request (schema violation; message names the field)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid user JWT, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    PremiumRequired: { description: "error: premium_required (FR-P04)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    MethodNotAllowed: { description: "error: method_not_allowed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Internal: { description: "error: internal (database failure; details are never returned)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: "error: rate_limited", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
